      if (moved || performance.now() - downT > 500) return;   // swipe/scroll ou long-press → não é tap
      sd.classList.toggle('state-half');
      if (navigator.vibrate) navigator.vibrate(70);
    });
  })();

  // --- comandos (undo/redo/reset/fechar) ---
  function onCmd(c){
    if (c === 'undo'){ History.undo(); $('auxOutput').textContent = ''; }
    else if (c === 'redo'){ History.redo(); $('auxOutput').textContent = ''; }
    else if (c === 'reset'){ execute({ kind:'set', spec:{ count:1 } }); Parser.clear(); const sd=$('stateDisplay'); if (sd) sd.classList.remove('state-half'); }   // v13: ramo calc-mode removido. v21-23: CLR também restaura a fonte do display ao tamanho padrão (remove .state-half)
    clearError(); refresh();
  }

  // --- teclado dirigido por M14: faixa de vistas + (v14) carrossel paginado no modo quântico ---
  //     v14: bloco de COMANDO fixo (M nele) + 2 páginas que deslizam (translateX). pág.1 = paleta+numérico;
  //     pág.2 = cauda-longa full-width. 'page' é a fonte da verdade — o transform é sempre derivado dela (INV-4).
  // v14: gesto — limiares (INV-1). Tap (<AXIS_LOCK px) NUNCA vira swipe → a tecla sempre dispara.
  const SWIPE_AXIS_LOCK = 16;     // v21-34: px p/ decidir o eixo (horizontal=swipe | vertical=scroll nativo). 10→16 p/ tolerar o JITTER de um tap apressado logo após um swipe (dedo ainda em leve movimento) sem travar como micro-swipe. O guard geométrico do click herda este limiar.
  const SWIPE_COMMIT = 0.22;      // fração da largura do viewport p/ confirmar a troca de página
  // v14: reconcilia a VISTA a partir de 'page' (single source of truth). Chamado no fim de cada render e no fim do gesto.
  function applyPageView(){
    const track = $('pageStrip'); if (!track) return;   // só no modo quântico (no calc não há carrossel)
    track.style.transition = '';                        // reativa a transição CSS (o drag a desliga)
    track.style.transform = 'translateX(' + (-page * 50) + '%)';   // strip = 200%: cada página ocupa 50%
    for (const d of document.querySelectorAll('.kp-dot')) d.classList.toggle('on', +d.dataset.page === page);
    for (const pg of document.querySelectorAll('.kp-page')){ const act = +pg.dataset.page === page; pg.inert = !act; pg.setAttribute('aria-hidden', String(!act)); }
  }
  function switchPage(target){ page = Math.max(0, Math.min(1, target | 0)); applyPageView(); }   // clampa 0..1

  function buildPanel(grp){
    const second = secondLayer && grp.keys2;                                 // v26: 2nd ativo E o bloco tem 2ª camada → mostra keys2 (no MESMO lugar)
    const keys = second ? grp.keys2 : grp.keys;
    const ncol = second ? (grp.n2 || grp.n) : grp.n;
    const slug = (grp.label || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');   // p/ reordenar/escopar blocos
    const panel = document.createElement('div'); panel.className = 'kp-panel' + (slug ? ' zone-' + slug : '');
    if (grp.label){ const lab = document.createElement('div'); lab.className = 'kp-label'; lab.textContent = grp.label; panel.appendChild(lab); }
    const grid = document.createElement('div'); grid.className = 'kp-grid';
    grid.style.gridTemplateColumns = 'repeat(' + ncol + ',1fr)';
    for (const [k, label, cls] of keys){
      const b = document.createElement('button');
      b.className = 'kk' + (cls ? ' ' + cls : '') + (k ? '' : ' spacer');
      b.textContent = label;
      if (!k){ b.disabled = true; }
      else { b.dataset.action = k; if (k === 'op:prob' && showProb) b.classList.add('on'); if (k === 'key:2nd' && secondLayer) b.classList.add('on'); }   // v7: prob é toggle · v26: 2nd aceso quando ativo
      grid.appendChild(b);
    }
    panel.appendChild(grid);
    return panel;
  }
  function renderKeypad(){
    // v15: durante a entrada de ângulo/λ a GAVETA (#angleSheet, irmã de #keypad) cobre o teclado; este NÃO é reconstruído
    // (fica inert+dim via applySheet; o buffer é pintado no #display). No-op aqui ⇒ sem rebuild/replay por tecla.
    // v22-12: ampEntry idem — o rebuild apagava o kp-dimmed/inert (fundo voltava a aparecer habilitado durante a entrada de amplitude).
    if (angleEntry || lambdaEntry || ampEntry) return;
    const lay = Keymap.layout('quantum', page);
    // -- faixa de vistas (segmentada, perto do display) --
    const vstrip = $('viewStrip'); vstrip.textContent = '';
    for (const [k, label, cls] of (lay.strip || [])){
      const b = document.createElement('button');
      b.className = 'vstrip' + (cls ? ' ' + cls : '');
      b.textContent = label; b.dataset.action = k;
      // v14: 'form' NÃO acende (realce binário era ambíguo p/ 3 modos — factor/expand/matrix; o modo atual já aparece em #selection). Consistente c/ basis/fmt/∠.
      vstrip.appendChild(b);
    }
    const pad = $('keypad'); pad.textContent = '';
    pad.className = 'keypad-wrap mode-quantum paged' + (secondLayer ? ' kp-2nd' : '');   // v26: kp-2nd ativa os overrides de layout da 2ª camada
    // -- v26: bloco de comando FIXO + PÁGINA ÚNICA (sem carrossel/dots; a tecla 2nd alterna a 2ª camada in-place) --
    const cmd = document.createElement('div'); cmd.className = 'kp-command';
    cmd.appendChild(buildPanel(lay.command));
    pad.appendChild(cmd);
    const pg = lay.pages[0];
    const viewport = document.createElement('div'); viewport.className = 'kp-viewport';   // v26: BLOCO de largura cheia (SEM id #viewport → teclas roteiam por click normal, sem swipe); o grid .kp-page preenche o bloco
    const pageEl = document.createElement('div'); pageEl.className = 'kp-page'; pageEl.dataset.page = 0;
    const colL = document.createElement('div'); colL.className = 'kp-col kp-L';
    for (const grp of pg.L) colL.appendChild(buildPanel(grp));
    const colR = document.createElement('div'); colR.className = 'kp-col kp-R';
    const rGroups = Array.isArray(pg.R) ? pg.R : [pg.R];
    for (const grp of rGroups) colR.appendChild(buildPanel(grp));
    pageEl.appendChild(colL); pageEl.appendChild(colR);
    viewport.appendChild(pageEl); pad.appendChild(viewport);
  }
  // v15: abre/fecha a GAVETA de ângulo/λ (#angleSheet, IRMÃ de #keypad em #keypadArea). Existe no DOM só enquanto
  // aberta (+ durante o slide-out) → fechada = removida ⇒ sem colisão de seletor com o comando (⌫/ESC). Teclado atrás
  // inert+dim (sem click-through). Slide nos 2 sentidos por toggle de .open num elemento estável (sem replay por tecla).
  function applySheet(open){
    const pad = $('keypad');
    if (open){
      pad.inert = true; pad.classList.add('kp-dimmed');                 // teclado atrás: não-interativo + esmaecido
      let sheet = document.getElementById('angleSheet');
      if (!sheet){
        sheet = document.createElement('div'); sheet.className = 'angle-sheet'; sheet.id = 'angleSheet';
        const handle = document.createElement('div'); handle.className = 'sheet-handle'; sheet.appendChild(handle);   // affordance de arraste
        if (ampEntry){                                                 // v22-6: AMPLITUDE = pad CIENTÍFICO (√ sin cos exp e i + numérico), SEM os atalhos de ângulo
          for (const grp of Keymap.layout('amp').cols.R) sheet.appendChild(buildPanel(grp));
        } else {                                                       // ÂNGULO/λ = atalhos π/8·π/4·π/2 + pad enxuto
          sheet.appendChild(buildPanel({ label:'', n:3, keys:[['quick:π/8','π/8','k'],['quick:π/4','π/4','k'],['quick:π/2','π/2','k']] }));
          for (const grp of Keymap.layout('calc').cols.R) sheet.appendChild(buildPanel(grp));
        }
        document.getElementById('keypadArea').insertBefore(sheet, pad);   // ANTES de #keypad → .first() resolve p/ a gaveta (não p/ o comando inerte)
        initSheetSwipe(sheet);
      }
      requestAnimationFrame(() => sheet.classList.add('open'));         // slide up (transição num elemento estável)
    } else {
      pad.inert = false; pad.classList.remove('kp-dimmed');            // teclado VIVO imediatamente (sem janela inerte)
      const sheet = document.getElementById('angleSheet');
      if (!sheet) return;
      sheet.style.pointerEvents = 'none';                              // durante o slide-out, clicks passam p/ o teclado vivo
      sheet.classList.remove('open'); sheet.style.transform = '';      // slide down
      let done = false; const fin = () => { if (done) return; done = true; sheet.remove(); };
      sheet.addEventListener('transitionend', fin, { once: true });
      setTimeout(fin, 320);                                            // fallback se transitionend não disparar (reduced-motion / sem transição)
    }
  }
  // v15: swipe-down na gaveta = ESC/cancelar (espelha o invariante tap-vs-swipe do carrossel: limiar + axis-lock + suppress-click).
  function initSheetSwipe(sheet){
    let y0 = 0, x0 = 0, active = false, locked = false;
    sheet.addEventListener('pointerdown', (e) => { y0 = e.clientY; x0 = e.clientX; active = true; locked = false; });
    sheet.addEventListener('pointermove', (e) => {
      if (!active) return;
      const dy = e.clientY - y0, dx = e.clientX - x0;
      if (!locked){
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return;          // limiar: abaixo disso = ainda pode ser tap
        if (Math.abs(dy) <= Math.abs(dx)){ active = false; return; }    // axis-lock: horizontal → não é dismiss
        locked = true; sheet.classList.add('dragging');
      }
      if (dy > 0){ sheet.style.transform = `translateY(${dy}px)`; e.preventDefault(); }   // segue o dedo só p/ baixo
    });
    const end = (e) => {
      if (!active) return; active = false;
      if (locked){
        sheet.classList.remove('dragging');
        suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);            // descarta o click pós-arrasto (tap numa tecla NÃO é engolido)
        const dy = e.clientY - y0;
        sheet.style.transform = '';                                                        // a classe .open volta a controlar (snap-back) ou applySheet(false) leva p/ baixo
        if (dy > sheet.offsetHeight * 0.30){ if (ampEntry) cancelAmp(); else if (lambdaEntry) doLambda(true); else if (angleEntry) cancelAngle(); }   // commit → ESC
      }
    };
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', () => { if (active){ active = false; sheet.classList.remove('dragging'); sheet.style.transform = ''; } });
  }

  // --- roteamento central de ações (teclado, bloch) ---
  // v26: INDICADOR DE PROCESSAMENTO (canto inf. dir.). O cálculo é SÍNCRONO (BigInt em ℤ[ζ₁₆], sem Worker):
  // ele trava a thread, então (a) "mostrar→calcular→esconder" direto NÃO pinta o spinner (sem repaint entre
  // o show e o cálculo bloqueante) e (b) um debounce por TIMER não funciona (o timer só dispara DEPOIS que o
  // cálculo síncrono já terminou). Solução: GATING POR CUSTO PREVISTO — estimo o custo ANTES de aplicar; ops
  // baratas rodam síncronas e o indicador NUNCA aparece (zero pisca-pisca); só as pesadas cedem 1 quadro p/
  // pintar o indicador e então calculam. Limiar conservador (na dúvida, NÃO mostra). Calibrar no device.
  const Busy = (() => {
    const el = () => $('busyDot');
    return { show(){ const b = el(); if (b) b.hidden = false; }, hide(){ const b = el(); if (b) b.hidden = true; } };
  })();
  const BUSY_THRESHOLD = 5000;                         // unidades ~ "atualizações de amplitude" (≈ ops de BigInt)
  const FLAT_GATES = new Set(['X','Y','Z','S','T','P','Rz','Sdg','Tdg','SWAP','iSWAP']);   // permutação/diagonal: NÃO expandem o nº de termos
  function estimateCost(action){
    let cur; try { cur = History.current(); } catch(_){ return 0; }
    if (!cur) return 0;
    const n = cur.n || 1;
    const dim = 1 << n;                                                       // 2^n = dimensão cheia
    const terms = cur.amps ? cur.amps.size : (cur.terms ? cur.terms.length : 1);   // nº de termos não-nulos (estado esparso)
    const i = action.indexOf(':');
    const kind = i < 0 ? action : action.slice(0, i);
    const arg  = i < 0 ? '' : action.slice(i + 1);
    let po = {}; try { po = Parser.peekOperands() || {}; } catch(_){}
    const reps = po.power ? (1 << po.power) : 1;                              // v24: 2^j repetições multiplicam o custo
    if (kind === 'gate'){
      const isAll = po.allFlag || po.selection === 'ALL';
      const expanding = !FLAT_GATES.has(arg);                                 // H/Rx/Ry/U/√X/√Y criam superposição → enchem o vetor
      if (isAll) return reps * n * (expanding ? dim : terms);                 // aplica a cada qubit; expansão → ~n·2^n
      return reps * (expanding ? Math.min(dim, terms * 2) : terms);          // alvo específico → ~O(termos)
    }
    if (kind === 'preset'){
      const w = (arg === 'QFT' || arg === 'QFTinv') ? n * n : 2 * n;         // QFT ~ n² primitivas; demais ~ n
      return reps * w * dim;
    }
    if (kind === 'op'){
      if (['density','partial','schmidt','vonneumann','concurrence'].includes(arg)) return dim * dim;   // constroem matrizes ~ 2^n × 2^n
      if (arg === 'measure' || arg === 'corr') return terms * n;
      return terms;                                                          // prob/norm/⟨φ|ψ⟩/⊗/factor → leves
    }
    return 0;                                                                // SET (O(1)), navegação, seleção, tema, fmt — sempre leves
  }
  let busyPending = false;
  function routeAction(action){
    if (busyPending) return;                                                 // ignora novos toques enquanto a op pesada está em voo (evita dupla aplicação)
    if (estimateCost(action) < BUSY_THRESHOLD){ routeActionImpl(action); return; }   // caminho rápido: idêntico ao de antes
    busyPending = true; Busy.show();
    // double-rAF garante 1 PAINT do indicador antes do cálculo bloqueante; o routeActionImpl (cálculo + refresh)
    // roda no tick adiado, então o estado renderizado já é o novo. finally garante esconder mesmo em erro.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      try { routeActionImpl(action); }
      catch(e){ try { showError(e.message); } catch(_){} }
      finally { Busy.hide(); busyPending = false; }
    }));
  }
  function routeActionImpl(action){
    if (lambdaEntry){                                  // v4: durante entrada de λ: calc/=/⌫ ; CLR/mode = deixar simbólico (nó)
      if (action === 'eval'){ doLambda(false); }
      else if (action.startsWith('quick:')){ calcBuf = action.slice(6); calcResult = ''; refresh(); }   // v22: atalho de ângulo SUBSTITUI o buffer (não insere no meio → evita '2π/8')
      else if (action.startsWith('calc:')){ onCalc(action.slice(5)); }
      else if (action === 'key:BKSP'){ calcBuf = calcBuf.slice(0,-1); calcResult = ''; refresh(); }
      else if (action === 'angcycle'){ cycleAngle(); }   // v16: permite alternar rad↔turns DURANTE a entrada (antes era engolido pela guarda)
      else if (action === 'key:CLR' || action === 'mode'){ doLambda(true); }
      return;
    }
    if (ampEntry){                                     // v22-6: entrada de amplitude complexa (pad científico próprio)
      if (action === 'eval'){ doAmpEval(); }
      else if (action.startsWith('calc:')){ onCalc(action.slice(5)); }
      else if (action === 'key:BKSP'){ calcBuf = calcBuf.slice(0,-1); calcResult = ''; refresh(); }
      else if (action === 'key:CLR' || action === 'mode'){ cancelAmp(); }
      return;
    }
    if (angleEntry){                                   // durante entrada de ângulo: só calc/=/⌫/cancelar
      if (action === 'eval'){ doEval(); }
      else if (action.startsWith('quick:')){ calcBuf = action.slice(6); calcResult = ''; refresh(); }   // v22: atalho de ângulo SUBSTITUI o buffer (π/8, π/4, π/2)
      else if (action.startsWith('calc:')){ onCalc(action.slice(5)); }
      else if (action === 'key:BKSP'){ calcBuf = calcBuf.slice(0,-1); calcResult = ''; refresh(); }
      else if (action === 'angcycle'){ cycleAngle(); }   // v16: alterna rad↔turns DURANTE a entrada
      else if (action === 'key:CLR' || action === 'mode'){ cancelAngle(); }
      return;
    }
    if (action.startsWith('page:')){ switchPage(+action.slice(5)); return; }   // v14: page-dot → troca de página (swipe/setas chamam switchPage direto)
    if (action.startsWith('dispPane:')){ switchDisplayPane(+action.slice(9)); return; }   // v16/v19: setas laterais → estado/detalhe (v19 F3a substitui dots)
    if (action === 'dispExpand:toggle'){ toggleExpand(); return; }                          // v19 (F3b): seta inferior → expandir/restaurar
    if (action === 'theme'){ toggleTheme(); return; }                        // v4-ui: alterna claro/escuro
    if (action === 'about'){ const o = $('aboutOverlay'); if (o) o.hidden = false; return; }            // v26: abre o About
    if (action === 'aboutClose'){ const o = $('aboutOverlay'); if (o) o.hidden = true; return; }         // v26: fecha (backdrop / × )
    if (action === 'aboutNop'){ return; }                                    // v26: clique DENTRO do card não fecha (a delegação por closest pegaria o backdrop)
    const i = action.indexOf(':'); const kind = i < 0 ? action : action.slice(0, i); const arg = i < 0 ? '' : action.slice(i+1);
    const symMode = History.current().sym;
    try {
      if (symMode && ['bars','chbase','evidence'].includes(action)){ showError('unavailable in symbolic mode (basis/bars/per-qubit factoring require a concrete state)'); return; }
      // 'viewform' (forma fatorada↔expandida) FUNCIONA no modo simbólico: fatora os kets comuns (ex.: |ψ⟩)
      else if (action === 'chbase'){ cycleBasis(); }
      else if (action === 'fmtcycle'){ cycleFmt(); }
      else if (action === 'angcycle'){ cycleAngle(); }
      else if (action === 'viewform'){ const order = symMode ? ['factor','expand'] : ['factor','expand','matrix']; viewForm = order[(order.indexOf(viewForm) + 1) % order.length]; evidenceQ = null; evidenceBit = null; refresh(); }   // v3/v11: factor↔expand (simbólico pula matrix) | factor→expand→matrix (concreto)
      else if (action === 'evidence'){                                  // v3: evidenciar o QUBIT TODO (ambos os kets) na base atual
        const selp = Parser.getSelection();
        if (!Number.isInteger(selp)) showError('select a qubit (n Q) to factor');
        else { const same = (evidenceQ === selp && evidenceBit === null); evidenceQ = same ? null : selp; evidenceBit = null; refresh(); }   // toggle
      }
      else if (action === 'eval'){ doEval(); }
      else if (kind === 'key'){ onKey(arg); }
      else if (kind === 'ket'){                                       // v3: ket-string (preparação) OU evidenciar UM KET (n Q + ket cardeal). v4: kets abstratos (ψ/φ/χ) só preparam.
        const selq = Parser.selectedQubit();
        if (selq !== null && CARDINAL_KETS.includes(arg) && !History.current().sym){   // evidenciar só vale p/ ket cardeal em estado concreto
          qbasis[selq] = ketBasis(arg); evidenceQ = selq; evidenceBit = ketBit(arg); Parser.clear(); clearError(); refresh();
        } else { const r = Parser.ket(arg); if (r.error) showError(r.error); else clearError(); refresh(); }
      }
      else if (kind === 'gate'){ onGate(arg); }
      else if (kind === 'preset'){ onPreset(arg); }
      else if (kind === 'op'){
        const hadInput = (arg === 'bloch' || arg === 'prob' || arg === 'measure') ? Parser.selectPending() : false;   // v21-26: "n op" (dígito solto) = qubit alvo, igual a "n gate"
        // v21-27: operação-TOGGLE com INPUT deve sempre MOSTRAR o qubit pedido (nunca desligar). Sem input = toggle.
        if (hadInput && arg === 'prob') showProb = false;              // pré-seta p/ o toggle do onOp LIGAR (mostra P(Qn))
        if (hadInput && arg === 'bloch') blochOn = false;              // idem: a esfera ABRE/troca p/ Qn (não desliga)
        if (arg === 'bloch'){ showBloch(); return; }                   // v17: showBloch trata concreto E simbólico-separável (symBloch), com msg de recusa própria
        onOp(arg);   // v13: onOp é TYPE-AWARE — M/⊗ (concreto+simbólico), ⟨φ|ψ⟩/EV/concretas, prob/measure; trata o modo simbólico internamente
        if (arg !== 'saveBra' && arg !== 'tensor' && hasDetail()) switchDisplayPane(1);   // v16: op com RESULTADO → auto-rola p/ o detalhe (animado); M (confirmação) e ⊗ (troca de estado) NÃO rolam
      }
      else if (kind === 'cmd'){ onCmd(arg); }
      else if (kind === 'input'){ onInput(arg); }            // v22: |T⟩ / rand / amp — composição de estado de 1 qubit
      else if (kind === 'calc'){ onCalc(arg); }
    } catch (e){ showError(e.message); }
  }

  // --- roteamento de teclas do teclado primário ---
  const MATHKEY = { 'PI':'π', 'INVSQRT2':'(1/√2)', '+':'+', '-':'-', '*':'×', '/':'/', '(':'(', ')':')', '.':'.', 'NEG':'-' };
  function onKey(k){
    // v13: ramo calc-mode removido (calc aposentada); entrada de ângulo/λ trata CLR/⌫ no guard de routeAction
    if (/^[0-9]$/.test(k)) { const r = Parser.digit(k); if (r && r.error) showError(r.error); }
    else if (MATHKEY[k] !== undefined) { const r = Parser.feedMath(MATHKEY[k]); if (r && r.error) showError(r.error); }
    else if (k === 'Q') { const r = Parser.q(); if (r.error) showError(r.error); }
    else if (k === 'CTRL') { const r = Parser.ctrl(); if (r.error) showError(r.error); }
    else if (k === 'POW') { const r = Parser.setPow(); if (r.error) showError(r.error); }
    else if (k === '2nd') { secondLayer = !secondLayer; renderKeypad(); return; }   // v26: toggle (trava) da 2ª camada — re-render escolhe keys2; UI puro (não toca o buffer)
    else if (k === 'ALL') { const r = Parser.all(); if (r && r.error) showError(r.error); }
    else if (k === 'SET') { const r = Parser.set(); if (r.error){ showError(r.error); } else { try { execute(r.command); } catch(e){ showError(e.message); } } }
    else if (k === 'CLR') { Parser.clear(); clearError(); $('auxOutput').textContent = ''; switchDisplayPane(0); }   // v21-31: ESC também DISPENSA a mensagem do detalhe (ex.: "Result φ⊗ψ…") e volta ao painel do estado. (prob, sendo toggle, re-renderiza no refresh; só mensagens informativas são fechadas)
    else if (k === 'BKSP') { Parser.bksp(); }
    else if (k === '=') { /* confirma seleção/expressão — apenas re-renderiza */ }
    else if (Gate.exists(k)) { onGate(k); return; }
    if (blochOn && Parser.getSelection() === 'ALL'){ blochOn = false; applyExpand(); }   // v21-22: seleção→ALL (tecla ALL / CLR / SET) fecha a Bloch (esfera é de 1 qubit)
    refresh();
  }

  // v14: encolher-p/-caber proporcional — se a calculadora (altura natural fixa) for mais alta que a tela,
  // escala o #app inteiro via zoom (preserva as proporções fixas; só reduz, nunca aumenta → quando cabe, fica 1).
  // O viewport do carrossel já tem altura = página mais alta, então o zoom é estável entre páginas.
  function fitViewport(){
    // v26: no PWA (standalone) o layout é por CSS PURO (100dvh + display flex:1) — o sizing/zoom JS daqui
    // encolhia a largura e deixava sobra no rodapé. Mantido só p/ navegador/mobile-web (sem 100dvh confiável).
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){ const a=$('app'); if (a) a.style.zoom='1'; return; }
    if (_expanded) return;                                  // v19 (F3b): desplay expandido NÃO é resetado pelo fitViewport (ele rodava no resize triggered pela animação e revertia o disp.style.height)
    const app = $('app'); if (!app) return;
    app.style.zoom = '1';                                   // default desktop/navegador largo
    const disp = document.querySelector('.display');
    // v19-L21 (operadora): UNIFICA fluid height — PWA standalone, mobile E desktop browser
    // todos usam fitViewport p/ display preencher o viewport (full-HD não fica calculadora pequena com vazio).
    // O floor (172) vira o piso comum; o teto é viewport - chrome.
    // v21-38: viewport disponível = MAIOR entre as 3 fontes (clientHeight de LAYOUT, innerHeight, visualViewport.height).
    // No resume/bfcache (voltar do manual / retomar o app) o documentElement.clientHeight pode ficar ESTÁVEL porém
    // MENOR (valor restaurado obsoleto) → display curto → FAIXA vazia embaixo; re-medir a MESMA fonte não corrige.
    // O Math.max deixa a fonte correta vencer (uma stale-pequena não encolhe se outra está certa); o teto natural
    // é a tela real, então não cresce além. (Mantém o clientHeight no jogo: ele era o que resolvia o bug de reload.)
    const vvH = (window.visualViewport && window.visualViewport.height) || 0;
    const avail = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0, vvH) || window.innerHeight;
    const cs = getComputedStyle(app);
    const margins = (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
    if (disp){
      disp.style.height = '172px';                          // colapsa p/ medir o CHROME (tudo menos o display)
      const chrome = app.offsetHeight - disp.offsetHeight;
      disp.style.height = Math.max(172, avail - margins - chrome) + 'px';   // DEFINE a altura do display p/ preencher a tela
    }
    // v15: a gaveta de ângulo é overlay (position:absolute) ⇒ NÃO muda app.offsetHeight ⇒ o display não redimensiona na
    // entrada de ângulo/λ (susto resolvido na raiz; removido o cache _dispH do v14-29 — não é mais necessário).
    const natural = app.offsetHeight + margins;
    if (natural > avail && avail > 0) app.style.zoom = String(Math.max(0.5, avail / natural));   // telas pequenas: encolhe (floor 0.5)
  }

  // --- bootstrap ---
  function init(){
    // delegação central: qualquer elemento com data-action (teclado dinâmico, modeChip, bloch)
    document.addEventListener('click', (e) => {
      // v21-33: guard de ARRASTO independente de tempo — um click cujo release ficou longe do pointerdown
      // veio de um swipe/drag (carrossel, gaveta), NÃO de um tap. Mesma métrica por-eixo do swipe-lock
      // (SWIPE_AXIS_LOCK): se o gesto travou como swipe (>L num eixo), o click também é descartado; se
      // ficou abaixo de L (tap), dispara. Resolve o "1º tap engolido na pág.2" no device (Bell/⟨ZZ⟩/QFT/…),
      // onde a ordem synthetic-click↔pointerdown era imprevisível e a janela de 80ms do suppressClick falhava.
      const dragged = Math.abs(e.clientX - clickDownX) > SWIPE_AXIS_LOCK || Math.abs(e.clientY - clickDownY) > SWIPE_AXIS_LOCK;
      if (suppressClick || dragged){ suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      if (el.closest('#viewport')) return;   // v21-35: teclas do viewport (carrossel) são roteadas no POINTERUP (endDrag), imune à transição do strip — não duplicar aqui. Fora do viewport (comando M/undo/redo, setas do display, dots, Bloch) seguem pelo click.
      routeAction(el.dataset.action);
    });
    // v21-14: tick háptico no PRESSIONAR (pointerdown) — mais confiável que no click; 30ms (durações <~20ms
    // são ignoradas por muitos motores Android). Feature-detect (iOS não tem Vibration API → no-op). Passive:
    // só lê/dispara, não interfere nos handlers de swipe/drag. Toque numa tecla = elemento com data-action.
    document.addEventListener('pointerdown', (e) => {
      // v26: háptico é a PRIMEIRA ação do toque — dispara o motor ANTES de qualquer leitura/trabalho de JS
      // neste evento, p/ que o tick seja sentido no instante do contato (não atrás do re-render do routeAction,
      // que só roda no click/pointerup). Toque numa tecla = elemento com data-action. iOS sem Vibration API → no-op.
      const el = e.target.closest('[data-action]');
      if (navigator.vibrate && el && !el.disabled) navigator.vibrate(70);
      clickDownX = e.clientX; clickDownY = e.clientY;   // v21-33: âncora p/ o guard de arrasto no click (todo pointerdown, mesmo fora de tecla)
    }, { passive: true });
    // v19 (F3a): substitui initDisplayTap — as setas laterais usam delegação global de data-action (dispPane:0/1).
    document.addEventListener('keydown', (e) => {   // v26: ESC fecha o About (teclado físico no navegador/desktop)
      if (e.key === 'Escape'){ const o = $('aboutOverlay'); if (o && !o.hidden){ o.hidden = true; e.preventDefault(); } }
    });
    initDisplayOverflowObserver();   // v19 (F3b): observador idempotente p/ a affordance de expandir
    // v14: swipe/drag do carrossel — Pointer Events UNIFICAM toque (PWA) e mouse (desktop). Listeners no
    // #keypad (estável; renderKeypad recria os filhos). INV-1: tap (<AXIS_LOCK) nunca é interceptado;
    // só após travar o eixo HORIZONTAL captura+preventDefault; no release reconcilia via switchPage.
    (function initSwipe(){
      const pad = $('keypad');
      let startX = 0, startY = 0, dragging = false, locked = false, vw = 1, downActionEl = null;
      pad.addEventListener('pointerdown', (e) => {
        suppressClick = false;   // v21-29: um NOVO toque cancela a supressão pendente do swipe (o synthetic-click do swipe já passou antes deste pointerdown) → não engole o 1º tap (ex.: QFT logo após rolar p/ a pág.2)
        const vp = e.target.closest('#viewport');
        if (!vp || mode !== 'quantum' || angleEntry || lambdaEntry) return;   // só dentro da região paginável
        dragging = true; locked = false; startX = e.clientX; startY = e.clientY; vw = vp.clientWidth || 1;
        downActionEl = e.target.closest('[data-action]');   // v21-34: botão sob o DEDO no pointerdown (intenção do toque, antes de qualquer drift do arrasto)
      });
      pad.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (!locked){
          if (Math.abs(dx) < SWIPE_AXIS_LOCK && Math.abs(dy) < SWIPE_AXIS_LOCK) return;   // eixo indeciso → ainda pode ser tap
          if (Math.abs(dy) >= Math.abs(dx)){ dragging = false; return; }                  // vertical → solta p/ o scroll nativo (touch-action:pan-y)
          locked = true;
          const track = $('pageStrip'); if (track) track.style.transition = 'none';
          try { pad.setPointerCapture(e.pointerId); } catch(_){}
        }
        e.preventDefault();
        const track = $('pageStrip'); if (track) track.style.transform = 'translateX(calc(' + (-page * 50) + '% + ' + dx + 'px))';   // segue o dedo
      });
      function endDrag(e){
        if (!dragging) return;
        const wasLocked = locked; dragging = false; locked = false;
        if (wasLocked){
          const dx = e.clientX - startX;
          if (Math.abs(dx) > vw * SWIPE_COMMIT){                 // viajou o suficiente → SWIPE real → troca de página
            suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);   // o pointerup vira um click — descarta-o
            switchPage(page + (dx < 0 ? 1 : -1));                // reconcilia: transform = -page*50% (mata o drift, INV-1/INV-4)
            return;
          }
          applyPageView();                                       // travou mas NÃO commitou (tap apressado c/ jitter) → snap de volta à mesma página
        }
        // v21-35: dispara a tecla SEMPRE no POINTERUP, a partir do botão sob o qual o dedo desceu (downActionEl,
        // capturado no pointerdown). NÃO depende do `click` do touch — que NÃO é gerado quando o ALVO se move
        // entre o down e o up (strip em TRANSIÇÃO de página desliza o botão de baixo do dedo parado): era o
        // "háptico dispara mas a tecla não tem efeito; preciso esperar ~1s". O pointerup é confiável e imune a
        // isso. SEM suppressClick aqui (janela temporal engolia o próximo clique legítimo, ex.: seta do display);
        // a duplicação é evitada no handler de click, que IGNORA alvos dentro do #viewport (roteados aqui).
        if (downActionEl && !downActionEl.disabled) routeAction(downActionEl.dataset.action);
      }
      pad.addEventListener('pointerup', endDrag);
      pad.addEventListener('pointercancel', () => { if (locked) applyPageView(); dragging = false; locked = false; });
    })();
    // undo/redo/reset estão no próprio teclado (cmd:* via routeAction)
    // teclado físico (acessibilidade) — sensível ao modo
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const k = e.key;
      if (angleEntry || lambdaEntry || ampEntry){                       // v13/v22-3: entrada inline de ângulo/λ/amplitude (mesmo pad)
        if (/^[0-9.]$/.test(k)) onCalc(k);
        else if ('+-*/^()'.includes(k)) onCalc(k);
        else if (lambdaEntry && /^[a-zA-Zλμθφψχπ{}]$/.test(k)) onCalc(k);   // v4: símbolo livre / fase estruturada de λ (ex.: λ, t, e^{2πiθ})
        else if (k === 'Enter'){ e.preventDefault(); ampEntry ? doAmpEval() : lambdaEntry ? doLambda(false) : doEval(); }
        else if (k === 'Backspace'){ e.preventDefault(); calcBuf = calcBuf.slice(0,-1); calcResult=''; refresh(); }
        else if (k === 'Escape'){ if (ampEntry) cancelAmp(); else if (lambdaEntry) doLambda(true); else if (angleEntry) cancelAngle(); }
        return;
      }
      if (/^[0-9]$/.test(k)) onKey(k);
      else if (k === 'q' || k === 'Q') onKey('Q');
      else if (k === 'c' && !e.ctrlKey) onKey('CTRL');
      else if (['h','x','y','z','s','t'].includes(k.toLowerCase()) && !e.ctrlKey && !e.metaKey) onKey(k.toUpperCase());
      else if (k === 'Enter') onKey('SET');
      else if (k === 'Backspace'){ e.preventDefault(); onKey('BKSP'); }
      else if (k === 'Escape') onKey('CLR');
      else if (k === 'a' || k === 'A') onKey('ALL');
      else if (k === 'ArrowLeft' && mode === 'quantum'){ e.preventDefault(); switchPage(page - 1); }    // v14: setas trocam de página
      else if (k === 'ArrowRight' && mode === 'quantum'){ e.preventDefault(); switchPage(page + 1); }
      else return;
    });

    History.init(State.computational(1));
    Parser.clear();
    renderKeypad();
    refresh();
    // v21-42: trava a orientação em RETRATO. Primário = campo "orientation":"portrait" do manifest (PWA instalada).
    // Aqui, best-effort via Screen Orientation API — efeito IMEDIATO na PWA standalone sem reinstalar; no-op/erro
    // tratado fora dela (navegador comum, iOS, sem fullscreen → rejeita; ignoramos).
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch (_) {}
    // v14: define a altura do display p/ preencher (após o layout assentar) + em resize/rotação/reload-settle/resume.
    // v21-37: SALVA de re-tentativas (rAF + 120/400/900/1600ms) em TODO evento de show/resume — não só no load.
    // fitViewport TRAVA o `avail` (clientHeight) do instante em que roda; no resume/swipe-back o WebView reporta
    // um clientHeight transitoriamente MENOR (barras do sistema/transição assentando) → display/app curto →
    // FAIXA vazia embaixo. Uma medição única (o antigo setTimeout 80ms) latcheava esse valor errado; a salva
    // re-mede até ~1.6s e a medida final (correta, maior) vence. (Fenômeno aleatório = corrida com o assentamento.)
    const scheduleFit = () => { requestAnimationFrame(fitViewport); [120, 400, 900, 1600, 2500].forEach(d => setTimeout(fitViewport, d)); };
    scheduleFit();
    window.addEventListener('resize', fitViewport);
    window.addEventListener('orientationchange', scheduleFit);
    if (window.visualViewport){ window.visualViewport.addEventListener('resize', scheduleFit); window.visualViewport.addEventListener('scroll', fitViewport); }   // v21-38: scroll do visualViewport dispara quando as barras assentam (offset muda sem 'resize')
    window.addEventListener('load', scheduleFit);
    window.addEventListener('pageshow', scheduleFit);                  // bfcache/swipe-back de volta do manual: re-mede até assentar
    // v20-7 (operadora P6): PWA Android — ao voltar de outro app o display encolhe (visibilitychange dispara mas pageshow não em standalone).
    document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleFit(); });   // resume: salva, não medição única
    window.addEventListener('focus', scheduleFit);
  }

  return { init, refresh };
})();

// expõe os módulos p/ inspeção/console didático
window.QC = { Algebra, Gate, State, Engine, Ops, Parser, Render, History, Calc, Bloch, Keymap, UI,
              SymExpr, SymState, SymEngine, SymRules, Presets, Prep };
document.addEventListener('DOMContentLoaded', UI.init);

// PWA service worker — registra SÓ fora de file:// (SW não roda em file://; abrir o arquivo direto
// continua funcionando como página simples). Falha de registro é silenciosa (não afeta o uso).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
