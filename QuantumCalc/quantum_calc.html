      const r00 = rhoAmps[0][0], r01 = rhoAmps[0][1], r11 = rhoAmps[1][1];
      if (r00.ex && r01.ex && r11.ex){                  // Prop 2(ii): λ=(tr±√(tr²−4det))/2 EXATO no anel
        const tr   = A.ADD(r00, r11);
        const det  = A.ADD(A.MUL(r00, r11), A.NEG(A.MUL(r01, A.CONJ(r01)))); // ρ00ρ11 − |ρ01|²
        const disc = A.ADD(A.MUL(tr, tr), A.NEG(A.scaleInt(det, 4)));        // tr² − 4·det (real, exato)
        const d = ringSqrt(disc);
        if (d){
          const lamP = A.reduceExact(A.scaleInvSqrt2(A.ADD(tr, d), 2));      // (tr+d)/2
          const lamM = A.reduceExact(A.scaleInvSqrt2(A.SUB(tr, d), 2));      // (tr−d)/2
          return { vals:[A.toComplex(lamP).re, A.toComplex(lamM).re], amps:[lamP, lamM], exact:true };
        }
      }
      const C = ampMatToComplex(rhoAmps);               // fallback: disc deixa o anel → numérico honesto
      const tr = C[0][0].re + C[1][1].re;
      const det = C[0][0].re*C[1][1].re - (C[0][1].re*C[0][1].re + C[0][1].im*C[0][1].im);
      const s = Math.sqrt(Math.max(0, tr*tr - 4*det));
      return { vals:[(tr+s)/2,(tr-s)/2], amps:null, exact:false };
    }
    return { vals: eigHermitianNumeric(rhoAmps), amps:null, exact:false };
  }
  // Jacobi p/ Hermitiana via embedding real simétrico 2n×2n
  function eigHermitianNumeric(M){
    const n = M.length, C = ampMatToComplex(M), N = 2*n;
    const Ar = Array.from({length:N},()=>new Array(N).fill(0));
    for (let i=0;i<n;i++) for (let j=0;j<n;j++){
      Ar[i][j]=C[i][j].re; Ar[i+n][j+n]=C[i][j].re;
      Ar[i][j+n]=-C[i][j].im; Ar[i+n][j]=C[i][j].im;
    }
    const ev = jacobiEig(Ar).sort((a,b)=>b-a);
    const out=[]; for (let i=0;i<N;i+=2) out.push(ev[i]);  // pares duplicados
    return out;
  }
  function jacobiEig(Ain){
    const n=Ain.length, a=Ain.map(r=>r.slice());
    for (let sweep=0; sweep<100; sweep++){
      let off=0; for (let p=0;p<n;p++) for (let q=p+1;q<n;q++) off+=a[p][q]*a[p][q];
      if (off < 1e-22) break;
      for (let p=0;p<n;p++) for (let q=p+1;q<n;q++){
        if (Math.abs(a[p][q])<1e-300) continue;
        const th=(a[q][q]-a[p][p])/(2*a[p][q]);
        const t = (th===0) ? 1 : Math.sign(th)/(Math.abs(th)+Math.sqrt(th*th+1));
        const c=1/Math.sqrt(t*t+1), s2=t*c;
        for (let i=0;i<n;i++){ const aip=a[i][p], aiq=a[i][q]; a[i][p]=c*aip-s2*aiq; a[i][q]=s2*aip+c*aiq; }
        for (let i=0;i<n;i++){ const api=a[p][i], aqi=a[q][i]; a[p][i]=c*api-s2*aqi; a[q][i]=s2*api+c*aqi; }
      }
    }
    const ev=[]; for (let i=0;i<n;i++) ev.push(a[i][i]); return ev;
  }

  // ---- entropia de von Neumann do subsistema ----
  function vonNeumann(s, keepQubits){
    const { rho, keep } = reducedDM(s, keepQubits);
    const { vals, amps, exact } = eigForEntropy(rho);
    let S = 0; for (const l of vals){ if (l > 1e-12) S -= l * Math.log2(l); }
    const exactEig = exact && keep.length <= 2;          // honesto: só quando a raiz fechou no anel
    const valsStr = (exactEig && amps) ? amps.map(a => A.format(a, 'rect').text) : null;  // surds exatos
    return { S, vals, valsStr, keep, exactEig, approx: !exactEig };
  }

  // ---- decomposição de Schmidt (2 qubits, partição q0|q1) ----
  function schmidt2(s){
    if (s.n !== 2) throw new Error('Schmidt: implemented for 2 qubits (Q0|Q1 partition)');
    const { rho } = reducedDM(s, [0]);
    const { vals, amps, exact } = eigForEntropy(rho);    // λ = autovalores de ρ_A
    const lam = vals.map(v => Math.max(0, v));
    const coeffs = lam.map(Math.sqrt);
    const rank = lam.filter(v => v > 1e-9).length;
    const lambdaStr = (exact && amps) ? amps.map(a => A.format(a, 'rect').text) : null;   // λ exatos (surd)
    const coeffStr  = (exact && amps)                                                     // σ=√λ exato se ∈ anel
      ? amps.map(a => { const r = ringSqrt(a); return r ? A.format(r, 'rect').text : null; })
      : null;
    return { lambdas:lam, coeffs, rank, entangled: rank > 1, lambdaStr, coeffStr };
  }

  // valor esperado ⟨ψ|O|ψ⟩ de um Pauli O ∈ {X,Y,Z} num qubit (exato em ℤ[ω])
  function expectation(s, pauli, qubit){
    if (!['X','Y','Z'].includes(pauli)) throw new Error('observable must be X, Y or Z');
    if (qubit < 0 || qubit >= s.n) throw new Error(`invalid qubit Q${qubit}`);
    const Os = Engine.apply(s, pauli, { targets:[qubit], controls:[] });
    return A.reduceExact(inner(s, Os));   // ⟨ψ|(O|ψ⟩)
  }

  return { inner, norm, tensor, probabilities, probQ, corr, factorGlobalPhase, densityMatrix,
           reducedDM, partialTrace, blochVector, measure, concurrencePure,
           schmidt2, vonNeumann, expectation, n2Str, n2Value, sumNorm2, SUBSYS_CAP };
})();

/* =====================================================================
   M15 — symexpr : coeficiente SIMBÓLICO (v4). Expr = Σ monômios; monômio =
   amp(ℤ[ω]/numérico) × ∏ símbolo^potência. Estende Amp/PiAngle com símbolos
   livres (λ,μ,…). Simplificação MÍNIMA: só combina monômios de mesma
   assinatura (combineLike). Puro. (specs/technical/09 §7, padrão Composite)
   ===================================================================== */
const SymExpr = (() => {
  const A = Algebra;
  // monômio: { amp:Amp, syms:[[name,power], …] } ordenado por name, power≠0
  const sortSyms = (syms) => syms.filter(([,p]) => p !== 0).sort((x,y) => x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0);
  const key = (syms) => syms.map(([n,p]) => n+'^'+p).join('*');           // assinatura p/ combinar
  const mono = (amp, syms=[]) => ({ amp, syms: sortSyms(syms) });

  const fromAmp = (amp) => ({ mono: A.isZeroAmp(amp) ? [] : [mono(amp, [])] });
  const fromInt = (n) => fromAmp(A.fromInt(n));
  const atom = (name) => ({ mono: [mono(A.ONE, [[name, 1]])] });
  const ZERO = { mono: [] };
  const ONE  = fromAmp(A.ONE);

  // v4: ÁTOMO DE FASE estruturado e^{i·(coefN/coefD)·(π?)·sym} (símbolo livre). O nome do símbolo
  // codifica o descritor; potências DOBRAM o expoente no display (λ²=e^{2πiθ}²→e^{4πiθ}, p/ QPE).
  const PH = 'ph:';
  const gcdN = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
  const phaseName = (d) => PH + d.coefN + '/' + d.coefD + '/' + (d.hasPi?1:0) + '/' + d.sym;
  function phaseLabel(coefN, coefD, hasPi, sym){
    const neg = coefN < 0; let n = Math.abs(coefN), dd = coefD, g = gcdN(n, dd); n/=g; dd/=g;
    const coefStr = dd === 1 ? (n === 1 ? '' : String(n)) : '(' + n + '/' + dd + ')';
    // v7: em turns, fase simbólica SEM π → e^{2πi·…}; guard: se já tem π (ex.: 2πθ), não duplica
    const turns = (A.getAngleMode && A.getAngleMode() === 'turns' && !hasPi);
    const prefix = turns ? (coefStr === '' ? '2π' : '2π·' + coefStr) : (coefStr + (hasPi ? 'π' : ''));
    return 'e^{' + (neg ? '-' : '') + prefix + 'i' + sym + '}';
  }
  const isPhase = (name) => typeof name === 'string' && name.startsWith(PH);
  function phaseRender(name, power){
    const [coefN, coefD, hasPi, sym] = name.slice(PH.length).split('/');
    return phaseLabel(parseInt(coefN,10) * power, parseInt(coefD,10), hasPi === '1', sym);
  }
  const phaseAtom = (d) => ({ mono: [mono(A.ONE, [[phaseName(d), 1]])] });

  function combineLike(expr){                                              // combina monômios idênticos
    const map = new Map();
    for (const m of expr.mono){
      const k = key(m.syms), e = map.get(k);
      if (e) e.amp = A.ADD(e.amp, m.amp); else map.set(k, { amp:m.amp, syms:m.syms });
    }
    const out = [];
    for (const e of map.values()) if (!A.isZeroAmp(e.amp)) out.push(mono(e.amp, e.syms));
    return { mono: out };
  }
  const add = (a, b) => combineLike({ mono: a.mono.concat(b.mono) });
  const neg = (a) => ({ mono: a.mono.map(m => mono(A.NEG(m.amp), m.syms)) });
  const sub = (a, b) => add(a, neg(b));
  function mulMono(m1, m2){
    const syms = m1.syms.map(s => s.slice());
    for (const [n,p] of m2.syms){ const f = syms.find(s => s[0]===n); if (f) f[1]+=p; else syms.push([n,p]); }
    return mono(A.MUL(m1.amp, m2.amp), syms);
  }
  function mul(a, b){
    const out = [];
    for (const m1 of a.mono) for (const m2 of b.mono) out.push(mulMono(m1, m2));
    return combineLike({ mono: out });
  }
  const scaleAmp = (a, amp) => combineLike({ mono: a.mono.map(m => mono(A.MUL(m.amp, amp), m.syms)) });
  const isZero = (a) => a.mono.length === 0;
  const eq = (a, b) => isZero(sub(a, b));
  const approx = (a) => a.mono.some(m => !m.amp.ex);

  const SUP = { 2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹' };
  const symStr = (syms) => syms.map(([n,p]) => isPhase(n) ? phaseRender(n, p) : (p===1 ? n : (SUP[p] ? n+SUP[p] : n+'^'+p))).join('');
  const needsDot = (s) => /[\/+\-−()·]/.test(s);
  function monoStr(m, fmt){
    const ss = symStr(m.syms);
    if (!ss) return A.format(m.amp, fmt).text;
    const as = A.format(m.amp, fmt).text;
    if (as === '1') return ss;
    if (as === '−1' || as === '-1') return '−' + ss;
    return needsDot(as) ? as + '·' + ss : as + ss;
  }
  // v18: condensa fator comum REAL POSITIVO entre TODAS as monomials → {numExpr (amps ±1), den (=1/g)},
  // ou null se a condensação não dispara. Predicado fechado (7 condições) — espelha a precisão do
  // 'mesmo c exato' do fold v17. Recursão prova-terminação em 1 nível (numExpr.amps ±1 ⇒ den=1 ⇒ null).
  function condense(expr){
    const ms = expr.mono;
    if (ms.length < 2) return null;                                          // (1) ≥2 monômios
    if (ms.some(m => !m.amp.ex)) return null;                                // (2) eq EXATA ℤ[ζ₁₆] (sem approx)
    // (7) skip se algum sym de fase tiver coefD≠1 (numerador 'e^{(n/d)…}' quebraria [^()]+ do toKatex)
    if (ms.some(m => m.syms.some(([n]) => {
          if (!isPhase(n)) return false;
          const parts = n.slice(PH.length).split('/'); return parts[1] !== '1';
        }))) return null;
    // (3) g canonical positivo-real ∈ {amp_0, NEG(amp_0)}
    const a0 = ms[0].amp;
    let g = a0, c = A.toComplex(g);
    if (!(c.re > 1e-12 && Math.abs(c.im) < 1e-12)){
      g = A.NEG(a0); c = A.toComplex(g);
      if (!(c.re > 1e-12 && Math.abs(c.im) < 1e-12)) return null;
    }
    // (4) cada amp_k ∈ {g, −g} via eqAmp EXATO (.ex===true ⇒ caminho BigInt do eqAmp)
    const negG = A.NEG(g);
    for (const m of ms){
      if (!A.eqAmp(m.amp, g) && !A.eqAmp(m.amp, negG)) return null;
    }
    // (5) den = 1/g; se den===1 → null (sem /1; encerra a recursão em 1 nível)
    const den = A.DIV(A.ONE, g);
    if (A.eqAmp(den, A.ONE)) return null;
    // (6) den deve formatar como DENOMINADOR LIMPO — MESMA alternation que o toKatex aceita (contrato bilateral)
    const denText = A.format(den, 'rect').text;
    if (!new RegExp('^' + DENOM_ALT_SRC + '$').test(denText)) return null;     // v19 (F2): regex montado da const única DENOM_ALT_SRC (DRY com toKatex)
    // numExpr = expr × (1/g) → amps ficam ±1 por construção
    const numExpr = scaleAmp(expr, den);
    return { numExpr, den };
  }
  // { text, approx, compound } — compound ⇒ precisa de parênteses ao anexar a um ket
  function format(expr, fmt){
    if (isZero(expr)) return { text:'0', approx:false, compound:false };
    if (expr.mono.length >= 2){                                              // v18: condensa fator comum, se houver
      const c = condense(expr);
      if (c){
        const num = format(c.numExpr, fmt).text;                             // amps ±1 ⇒ condense(numExpr) retorna null → sem recursão
        const den = A.format(c.den, 'rect').text;                            // denominador SEMPRE em rect (magnitude real exata; bate o regex do toKatex)
        return { text:'('+num+')/'+den, approx: approx(expr), compound:false };
      }
    }
    let out = '';
    expr.mono.forEach((m, i) => {
      const s = monoStr(m, fmt);
      const neg = s.startsWith('−') || s.startsWith('-');
      const body = neg ? s.slice(1) : s;
      out += i === 0 ? (neg ? '−' : '') + body : (neg ? ' − ' : ' + ') + body;
    });
    return { text: out, approx: approx(expr), compound: expr.mono.length > 1 };
  }
  return { fromAmp, fromInt, atom, phaseAtom, ZERO, ONE, add, sub, neg, mul, scaleAmp,
           combineLike, isZero, eq, approx, format, condense, key };
})();

/* =====================================================================
   M16 — symstate : estado SIMBÓLICO (v4). Subsistemas CONCRETOS (1 qubit, bit
   por termo) e ABSTRATOS (|ψ⟩ rotulado, possivelmente decorado por nó não-avaliado).
   Termo = coef(Expr) × ⊗(slots). Imutável. fromKets generaliza State.fromKets
   p/ kets abstratos + coeficiente Expr. big-endian (slot 0 = Q0). (padrão Composite)
   ===================================================================== */
const ABS_LABELS = ['ψ','φ','χ'];
class SymState {
  constructor(layout, terms, selection='ALL'){
    this.layout = layout;        // ['c'|'a', …]  comprimento n (big-endian)
    this.terms = terms;          // [{ coef:Expr, slots:Slot[] }]; Slot 'c'='0'|'1', 'a'={label,nodes:[]}
    this.n = layout.length;
    this.selection = selection;
    this.sym = true;             // marcador de tipo (despacho na UI/engine)
    Object.freeze(this);
  }
  static isAbstract(k){ return ABS_LABELS.includes(k); }
  static fromKets(kets){
    if (!Array.isArray(kets) || kets.length === 0) throw new Error('ket-string vazia');
    if (kets.length > MAX_QUBITS) throw new Error(`N out of range (1..${MAX_QUBITS})`);
    const A = Algebra, R2 = A.exact(A.Z_ONE, 1);
    const CARD = { '0':[A.ONE,A.ZERO], '1':[A.ZERO,A.ONE], '+':[R2,R2], '-':[R2,A.NEG(R2)],
                   'i':[R2,A.MUL(R2,A.IMAG)], '-i':[R2,A.MUL(R2,A.NEG(A.IMAG))] };
    const layout = kets.map(k => SymState.isAbstract(k) ? 'a' : 'c');
    let terms = [{ coef: SymExpr.ONE, slots: [] }];
    for (const k of kets){
      if (SymState.isAbstract(k)){
        terms = terms.map(t => ({ coef:t.coef, slots: t.slots.concat([{ label:k, nodes:[] }]) }));
      } else {
        const vec = CARD[k]; if (!vec) throw new Error('unknown ket: ' + k);
        const next = [];
        for (const t of terms) for (let b = 0; b < 2; b++){
          if (A.isZeroAmp(vec[b])) continue;
          next.push({ coef: SymExpr.scaleAmp(t.coef, vec[b]), slots: t.slots.concat([String(b)]) });
        }
        terms = next;
      }
    }
    return new SymState(layout, SymState._combine(terms));
  }
  static slotKey(slots){
    return slots.map(s => (typeof s === 'string') ? 'c'+s : 'a'+s.label+'#'+s.nodes.join(',')).join('|');
  }
  static _combine(terms){                                     // combina termos de slots idênticos
    const map = new Map();
    for (const t of terms){
      const k = SymState.slotKey(t.slots), e = map.get(k);
      if (e) e.coef = SymExpr.add(e.coef, t.coef); else map.set(k, { coef:t.coef, slots:t.slots });
    }
    const out = [];
    for (const e of map.values()) if (!SymExpr.isZero(e.coef)) out.push(e);
    return out;
  }
  combineLikeTerms(){ return new SymState(this.layout, SymState._combine(this.terms), this.selection); }
  withTerms(terms){ return new SymState(this.layout, terms, this.selection); }
  withSelection(sel){ return new SymState(this.layout, this.terms, sel); }
  // v4: EXPANDE um ket abstrato no subsistema q numa superposição genérica L₀|0⟩ + L₁|1⟩
  // (amplitudes simbólicas ⟨0|L⟩=L₀, ⟨1|L⟩=L₁). Habilita CONTROLE ABSTRATO (teletransporte,
  // teste de Hadamard): após expandir, o subsistema vira concreto com coeficiente simbólico e
  // o motor concreto aplica a porta normalmente, propagando L₀/L₁. (Slot decorado por nó não expande.)
  expandAbstract(q){
    if (this.layout[q] !== 'a') return this;
    const label = this.labelAt(q);
    const s0 = SymExpr.atom(label + '₀'), s1 = SymExpr.atom(label + '₁');
    const out = [];
    for (const t of this.terms){
      const slot = t.slots[q];
      if (typeof slot !== 'object' || slot.nodes.length) throw new Error('cannot expand |' + label + '⟩ decorated by an unevaluated gate');
      const a0 = t.slots.slice(); a0[q] = '0';
      const a1 = t.slots.slice(); a1[q] = '1';
      out.push({ coef: SymExpr.mul(t.coef, s0), slots: a0 });
      out.push({ coef: SymExpr.mul(t.coef, s1), slots: a1 });
    }
    const layout = this.layout.slice(); layout[q] = 'c';
    return new SymState(layout, SymState._combine(out), this.selection);
  }
  // concreto-puro = layout todo 'c' E sem símbolo livre nos coeficientes (ψ₀,ψ₁,θ… ⇒ continua simbólico)
  isPureConcrete(){ return this.layout.every(c => c === 'c') && this.terms.every(t => t.coef.mono.every(m => m.syms.length === 0)); }
  approx(){ return this.terms.some(t => SymExpr.approx(t.coef)); }
  // rótulo-base de um subsistema abstrato (constante entre termos)
  labelAt(q){ const t = this.terms[0]; return t && this.layout[q] === 'a' ? t.slots[q].label : null; }
  // v13: produto tensorial this ⊗ other (big-endian: this = subsistemas altos/à esquerda, casando com
  // Ops.tensor(saved, current) = "φ ⊗ ψ"). Produto cartesiano de termos (coef×coef, slots concatenados),
  // depois _combine. REJEITA se os dois operandos compartilham um identificador próprio (rótulo de ket
  // abstrato ψ/φ/χ, ou símbolo de coeficiente livre como θ): mesmo nome = mesmo símbolo → combinar/aplicar
  // regra seria ambíguo e matematicamente falso (math-before-didactics). Imutável.
  tensor(other){
    const mine = this.symbolIds();
    const shared = [...other.symbolIds()].find(id => mine.has(id));
    if (shared) throw new Error(`rename — both states use "${shared}" (kets |ψ⟩|φ⟩|χ⟩ must differ; re-enter λ to change its symbol)`);
    if (this.n + other.n > MAX_QUBITS) throw new Error(`N out of range (1..${MAX_QUBITS})`);
    const terms = [];
    for (const ta of this.terms) for (const tb of other.terms)
      terms.push({ coef: SymExpr.mul(ta.coef, tb.coef), slots: ta.slots.concat(tb.slots) });
    return new SymState(this.layout.concat(other.layout), SymState._combine(terms));
  }
  // v13: conjunto de identificadores próprios — rótulos de kets abstratos + símbolos de coeficiente livres
  // (param θ extraído do átomo de fase ph:…/sym; ψ₀/ψ₁ reduzem ao ket base ψ). Base do guard de disjunção do ⊗.
  symbolIds(){
    const ids = new Set();
    for (let q = 0; q < this.n; q++) if (this.layout[q] === 'a'){ const t = this.terms[0]; if (t) ids.add(t.slots[q].label); }
    const baseId = (nm) => {
      const m = /ph:[^/]*\/[^/]*\/[^/]*\/(.+)$/.exec(nm);        // átomo de fase ␁ph:coefN/coefD/hasPi/SYM → captura SYM (ex.: θ), ignorando o multiplicador (e^{iθ} e e^{2iθ} colidem)
      const s = m ? m[1] : nm;
      const base = s.replace(/[₀₁]$/, '');                       // ψ₀/ψ₁ → ket base ψ
      return SymState.isAbstract(base) ? base : s;
    };
    for (const t of this.terms) for (const m of t.coef.mono) for (const [name] of m.syms) ids.add(baseId(name));
    return ids;
  }
  // v13: promove um State concreto a SymState (layout todo 'c'; coef = SymExpr.fromAmp(amp); pula amp-zero).
  static fromConcrete(state){
    const terms = [];
    for (const [idx, amp] of state.amps){
      if (Algebra.isZeroAmp(amp)) continue;
      terms.push({ coef: SymExpr.fromAmp(amp), slots: state.bits(idx).split('') });
    }
    return new SymState(Array(state.n).fill('c'), SymState._combine(terms));
  }
  // v17: FOLD — reescrita INVERSA de expandAbstract (passo de normalização). Reconhece um qubit
  // CONCRETO SEPARÁVEL cujos termos sejam exatamente c·L₀|0⟩ + c·L₁|1⟩ (MESMO c exato, MESMO rótulo
  // abstrato L, L₀/L₁ LINEARES) e o re-dobra no slot abstrato BARE {label:L, nodes:[]}. Idempotente
  // (o qubit vira 'a' ⇒ 2ª passada não casa). Como expandAbstract RECUSA ket decorado, o padrão L₀/L₁
  // só nasce de |L⟩ bare ⇒ dobrar p/ bare é exato (sem drop de gate). Puro. (Term Rewriting + Composite)
  fold(){
    let layout = this.layout, terms = this.terms, changed = false;
    for (let q = 0; q < layout.length; q++){
      if (layout[q] !== 'c') continue;
      const res = SymState._tryFoldQubit(layout, terms, q);
      if (res){ layout = res.layout; terms = res.terms; changed = true; }
    }
    return changed ? new SymState(layout, SymState._combine(terms), this.selection) : this;
  }
  // expr / `name` se TODO monômio tem `name` com potência EXATAMENTE 1; senão null (exige fator linear)
  static _divBySym(expr, name){
    const out = [];
    for (const m of expr.mono){
      const f = m.syms.find(s => s[0] === name);
      if (!f || f[1] !== 1) return null;
      out.push({ amp: m.amp, syms: m.syms.filter(s => s[0] !== name).map(s => s.slice()) });
    }
    return { mono: out };
  }
  // rótulos abstratos L tais que o coef contém o átomo L₀
  static _candidateLabels(expr){
    const out = new Set();
    for (const m of expr.mono) for (const [name] of m.syms)
      if (name.endsWith('₀')){ const base = name.slice(0, -1); if (ABS_LABELS.includes(base)) out.add(base); }
    return out;
  }
  // tenta dobrar o qubit q; devolve {layout,terms} ou null (não casa o padrão separável c·L₀/c·L₁)
  static _tryFoldQubit(layout, terms, q){
    if (!terms.length) return null;
    const groups = new Map();                                  // assinatura (slots exceto q) → [termos]
    for (const t of terms){
      if (typeof t.slots[q] !== 'string') return null;         // q precisa ser concreto em TODOS os termos
      const sig = SymState.slotKey(t.slots.filter((_, i) => i !== q));
      if (!groups.has(sig)) groups.set(sig, []);
      groups.get(sig).push(t);
    }
    let label = null; const folded = [];
    for (const ts of groups.values()){
      if (ts.length !== 2) return null;                        // o grupo precisa ser exatamente {q=0, q=1}
      const t0 = ts.find(t => t.slots[q] === '0'), t1 = ts.find(t => t.slots[q] === '1');
      if (!t0 || !t1) return null;
      let matched = null;
      for (const L of SymState._candidateLabels(t0.coef)){
        const c0 = SymState._divBySym(t0.coef, L + '₀'), c1 = SymState._divBySym(t1.coef, L + '₁');
        if (c0 && c1 && SymExpr.eq(c0, c1)){ matched = { L, c: c0 }; break; }
      }
      if (!matched) return null;
      if (label === null) label = matched.L; else if (label !== matched.L) return null;   // 1 rótulo por qubit
      const slots = t0.slots.slice(); slots[q] = { label, nodes: [] };
      folded.push({ coef: matched.c, slots });
    }
    const out = layout.slice(); out[q] = 'a';
    return { layout: out, terms: folded };
  }
}

/* =====================================================================
   M18 — symrules : registro de regras de autovalor U|ψ⟩=λ|ψ⟩ (v4). Chave =
   (gate, assinatura de params, rótulo do ket); λ = Expr (M15). Re-declaração
   sobrescreve. Consultável; global (declaração persiste). (padrão Term Rewriting)
   ===================================================================== */
const SymRules = (() => {
  const reg = new Map();
  const K = (gate, sig, label) => gate + '|' + (sig || '') + '|' + label;
  function declare(gate, sig, label, lambdaExpr){ reg.set(K(gate, sig, label), lambdaExpr); }
  function lookup(gate, sig, label){ return reg.get(K(gate, sig, label)) || null; }
  function entries(){ return [...reg.entries()].map(([k, v]) => ({ k, lambda:v })); }
  function clear(){ reg.clear(); }
  return { declare, lookup, entries, clear };
})();

/* =====================================================================
   M17 — symengine : aplica porta a uma SymState (v4). Regra ÚNICA: alvo(s)
   CONCRETO(s) → matriz ℤ[ω] (motor v1–v3, sobre os bits do termo); 1 alvo
   ABSTRATO → regra declarada (coef×=λ) ou nó não-avaliado U|ψ⟩; CONTROLADA
   controle-concreto/alvo-abstrato → kickback (λ ao ramo de controle=1).
   CONTROLE ABSTRATO → expande |ψ⟩ em ψ₀|0⟩+ψ₁|1⟩ (amplitudes simbólicas) e aplica concreto
   (teletransporte/teste de Hadamard). Alvo misto concreto+abstrato → não suportado (use controlada).
   Não muta; combineLikeTerms ao final. (padrão Term Rewriting + Composite)
   ===================================================================== */
const SymEngine = (() => {
  const A = Algebra;
  function gateLabel(op){
    const ps = op.paramLabels || (op.params ? op.params.map(x => (+x).toFixed(2)) : []);
    return op.gate + (ps && ps.length ? '(' + ps.join(',') + ')' : '');
  }
  const paramSig = (op) => (op.paramLabels || op.params || []).join(',');

  function applyOne(sym, op, rules){
    const meta = Gate.meta(op.gate); if (!meta) throw new Error('unknown gate: ' + op.gate);
    const targets = op.targets || [], controls = op.controls || [];
    for (const q of [...targets, ...controls]) if (q < 0 || q >= sym.n) throw new Error(`qubit Q${q} out of range (n=${sym.n})`);
    for (const c of controls) if (sym.layout[c] === 'a') sym = sym.expandAbstract(c);   // v4: controle abstrato → expande |ψ⟩ em ψ₀|0⟩+ψ₁|1⟩ (teletransporte/teste de Hadamard)
    const tAbs = targets.filter(q => sym.layout[q] === 'a');
    const tCon = targets.filter(q => sym.layout[q] === 'c');
    if (tAbs.length && tCon.length) throw new Error('gate between a concrete and an abstract target not supported (use a controlled gate)');
    if (tAbs.length > 1) throw new Error('abstract multi-target gate not supported (v4)');

    const out = [];
    for (const t of sym.terms){
      let ctrlOK = true;
      for (const c of controls) if (t.slots[c] !== '1'){ ctrlOK = false; break; }
      if (!ctrlOK){ out.push(t); continue; }                              // controle falha → termo intacto
      if (tAbs.length){                                                   // 1 alvo abstrato → regra/nó
        const q = tAbs[0], slot = t.slots[q];
        const lam = rules ? rules.lookup(op.gate, paramSig(op), slot.label) : null;
        const slots = t.slots.slice();
        if (lam){ slots[q] = { label:slot.label, nodes:slot.nodes.slice() }; out.push({ coef: SymExpr.mul(t.coef, lam), slots }); }
        else { slots[q] = { label:slot.label, nodes:slot.nodes.concat([gateLabel(op)]) }; out.push({ coef: t.coef, slots }); }
      } else {                                                            // alvos concretos → matriz ℤ[ω]
        const M = Gate.matrix(op.gate, op.params);
        const ts = tCon.length, tdim = 1 << ts;
        let inSub = 0; for (let j = 0; j < ts; j++) inSub = (inSub << 1) | (+t.slots[tCon[j]]);
        for (let outSub = 0; outSub < tdim; outSub++){
          const coeff = M[outSub][inSub];
          if (A.isZeroAmp(coeff)) continue;
          const slots = t.slots.slice();
          for (let j = 0; j < ts; j++) slots[tCon[j]] = String((outSub >> (ts - 1 - j)) & 1);
          out.push({ coef: SymExpr.scaleAmp(t.coef, coeff), slots });
        }
      }
    }
    return new SymState(sym.layout, SymState._combine(out), sym.selection);
  }

  function apply(sym, op, rules){
    if (op.kind === 'applyAll'){
      let s = sym;
      for (let q = 0; q < sym.n; q++)
        s = applyOne(s, { gate:op.gate, targets:[q], controls:[], params:op.params, paramLabels:op.paramLabels }, rules);
      return s.fold();                          // v17: normaliza (re-dobra ψ₀|0⟩+ψ₁|1⟩→|ψ⟩ se separável)
    }
    return applyOne(sym, op, rules).fold();     // v17: idem após cada porta (clímax do teleporte)
  }
  return { apply, gateLabel, paramSig };
})();

/* =====================================================================
   M6 — parser : FSM "teclas de papel" (specs/design/ui-layout, resolve C2/C3).
   Dígitos acumulam um número; Q fecha um ALVO; CTRL fecha um CONTROLE;
   a porta encerra o comando e valida a aridade. SET desambigua bitstring/contagem.
   Camada de aplicação (mutável); produz Commands declarativos p/ a UI.
   ===================================================================== */
const Parser = (() => {
  let num = '';            // dígitos pendentes (número em digitação)
  let ops = [];            // [{role:'q'|'ctrl', n:int}] na ordem digitada
  let allFlag = false;     // ALL ativo
  let selection = 'ALL';   // 'ALL' | int (qubit selecionado, p/ display)
  let expr = '';           // buffer de EXPRESSÃO de ângulo (π, 1/√2, operadores)
  let kets = [];           // v3: ket-string em digitação (estado-produto) — buffer EXCLUSIVO
  let pow = null;          // v24: expoente j pendente (porta/preset aplicada 2ʲ vezes); null = sem potência
  const POW_MAX = 10;      // v24: cap 2ʲ ≤ 1024 (protege a UI single-thread; QPE real usa j pequeno)

  function reset(){ num = ''; ops = []; allFlag = false; expr = ''; kets = []; pow = null; }
  const targetsOf = () => ops.filter(o => o.role === 'q').map(o => o.n);
  const controlsOf = () => ops.filter(o => o.role === 'ctrl').map(o => o.n);
  const ok  = (command) => ({ command });
  const err = (error) => ({ error });
  const KET_MISMATCH = 'confirm the ket-string with SET or clear (CLR)';

  function digit(d){
    if (!/[0-9]/.test(d)) return {};
    if (kets.length) return err('do not mix digits and kets — use CLR to restart');
    if (expr !== '') expr += d; else num += d; return {};
  }
  // tokens de expressão de ângulo: π, (1/√2), + - × / ( ) .  → modo expressão
  function feedMath(tok){ if (kets.length) return err(KET_MISMATCH); if (expr === '' && num !== ''){ expr = num; num = ''; } expr += tok; return {}; }
  // v3: anexa um ket cardeal à ket-string. Buffer exclusivo: erro se houver dígito/seleção/expressão pendente.
  function ket(K){
    if (num !== '' || ops.length || allFlag || expr !== '') return err('do not mix digits/selection and kets — use CLR to type kets only');
    kets.push(K); selection = 'ALL'; return {};
  }
  function q(){ if (kets.length) return err(KET_MISMATCH); if (num === '') return err('type an index before Q'); const n = parseInt(num,10); ops.push({role:'q', n}); selection = n; num = ''; return {}; }
  function ctrl(){ if (kets.length) return err(KET_MISMATCH); if (num === '') return err('type an index before CTRL'); ops.push({role:'ctrl', n:parseInt(num,10)}); num = ''; return {}; }
  // v24: token POW operandos-first — j (dígito pendente) vira expoente; o operador seguinte é aplicado 2ʲ vezes.
  // Ordem-insensível (campo escalar, fora de ops[]); POW repetido → último vence; cap j ≤ POW_MAX.
  function setPow(){ if (kets.length) return err(KET_MISMATCH); if (num === '') return err('type exponent before 2^j (e.g. 3 2^j)'); const j = parseInt(num,10); if (j > POW_MAX) return err(`exponent too large (max j=${POW_MAX})`); pow = j; num = ''; return {}; }
  function all(){ if (kets.length) return err(KET_MISMATCH); reset(); allFlag = true; selection = 'ALL'; return {}; }
  function clear(){ reset(); selection = 'ALL'; return {}; }
  function bksp(){
    if (expr !== '') expr = expr.slice(0,-1);
    else if (num !== '') num = num.slice(0,-1);
    else if (kets.length) kets.pop();
    else if (ops.length){ const last = ops.pop(); if (last.role==='q'){ const t=targetsOf(); selection = t.length?t[t.length-1]:'ALL'; } }
    else if (pow !== null) pow = null;   // v24: desfaz a potência pendente antes do ALL
    else if (allFlag) allFlag = false;
    return {};
  }

  function set(){
    if (kets.length){ const k = kets.slice(); reset(); selection='ALL'; return ok({ kind:'set', spec:{ kets:k } }); }   // v3: ket-string → estado-produto
    const tg = targetsOf();
    if (tg.length === 1 && num === '' && ops.length === 1){ const count = tg[0]; reset(); selection='ALL'; return ok({ kind:'set', spec:{ count } }); }
    if (num !== '' && /^[01]+$/.test(num)){ const bits = num; reset(); selection='ALL'; return ok({ kind:'set', spec:{ bits } }); }
    return err('SET: type a bitstring (0/1), a ket-string (|0⟩|+⟩…) or "N Q SET" for the count');
  }

  function applyGate(name, params){
    if (kets.length) return err(KET_MISMATCH);
    const m = Gate.meta(name); if (!m) return err('unknown gate: ' + name);
    let tg = targetsOf(), ct = controlsOf();
    if (allFlag){
      if (ct.length) return err('ALL and CTRL are mutually exclusive');                 // v24: A4 — exclusivos
      if (m.targets !== 1 || m.controls !== 0) return err(`ALL accepts only 1-qubit gates (not ${name})`);
      const power = pow; reset(); return ok({ kind:'applyAll', gate:name, params, power });
    }
    if (num !== ''){ tg = tg.concat(parseInt(num,10)); }     // número final solto → alvo
    if (tg.length === 0 && ct.length === 0 && m.targets === 1 && m.controls === 0){
      if (selection === 'ALL'){ const power = pow; reset(); return ok({ kind:'applyAll', gate:name, params, power }); }
      tg = [selection];                                       // usa a seleção ativa
    }
    // v24: aridade de ALVOS estrita; CONTROLES só limite SUPERIOR relaxado (CTRL generalizado → controles extras
    // viram MCX/MCZ via applyN). Erro só quando faltam alvos/controles ou sobram alvos — controle extra é aceito.
    if (tg.length !== m.targets || ct.length < m.controls){
      const ex = `${m.controls} control(s) + ${m.targets} target(s)`;
      const hint = m.controls > 0 ? ` (e.g.: ${'c CTRL '.repeat(m.controls)}${'t Q '.repeat(m.targets)}${name})`
                                  : (m.targets > 1 ? ` (e.g.: ${'t Q '.repeat(m.targets)}${name})` : ` (e.g.: n Q ${name} or ALL ${name})`);
      return err(`${name}: expected ${ex}; got ${ct.length}+${tg.length}${hint}`);
    }
    const power = pow; reset();
    return ok({ kind:'apply', gate:name, targets:tg, controls:ct, params, power });
  }

  // v9: dispara um PRESET/macro. Alvos via Q (range) ou ALL; CTRL não se aplica.
  // A resolução final dos qubits (ALL→0..n-1, dois Q→range [min..max]) e a aridade mínima
  // ficam no M11 execute (que conhece n). Aqui só coletamos a seleção.
  function preset(name){
    if (kets.length) return err(KET_MISMATCH);
    const ct = controlsOf();                                  // v24: CTRL → preset controlado (controle injetado em cada op)
    let tg = targetsOf();
    if (num !== ''){ tg = tg.concat(parseInt(num,10)); }
    // v21-25: indicador ALL (default, sem alvos pendentes) JÁ vale como "todos" — como as portas de 1 qubit já fazem.
    // Antes exigia re-apertar a tecla ALL (allFlag); agora basta o estado default ALL (Bell/QFT/GHZ/Grover/W direto).
    if (allFlag || (selection === 'ALL' && tg.length === 0 && ct.length === 0)){
      if (ct.length) return err('ALL and CTRL are mutually exclusive');   // (inalcançável c/ a guarda acima, mas explícito p/ allFlag)
      const power = pow; reset(); selection='ALL'; return ok({ kind:'preset', name, all:true, controls:[], power });
    }
    if (tg.length === 0) return err(`${name}: select the qubits — ALL ${name} or "i Q j Q ${name}"`);
    const power = pow; reset(); selection='ALL';
    return ok({ kind:'preset', name, qsel:tg, controls:ct, power });
  }

  function bufferText(){
    const parts = [];
    if (kets.length) parts.push(kets.map(k => '|' + k.replace('-','−') + '⟩').join(''));   // v3: ket-string em construção
    if (allFlag) parts.push('ALL');
    const ct = controlsOf(), tg = targetsOf();
    if (ct.length) parts.push('ctrl ' + ct.map(n=>'Q'+n).join(','));
    if (tg.length) parts.push('target ' + tg.map(n=>'Q'+n).join(','));
    if (num !== '') parts.push('num ' + num);
    if (pow !== null) parts.push('pow 2^' + pow);            // v24: expoente pendente (operador aplicado 2ʲ vezes)
    return parts.length ? parts.join('  ·  ') : '—';
  }

  return {
    digit, feedMath, q, ctrl, setPow, all, set, clear, bksp, applyGate, preset, reset, bufferText, ket,
    getExprRaw: () => expr,
    clearExpr: () => { expr = ''; },
    getSelection: () => selection,
    setSelection: (s) => { selection = s; },
    // v21-26/27: a operação CONSOME a especificação de qubit do comando (dígito solto, "n Q", ou ALL) e a fixa
    // na SELEÇÃO — como as portas consomem o alvo. Retorna se HOUVE input (input ⇒ op-toggle MOSTRA, não alterna).
    selectPending: () => {
      const tg = targetsOf();
      const hadSpecific = (num !== '') || tg.length > 0;   // qubit ESPECÍFICO (dígito ou "n Q"); ALL/nada NÃO conta → op-toggle alterna
      if (num !== '') selection = parseInt(num, 10);
      else if (tg.length) selection = tg[tg.length - 1];
      else if (allFlag) selection = 'ALL';
      reset();
      return hadSpecific;
    },
    // v4: operandos pendentes no buffer (alvos+controles), SEM resetar — usado p/ detectar alvo abstrato antes de aplicar
    peekOperands: () => ({ targets: targetsOf().concat(num !== '' ? [parseInt(num,10)] : []), controls: controlsOf(), allFlag, selection, power: pow }),
    // v3: qubit recém-selecionado por "n Q" (nada mais pendente) — usado p/ evidenciar via tecla de ket
    selectedQubit: () => (ops.length === 1 && ops[0].role === 'q' && num === '' && !allFlag && !kets.length && expr === '') ? ops[0].n : null,
  };
})();

/* =====================================================================
   M7 — render : Dirac simbólico + estratégias de fase (exp/ret/polar) e
   de base ({|0⟩,|1⟩}/{|+⟩,|−⟩}/{|+i⟩,|−i⟩}). Formatação PURA (sem DOM);
   a M11 pinta via textContent (sem innerHTML com entrada → sem XSS, T-8).
   ===================================================================== */
const Render = (() => {
  const SYM = { comp:['0','1'], had:['+','−'], circ:['+i','−i'] };
  const BASIS_LABEL = { comp:'{|0⟩,|1⟩}', had:'{|+⟩,|−⟩}', circ:'{|+i⟩,|−i⟩}' };
  const MAX_TERMS = 64;

  const SHORT = { comp:'Z', had:'X', circ:'Y' };
  // base por qubit efetiva: array de comprimento n (qbasis explícito, ou uniforme a partir de state.basis)
  const effQB = (state, qbasis) => (Array.isArray(qbasis) && qbasis.length === state.n)
    ? qbasis : Array(state.n).fill(state.basis || 'comp');
  // rótulo de ket na base de CADA posição (qb[q]). Base UNIFORME → compacto (|++⟩);
  // bases DIFERENTES → kets separados por ⊗ (|0⟩⊗|+⟩⊗|1⟩), evitando ambiguidade.
  const ketLabel = (bits, qb) => {
    const syms = bits.split('').map((b, q) => SYM[qb[q]][+b]);
    return qb.every(b => b === qb[0]) ? '|' + syms.join('') + '⟩' : syms.map(s => '|' + s + '⟩').join('⊗');
  };
  const basisLabelOf = (qb) => qb.every(b => b === qb[0]) ? BASIS_LABEL[qb[0]] : qb.map(b => SHORT[b]).join('');

  // termos do estado na base de display POR QUBIT + formato de fase
  // v19 (F1): expõe `amp` raw em cada item p/ _condenseConcrete poder operar antes do format.
  function terms(state, fmt, qbasis){
    const qb = effQB(state, qbasis);
    const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
    const amps = view.amplitudes();
    let approx = false;
    const list = amps.map(({ bits, amp }) => {
      const f = Algebra.format(amp, fmt); if (f.approx) approx = true;
      return { coef:f.text, ket:ketLabel(bits, qb), approx:f.approx, amp };
    });
    return { list, approx, qb };
  }

  // v19 (F1): CONDENSE CONCRETO — espelha SymExpr.condense (v18) no path concreto.
  // Predicado de 7 condições (espelha v18 menos phase-coef guard, N/A no concreto; +threshold de termos
  // descoberto via human-AV: numerador longo em \dfrac não quebra linha — 16 termos vira linha única
  // ilegível e horizontalmente rolável. v19-L1 capitalizada.): 2≤#terms≤4 (Bell 2/GHZ 2/kickback 4
  // cabem; ALL H em ≥3 qubits volta à forma expandida que quebra em linhas naturalmente); todo
  // amp.ex=true; g real positivo (toComplex.re>1e-12 ∧ |im|<1e-12) ∈ {amp_0, NEG(amp_0)}; cada amp
  // ∈ {g, −g} via eqAmp exato ℤ[ζ₁₆]; den=DIV(ONE,g); den.eqAmp(ONE) → null (sem /1, recursão N/A);
  // denText em 'rect' casa ^DENOM_ALT_SRC$ (contrato bilateral com toKatex regra v18).
  // Retorna a string Dirac condensada '(±ket±ket…)/denText' OU null. Recebe `[{amp:Amp, ket:string}]`.
  const MAX_CONCRETE_CONDENSE_TERMS = 4;
  function _condenseConcrete(termsWithAmps){
    const ts = termsWithAmps;
    if (ts.length < 2 || ts.length > MAX_CONCRETE_CONDENSE_TERMS) return null;   // (1) 2..4 termos (v19-L1: numerador longo não quebra linha em \dfrac)
    if (ts.some(t => !t.amp.ex)) return null;                                    // (2) eq EXATA ℤ[ζ₁₆]
    const a0 = ts[0].amp;
    let g = a0, c = Algebra.toComplex(g);
    if (!(c.re > 1e-12 && Math.abs(c.im) < 1e-12)){                              // (3) g canonical real positivo
      g = Algebra.NEG(a0); c = Algebra.toComplex(g);
      if (!(c.re > 1e-12 && Math.abs(c.im) < 1e-12)) return null;
    }
    const negG = Algebra.NEG(g);
    for (const t of ts){                                                          // (4) amp_k ∈ {g, −g}
      if (!Algebra.eqAmp(t.amp, g) && !Algebra.eqAmp(t.amp, negG)) return null;
    }
    const den = Algebra.DIV(Algebra.ONE, g);                                      // (5) den = 1/g; ==1 → null
    if (Algebra.eqAmp(den, Algebra.ONE)) return null;
    const denText = Algebra.format(den, 'rect').text;                             // (6) denom limpo + bilateral 'rect'
    if (!new RegExp('^' + DENOM_ALT_SRC + '$').test(denText)) return null;
    // Monta numerador '±ket ± ket ± …' (amps já são ±1 por construção; descobrir sinal por eqAmp(amp, g))
    let num = '';
    ts.forEach((t, i) => {
      const positive = Algebra.eqAmp(t.amp, g);
      if (i === 0) num += (positive ? '' : '−') + t.ket;
      else num += (positive ? ' + ' : ' − ') + t.ket;
    });
    return '(' + num + ')/' + denText;
  }

  // v11: FORMA MATRICIAL — vetor-coluna DENSO 2^N (com zeros) na base ativa, células no fmt ativo.
  // Rótulos de ket FORA do pmatrix (\array à esquerda). Cap em MAX_TERMS com ⋮ (head+⋮+última). Só concreto.
  // Reusa toKatex POR CÉLULA e rótulo (frações/√/⟩ → LaTeX); o scaffold pronto vai p/ renderMathTex (sem re-toKatex).
  function matrixTex(state, fmt, qbasis){
    const qb = effQB(state, qbasis);
    const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
    const total = 2 ** state.n;
    const dense = new Array(total).fill(Algebra.ZERO);
    for (const { index, amp } of view.amplitudes()) dense[index] = amp;
    const rows = [];                                   // índices a exibir; -1 = linha ⋮
    let truncated = false;
    if (total <= MAX_TERMS){ for (let i = 0; i < total; i++) rows.push(i); }
    else { truncated = true; for (let i = 0; i < MAX_TERMS - 1; i++) rows.push(i); rows.push(-1); rows.push(total - 1); }
    let approx = false;
    const labTex = [], cellTex = [], plainRows = [];
    for (const i of rows){
      if (i < 0){ labTex.push('\\vdots'); cellTex.push('\\vdots'); plainRows.push('  ⋮'); continue; }
      const f = Algebra.format(dense[i], fmt); if (f.approx) approx = true;
      const lab = ketLabel(view.bits(i), qb);
      labTex.push(toKatex(lab)); cellTex.push(toKatex(f.text)); plainRows.push(lab + '  ' + f.text);
    }
    const tex = '\\begin{array}{r}' + labTex.join('\\\\') + '\\end{array}\\,'
              + '\\begin{pmatrix}' + cellTex.join('\\\\') + '\\end{pmatrix}';
    let plain = plainRows.join('\n');
    if (truncated) plain += `\n(${total} rows total)`;
    return { tex, plain, approx, total, truncated };
  }

  // monta a string de Dirac a partir dos termos
  // v19 (F1): se TODOS os items têm `amp` raw, tenta CONDENSE CONCRETO primeiro (Bell/GHZ/Hadamard
  // c/ magnitudes iguais). Callers como blochReadout (que monta tl só com strings, sem amp) NÃO
  // condensam — backward-compat. Truncation marker: renderState remove `.amp` quando trunca, o que
  // automaticamente desliga o condense (evita fatorar parcial e mostrar resultado incorreto).
  function dirac(termList){
    if (!termList.length) return '0';
    // v19-L30 (operadora): F1 concrete-condense DESATIVADO — `(1/√2)|0⟩+(1/√2)|1⟩` → `(|0⟩+|1⟩)/√2` não é
    // pedagogicamente interessante. O que interessa é a aglutinação de monômios DENTRO de um único ket
    // (caso simbólico v18, ex.: `(1/2+e^{iθ}/2)|0⟩` → `((1+e^{iθ})/2)|0⟩`), que continua via SymExpr.condense.
    // _condenseConcrete fica definida mas não é mais chamada por dirac() — apenas referenciada nos testes.
    // if (termList.length >= 2 && termList.every(t => t.amp)){
    //   const c = _condenseConcrete(termList);
    //   if (c) return c;
    // }
    let out = '';
    termList.forEach((t, i) => {
      const neg = t.coef.startsWith('−') || t.coef.startsWith('-');
      const cc = t.coef.replace(/^[−-]/, '');
      let body;
      if (cc === '1') body = t.ket;
      else if (/^i$/.test(cc)) body = 'i' + t.ket;
      else if (cc.startsWith('(')) body = cc + t.ket;
      else body = '(' + cc + ')' + t.ket;
      if (i === 0) out += (neg ? '−' : '') + body;
      else out += (neg ? ' − ' : ' + ') + body;
    });
    return out;
  }

  // estado de 1 qubit a partir do vetor de Bloch (Nielsen & Chuang §1.2, parametrização da esfera):
  //   |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}·sin(θ/2)|1⟩,  θ = acos(z), φ = atan2(y,x).
  // leitura NUMÉRICA (consistente com a seta desenhada); recognize recupera exatidão p/ |0⟩,|1⟩,|+⟩,|i⟩…
  // |r| < 0.999 (mesmo limiar de Bloch.render) ⇒ reduzido/misto, sem ket puro. Reusa dirac (drop de termo
  // zero via isZeroAmp + coef "1" → ket nu) e Algebra.format(amp,fmt) → casa com o formato do display.
  function blochReadout(v, fmt){
    if (!(v.r >= 0.999)) return 'mixed · |r| = ' + (+v.r.toFixed(4));
    const z = Math.max(-1, Math.min(1, v.z));
    const th = Math.acos(z), ph = Math.atan2(v.y, v.x), s = Math.sin(th/2);
    const a = Algebra.recognize(Math.cos(th/2), 0);
    const b = Algebra.recognize(Math.cos(ph)*s, Math.sin(ph)*s);
    const tl = [];
    if (!Algebra.isZeroAmp(a)) tl.push({ coef: Algebra.format(a, fmt).text, ket: '|0⟩' });
    if (!Algebra.isZeroAmp(b)) tl.push({ coef: Algebra.format(b, fmt).text, ket: '|1⟩' });
    return dirac(tl);
  }

  // ---- LaTeX do estado (para render via KaTeX quando online) ----
  function coefTex(s){
    let t = s.replace(/√\s*(\d+)/g, '\\sqrt{$1}').replace(/√2/g, '\\sqrt{2}')
             .replace(/π/g, '\\pi ').replace(/·/g, '\\cdot ').replace(/−/g, '-');
    const m = t.match(/^(\([^()]*\)|[^/]+)\/([^/]+)$/);          // fração simples a/b (fora de expoente)
    if (m && !/e\^/.test(t)) return `\\tfrac{${m[1]}}{${m[2]}}`;
    return t;
  }
  function stateTex(state, fmt, qbasis){
    const { list } = terms(state, fmt, qbasis);
    const shown = list.slice(0, MAX_TERMS);
    if (!shown.length) return '0';
    let out = '';
    shown.forEach((t, i) => {
      const neg = t.coef.startsWith('−') || t.coef.startsWith('-');
      const cc = t.coef.replace(/^[−-]/, '');
      const coef = (cc === '1') ? '' : /^i$/.test(cc) ? 'i' : coefTex(cc);
      const bits = t.ket.replace(/^\|/, '').replace(/⟩$/, '');
      const ket = `\\lvert ${bits}\\rangle`;
      out += (i === 0 ? (neg ? '-' : '') : (neg ? ' - ' : ' + ')) + (coef ? coef + ' ' : '') + ket;
    });
    if (list.length > MAX_TERMS) out += ` + \\dots`;
    return out;
  }

  // junta símbolos de posições em ket(s): base uniforme entre essas posições → compacto; senão ⊗
  function joinKets(syms, qs, qb){
    const uni = qs.every(q => qb[q] === qb[qs[0]]);
    return uni ? '|' + syms.join('') + '⟩' : syms.map(s => '|' + s + '⟩').join('⊗');
  }
  // FORMA FATORADA (não distribui): fatora os qubits FIXOS (mesmo símbolo em todos os termos)
  // como kets cardeais à frente; o restante (qubits variáveis) vira uma soma entre parênteses.
  function factored(state, fmt, qbasis){
    const qb = effQB(state, qbasis);
    const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
    const amps = view.amplitudes();
    if (!amps.length) return '0';
    const n = state.n, fixedQs = [], varying = [], symFixed = {};
    for (let q = 0; q < n; q++){
      const b0 = amps[0].bits[q];
      if (amps.every(a => a.bits[q] === b0)){ fixedQs.push(q); symFixed[q] = SYM[qb[q]][+b0]; }
      else varying.push(q);
    }
    if (!varying.length)   // produto puro (termo único) — preserva o coeficiente global (−1, i, e^{iπ/4}…)
      return dirac([{ coef: Algebra.format(amps[0].amp, fmt).text, ket: joinKets(fixedQs.map(q => symFixed[q]), fixedQs, qb) }]);
    // POSICIONAL: mantém a ORDEM dos qubits (q0,q1,…). Fatora só os FIXOS nas BORDAS (antes do 1º variável
    // e depois do último); o miolo [lo..hi] (variáveis + eventuais fixos intercalados) vira a soma. Assim
    // aplicar uma porta NÃO troca os qubits de lugar no display. (fixo intercalado não é fatorado p/ não reordenar)
    const lo = varying[0], hi = varying[varying.length - 1];
    const left = [], right = [], core = [];
    for (let q = 0; q < n; q++){
      if (q < lo) left.push(q); else if (q > hi) right.push(q); else core.push(q);
    }
    // v19 (F1): inner carrega amp + coef formatado — dirac() condensa internamente se for o caso (same-magnitude)
    const inner = amps.map(a => ({ amp: a.amp,
      coef: Algebra.format(a.amp, fmt).text,
      ket: joinKets(core.map(q => SYM[qb[q]][+a.bits[q]]), core, qb) }));
    let s = dirac(inner);
    if (!left.length && !right.length) return s;                                          // nada fixo nas bordas → soma
    return (left.length ? joinKets(left.map(q => symFixed[q]), left, qb) + '⊗' : '')
         + '(' + s + ')'
         + (right.length ? '⊗' + joinKets(right.map(q => symFixed[q]), right, qb) : '');
  }

  // EVIDENCIAR um qubit q: fatora os DOIS kets |k_b⟩_q (na base de q) cada um na sua POSIÇÃO,
  // com o colchete dos demais qubits do outro lado; se há escalar comum, fatora-o também.
  // Ex.: [(1/√2)|0⟩ + (a)|1⟩]⊗|+⟩ + (b)|1⟩⊗|−⟩   (q = último qubit).
  function evidence(state, q, fmt, qbasis){
    const qb = effQB(state, qbasis);
    const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
    const amps = view.amplitudes();
    if (!amps.length) return '0';
    const n = state.n;
    if (!Number.isInteger(q) || q < 0 || q >= n) return null;
    const others = []; for (let o = 0; o < n; o++) if (o !== q) others.push(o);
    const c0 = amps[0].amp;
    const groups = { '0':[], '1':[] };
    amps.forEach((a) => {
      const syms = others.map(o => SYM[qb[o]][+a.bits[o]]);
      groups[a.bits[q]].push({ amp: a.amp, ket: others.length ? joinKets(syms, others, qb) : '' });
    });
    // escalar comum só quando NENHUM ramo é soma (evita colchetes aninhados [[…]])
    const multiBranch = ['0','1'].some(b => groups[b].length > 1);
    const useScalar = !multiBranch && amps.every(a => { const r = Algebra.DIV(a.amp, c0); return r && r.ex === true; });
    const fmtCoef = (amp) => Algebra.format(useScalar ? Algebra.DIV(amp, c0) : amp, fmt).text;
    const parts = [];
    for (const b of ['0','1']){
      const g = groups[b]; if (!g.length) continue;
      const kb = '|' + SYM[qb[q]][+b] + '⟩';
      if (!others.length){ parts.push(dirac(g.map(t => ({ coef:fmtCoef(t.amp), ket:kb })))); continue; }   // n=1: evidência = o próprio ket
      const terms = g.map(t => ({ coef:fmtCoef(t.amp), ket:t.ket }));
      const rem = g.length > 1 ? '[' + dirac(terms) + ']' : dirac(terms);   // colchete só se houver soma
      parts.push(q === 0 ? kb + '⊗' + rem : rem + '⊗' + kb);                 // POSICIONAL: ket no lugar do seu qubit
    }
    let body = parts.join(' + ');
    if (useScalar){ const cs = Algebra.format(c0, fmt).text; if (cs !== '1') body = '(' + cs + ')[' + body + ']'; }
    return body;
  }

  // EVIDENCIAR um KET específico |k_bit⟩_q: coleta os termos em que o qubit q vale esse ket,
  // fatora-o (posicional) com o colchete dos demais qubits; os termos restantes ficam expandidos.
  // Ex.: [(1/√2)|0⟩ + (a)|1⟩]⊗|+⟩ + (b)|1⟩⊗|−⟩   (evidenciando |+⟩ em Q1).
  function evidenceKet(state, q, bit, fmt, qbasis){
    const qb = effQB(state, qbasis);
    const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
    const amps = view.amplitudes();
    if (!amps.length) return '0';
    const n = state.n;
    if (!Number.isInteger(q) || q < 0 || q >= n) return null;
    const others = []; for (let o = 0; o < n; o++) if (o !== q) others.push(o);
    const chosen = amps.filter(a => +a.bits[q] === bit);
    const rest   = amps.filter(a => +a.bits[q] !== bit);
    let body = '';
    if (chosen.length){                                            // ramo escolhido: fatora |k_bit⟩ à sua posição
      const kb = '|' + SYM[qb[q]][bit] + '⟩';
      if (chosen.length === 1){                                    // termo único → coeficiente vai à FRENTE
        const a = chosen[0];
        const otherKet = others.length ? joinKets(others.map(o => SYM[qb[o]][+a.bits[o]]), others, qb) : '';
        const pair = !others.length ? kb : (q === 0 ? kb + '⊗' + otherKet : otherKet + '⊗' + kb);
        body = dirac([{ coef: Algebra.format(a.amp, fmt).text, ket: pair }]);
      } else {                                                     // soma → colchete com os coeficientes dentro
        const terms = chosen.map(a => ({ coef: Algebra.format(a.amp, fmt).text, ket: joinKets(others.map(o => SYM[qb[o]][+a.bits[o]]), others, qb) }));
        const rem = '[' + dirac(terms) + ']';
        body = q === 0 ? kb + '⊗' + rem : rem + '⊗' + kb;
      }
    }
    if (rest.length){                                              // demais termos: o qubit evidenciado fica separado por ⊗ (consistente)
      const restStr = dirac(rest.map(a => {
        const kq = '|' + SYM[qb[q]][+a.bits[q]] + '⟩';
        const otherKet = others.length ? joinKets(others.map(o => SYM[qb[o]][+a.bits[o]]), others, qb) : '';
        const pair = !others.length ? kq : (q === 0 ? kq + '⊗' + otherKet : otherKet + '⊗' + kq);
        return { coef: Algebra.format(a.amp, fmt).text, ket: pair };
      }));
      if (!body) body = restStr;
      else body += restStr.startsWith('−') ? ' − ' + restStr.slice(1) : ' + ' + restStr;
    }
    return body || '0';
  }

  // dados de render completos (consumidos pela M11)
  function renderState(state, opts){
    opts = opts || {};
    const fmt = opts.phaseFmt || 'exp';
    const qb = effQB(state, opts.qbasis);
    const { list, approx } = terms(state, fmt, qb);
    const shown = list.slice(0, MAX_TERMS);
    // v19 (F1): se truncado, remove `amp` p/ desligar o condense em dirac() (evita fatorar parcial → resultado incorreto).
    if (shown.length < list.length) shown.forEach(t => { delete t.amp; });
    const diracStr = dirac(shown) + (list.length > MAX_TERMS ? `  + …  (${list.length} termos no total)` : '');
    let bars = null;
    if (opts.showBars){
      const view = qb.every(b => b === 'comp') ? state : Engine.viewPerQubit(state, qb);
      bars = view.amplitudes().slice(0, MAX_TERMS).map(({ bits, amp }) => {
        const n2 = Algebra.norm2(amp);
        const value = n2.value;
        return { ket:ketLabel(bits, qb), value, str: Algebra.normStr(n2) };
      });
    }
    const selText = (state.selection === 'ALL' ? 'ALL' : 'Q' + state.selection);
    return { dirac:diracStr, approx, termCount:list.length, bars,
             selection:selText, basisLabel:basisLabelOf(qb) };
  }

  // ---- v4: render do estado SIMBÓLICO (SymState) ----
  // fator de exibição de um termo: bits concretos consecutivos → |bits⟩ ; abstrato → [nós]|ψ⟩ ; junta com ⊗
  function symFactorStr(slots){
    const parts = []; let cbuf = '';
    const flush = () => { if (cbuf){ parts.push('|' + cbuf + '⟩'); cbuf = ''; } };
    for (const s of slots){
      if (typeof s === 'string'){ cbuf += s; }
      else { flush(); const nd = s.nodes.slice().reverse().join(''); parts.push((nd ? nd : '') + '|' + s.label + '⟩'); }
    }
    flush();
    return parts.join('⊗') || '1';
  }
  // soma de Dirac simbólica de uma lista de termos {coef, slots}; coef compound → parênteses
  function diracSymTerms(terms, fmt){
    if (!terms.length) return '0';
    let out = '';
    terms.forEach((t, i) => {
      const f = SymExpr.format(t.coef, fmt);
      const ket = symFactorStr(t.slots);
      if (f.compound){ out += (i === 0 ? '' : ' + ') + '(' + f.text + ')' + ket; return; }
      let coef = f.text, neg = false;
      if (coef.startsWith('−') || coef.startsWith('-')){ neg = true; coef = coef.slice(1); }
      let body;
      if (coef === '1') body = ket;
      else if (/^i$/.test(coef)) body = 'i' + ket;
      else if (coef.startsWith('(')) body = coef + ket;
      else body = '(' + coef + ')' + ket;
      out += i === 0 ? (neg ? '−' : '') + body : (neg ? ' − ' : ' + ') + body;
    });
    return out;
  }
  const diracSym = (symstate, fmt) => diracSymTerms(symstate.terms, fmt);

  // FORMA FATORADA (não distribui): fatora os subsistemas FIXOS (mesmo slot em todos os termos) —
  // tipicamente o(s) ket(s) abstrato(s) |ψ⟩ comuns — pondo a soma dos slots VARIÁVEIS entre parênteses.
  function factoredSym(symstate, fmt){
    const terms = symstate.terms;
    if (!terms.length) return '0';
    const n = symstate.n, fixed = [], varying = [];
    for (let q = 0; q < n; q++){
      const k0 = SymState.slotKey([terms[0].slots[q]]);
      (terms.every(t => SymState.slotKey([t.slots[q]]) === k0) ? fixed : varying).push(q);
    }
    if (!varying.length || !fixed.length) return diracSymTerms(terms, fmt);   // produto puro, ou nada a fatorar
    const inner = SymState._combine(terms.map(t => ({ coef:t.coef, slots: varying.map(q => t.slots[q]) })));
    const innerStr = diracSymTerms(inner, fmt);
    const parts = []; let placed = false;
    for (let q = 0; q < n; q++){
      if (fixed.indexOf(q) >= 0) parts.push(symFactorStr([terms[0].slots[q]]));
      else if (!placed){ parts.push(inner.length > 1 ? '(' + innerStr + ')' : innerStr); placed = true; }
    }
    return parts.join('⊗');
  }
  function renderSym(symstate, opts){
    opts = opts || {};
    const fmt = opts.phaseFmt || 'exp';
    const diracStr = (opts.viewForm === 'factor') ? factoredSym(symstate, fmt) : diracSym(symstate, fmt);
    const selText = (symstate.selection === 'ALL' ? 'ALL' : 'Q' + symstate.selection);
    const labels = symstate.layout.map((c, q) => c === 'a' ? '|' + symstate.labelAt(q) + '⟩' : '·').join('');
    const vlabel = (opts.viewForm === 'factor') ? 'factored' : 'expanded';
    return { dirac:diracStr, approx:symstate.approx(), termCount:symstate.terms.length, selection:selText, basisLabel:'symbolic ' + labels, form:vlabel };   // v12: form separado p/ inserir 'turns' antes dele (consistente com o concreto)
  }

  // ---- LaTeX unificado: string de Dirac (Unicode) → LaTeX p/ KaTeX. Cobre TODAS as formas
  //      (concreto, simbólico, fatorado com ⊗, nós U|ψ⟩) — antes o ⊗ derrubava o KaTeX. ----
  const _GREEK = { 'π':'\\pi ','θ':'\\theta ','φ':'\\phi ','ψ':'\\psi ','χ':'\\chi ','λ':'\\lambda ','σ':'\\sigma ','μ':'\\mu ','ρ':'\\rho ','Φ':'\\Phi ','Ψ':'\\Psi ' };
  const _SUB = { '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9' };
  const _SUP = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9' };
  function toKatex(s){
    let t = s;
    // tira parênteses de um coeficiente NÃO-soma (sem + / − binário) antes de um ket |…⟩ ou colchete [
    // — com fração vertical, "(1/2)|0⟩" fica redundante → "1/2|0⟩". Somas mantêm os parênteses.
    t = t.replace(/\(([^()]+)\)(?=[|\[])/g, (m, inner) => / [+\-−] /.test(inner) ? m : inner);
    t = t.replace(/[₀-₉]+/g, m => '_{' + [...m].map(c => _SUB[c]).join('') + '}');
    t = t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^{' + [...m].map(c => _SUP[c]).join('') + '}');
    // v6: surdo aninhado √(…) → \sqrt{…} ANTES de ()→\left( (senão vira "\sqrt \left(" malformado)
    t = t.replace(/√\(([^()]+)\)i\/(\d+)/g, '\\dfrac{\\sqrt{$1}\\,i}{$2}'); // √(4−2√2)i/4 → \dfrac{\sqrt{…}i}{4}
    t = t.replace(/√\(([^()]+)\)\/(\d+)/g, '\\dfrac{\\sqrt{$1}}{$2}');    // √(4+2√2)/4 → \dfrac{\sqrt{4+2√2}}{4}
    t = t.replace(/√\(([^()]+)\)/g, '\\sqrt{$1}');                       // √(2+√2) → \sqrt{2+√2}
    // v7: fração n/d DENTRO do expoente de turns e^{2πi·n/d} → \tfrac (text-style; \dfrac estoura o sobrescrito)
    t = t.replace(/(e\^\{-?2πi·)(\d+)\/(\d+)\}/g, '$1\\tfrac{$2}{$3}}');
    // v18: numerador PARENTIZADO / denom limpo → fração vertical \dfrac (mata os parênteses externos do coef condensado;
    //      espelha a regra √(…)/d). [^()]+ garantido pelo phase-coef guard do SymExpr.condense.
    // v19 (F2): regex montado da const única DENOM_ALT_SRC (DRY com SymExpr.condense step 6).
    t = t.replace(new RegExp('\\(([^()]+)\\)\\/' + DENOM_ALT_SRC, 'g'), '\\dfrac{$1}{$2}');
    // frações VERTICAIS (\dfrac): n/d com d = inteiro, √inteiro, ou inteiro√inteiro (ex.: 1/2, 1/√2, 1/4√2)
    t = t.replace(new RegExp('(\\d+)\\/' + DENOM_ALT_SRC, 'g'), '\\dfrac{$1}{$2}');
    // coeficiente imaginário i/d (ou Ni/d, i/√2…) → \dfrac vertical também (consistência com 1/2; exponentes usam π, nunca "i/")
    t = t.replace(/(\d*)i\/(\d+√\d+|√\d+|\d+)/g, (m, n, d) => '\\dfrac{' + (n || '') + 'i}{' + d + '}');
    t = t.replace(/√(\d+)/g, '\\sqrt{$1}').replace(/√/g, '\\sqrt ');
    t = t.replace(/⟨/g, '\\langle ').replace(/⟩/g, '\\rangle ');
    t = t.replace(/⊗/g, '\\otimes ').replace(/·/g, '\\cdot ').replace(/†/g, '^{\\dagger}').replace(/−/g, '-');
    t = t.replace(/[πθφψχλσμρΦΨ]/g, c => _GREEK[c]);
    // parênteses/colchetes de agrupamento que sobraram auto-dimensionam à altura das frações
    t = t.replace(/\(/g, '\\left(').replace(/\)/g, '\\right)').replace(/\[/g, '\\left[').replace(/\]/g, '\\right]');
    // v19-L22 (operadora + Leonardo human-AV): no Safari iOS, \dfrac sofre arredondamento de baseline
    // do WebKit (KaTeX #2931, WebKit Bugzilla #207754) → frações ficam deslocadas verticalmente em
    // relação a kets/parênteses na mesma linha. Workaround: substituir \dfrac por \tfrac (textstyle,
    // strut menor, menos cálculo de table-cell vertical → bug imperceptível). Custo: numerador/denom
    // ~80% do tamanho do desktop em iOS. Detecção via UA (não-feature pois é bug WebKit específico).
    // v19-L26: \dfrac→\tfrac só em Safari browser (não em PWA standalone, que renderiza OK c/ \dfrac).
    if (_isIOSWebKit && !window.matchMedia('(display-mode:standalone)').matches){
      t = t.replace(/\\dfrac/g, '\\tfrac');
    }
    return t;
  }

  return { renderState, matrixTex, dirac, _condenseConcrete, blochReadout, stateTex, toKatex, terms, factored, evidence, evidenceKet, ketLabel, BASIS_LABEL, SYM,
           renderSym, diracSym, diracSymTerms, factoredSym, symFactorStr };
})();

/* =====================================================================
   M8 — history : pilha de Commands sobre snapshots de State imutáveis,
   undo/redo com profundidade limitada (T-7).
   ===================================================================== */
const History = (() => {
  const MAX = 200;
  let stack = [];     // [{ state, label, command }]
  let idx = -1;

  function init(state, label, command){ stack = [{ state, label: label || 'init |0⟩', command: command || null }]; idx = 0; }
  function push(state, label, command){
    stack = stack.slice(0, idx + 1);
    stack.push({ state, label, command: command || null });
    if (stack.length > MAX){ stack.shift(); }
    idx = stack.length - 1;
  }
  const current = () => stack[idx].state;
  const canUndo = () => idx > 0;
  const canRedo = () => idx < stack.length - 1;
  function undo(){ if (canUndo()) idx--; return current(); }
  function redo(){ if (canRedo()) idx++; return current(); }
  // rótulos dos passos aplicados até o ponto atual (1.. = comandos após init)
  function labels(){ return stack.slice(0, idx + 1).map((e, i) => `${i}. ${e.label}`); }
  // comandos que reconstroem o estado atual, inclui o init (set/prepare)
  function commands(){ return stack.slice(0, idx + 1).map(e => e.command).filter(Boolean); }
  const size = () => stack[idx].state.n;

  return { init, push, current, undo, redo, canUndo, canRedo, labels, commands, size };
})();

/* =====================================================================
   M12 — calc : avaliador de expressões (Interpreter). Tokenizer → shunting-yard
   → eval sobre Amp. Exato quando o resultado recai em ℤ[ω] (via recognize),
   numérico sinalizado caso contrário. SEM Function/eval (anti-XSS).
   Refs de estado (amp[bits], P(bits), EV(O,q), norm) resolvidas via stateCtx.
   ===================================================================== */
const Calc = (() => {
  const A = Algebra;
  const PREC = { '+':1, '-':1, '*':2, '/':2, '^':4, 'u-':3, 'u√':5 };  // u- menos unário, u√ raiz (prefixo, liga ao operando imediato)
  const RIGHT = { '^':true, 'u-':true, 'u√':true };
  const FUNCS = ['sin','cos','tan','exp','ln','log','sqrt','conj','abs','re','im'];

  // real (p+q√2)/2^k → Amp exata
  // real (p+q√2)/2^k → Amp exata.  √2 = ζ²−ζ⁶ ⇒ (p,0,q,0,0,0,−q,0)
  function surdToAmp(p, q, k){ return A.reduceExact(A.exact(new A._Zeta16([p, 0n, q, 0n, 0n, 0n, -q, 0n]), 2*k)); }

  const SENT = String.fromCharCode(1);   // sentinela de operando (refs de estado)
  function ph(ops, amp){ ops.push(amp); return SENT + (ops.length - 1) + SENT; }

  /* ---- ângulo simbólico: múltiplo racional de π → {pi:true, n,d} = (n/d)·π ---- */
  const bg = (a,b)=>{ a=a<0n?-a:a; b=b<0n?-b:b; while(b){[a,b]=[b,a%b];} return a||1n; };
  function pa(n,d){ n=BigInt(n); d=BigInt(d); if(d<0n){n=-n;d=-d;} const g=bg(n,d); return {pi:true,n:n/g,d:d/g}; }
  const isPA = (x)=> x && x.pi === true;
  const paNum = (x)=> Number(x.n)/Number(x.d)*Math.PI;          // valor numérico (rad)
  const toA = (x)=> isPA(x) ? A.numeric(paNum(x),0) : x;        // colapsa π→numérico quando preciso
  function paStr(x){
    if (x.n === 0n) return '0';
    const neg = x.n < 0n, n = neg?-x.n:x.n;
    const num = n===1n ? 'π' : `${n}π`;
    return (neg?'−':'') + (x.d===1n ? num : `${num}/${x.d}`);
  }
  // valor racional de um Amp exato REAL → {n,d} (BigInt) ou null
  function ratOf(x){
    if (!x || !x.ex) return null;
    const { re, im } = A.exactReIm(x);                          // grau-4: (R0+R2√2+RA√(2+√2)+RB√(2−√2))/(√2)^P
    if (im.R0!==0n || im.R2!==0n || im.RA!==0n || im.RB!==0n) return null;  // complexo
    if (re.R2!==0n || re.RA!==0n || re.RB!==0n) return null;    // irracional (√2 / aninhado)
    if (re.R0 === 0n) return { n:0n, d:1n };
    if (re.P % 2 !== 0) return null;                            // R0/(√2)^P com P ímpar → irracional
    const num = re.R0, den = A.bpow2(re.P/2), g = bg(num,den);
    return { n:num/g, d:den/g };
  }
  function ratAmp(num,den){ return A.DIV(A.fromNumber(Number(num)), A.fromNumber(Number(den))); }
  // operação binária ciente de π (mantém π/4, 2π/8→π/4 etc.; mistura com não-π → numérico)
  function binop(op, a, b){
    if (isPA(a) || isPA(b)){
      if (op==='+' || op==='-'){
        if (isPA(a) && isPA(b)) return pa(op==='+' ? a.n*b.d + b.n*a.d : a.n*b.d - b.n*a.d, a.d*b.d);
        return op==='+' ? A.ADD(toA(a),toA(b)) : A.SUB(toA(a),toA(b));   // π ± não-π → numérico
      }
      if (op==='*'){
        if (isPA(a) && isPA(b)) return A.MUL(toA(a),toA(b));             // π² → numérico
        const p = isPA(a)?a:b, r = ratOf(isPA(a)?b:a);
        return r ? pa(p.n*r.n, p.d*r.d) : A.MUL(toA(a),toA(b));
      }
      if (op==='/'){
        if (isPA(a) && isPA(b)) return ratAmp(a.n*b.d, a.d*b.n);          // (aπ)/(bπ) → racional
        if (isPA(a)){ const r = ratOf(b); return r ? pa(a.n*r.d, a.d*r.n) : A.DIV(toA(a),toA(b)); }
        return A.DIV(toA(a),toA(b));                                      // racional/π → numérico
      }
      return A.POW(toA(a), Number(A.toComplex(toA(b)).re));
    }
    return op==='+'?A.ADD(a,b):op==='-'?A.SUB(a,b):op==='*'?A.MUL(a,b):op==='/'?A.DIV(a,b):A.POW(a,Number(A.toComplex(b).re));
  }

  function tokenize(s, ops){
    const t = []; let i = 0;
    const prev = () => t[t.length - 1];
    const expectsValue = () => { const p = prev(); return !p || p.t==='op' || p.t==='(' || p.t==='fn' || p.t===','; };
    while (i < s.length){
      const c = s[i];
      if (c === ' '){ i++; continue; }
      if (c === SENT){ const j = s.indexOf(SENT, i+1); t.push({ t:'val', v: ops[+s.slice(i+1, j)] }); i = j+1; continue; }
      if (/[0-9.]/.test(c)){ let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++; t.push({ t:'val', v: A.fromNumber(parseFloat(s.slice(i,j))) }); i=j; continue; }
      if (c === '√'){ t.push({ t:'op', v:'u√' }); i++; continue; }   // raiz: operador unário prefixo
      if (c === 'π'){ t.push({ t:'val', v: pa(1,1) }); i++; continue; }
      if (/[a-zA-Z]/.test(c)){ let j=i; while (j<s.length && /[a-zA-Z]/.test(s[j])) j++; const w=s.slice(i,j); i=j;
        if (w==='pi') t.push({ t:'val', v:pa(1,1) });
        else if (w==='e') t.push({ t:'val', v:A.numeric(Math.E,0) });
        else if (w==='i') t.push({ t:'val', v:A.IMAG });
        else if (FUNCS.includes(w)) t.push({ t:'fn', v:w });
        else throw new Error('invalid token: '+w);
        continue; }
      if (c === '('){ t.push({ t:'(' }); i++; continue; }
      if (c === ')'){ t.push({ t:')' }); i++; continue; }
      if (c === ','){ t.push({ t:',' }); i++; continue; }
      if ('+-*/^'.includes(c)){
        const op = (c === '-' && expectsValue()) ? 'u-' : c;
        t.push({ t:'op', v:op }); i++; continue;
      }
      throw new Error('invalid character: '+c);
    }
    return t;
  }

  function shunt(toks){                       // shunting-yard infixo → RPN
    const out = [], st = [];
    for (const tk of toks){
      if (tk.t === 'val') out.push(tk);
      else if (tk.t === 'fn') st.push(tk);
      else if (tk.t === 'op'){
        while (st.length){ const top = st[st.length-1];
          if (top.t==='op' && (PREC[top.v] > PREC[tk.v] || (PREC[top.v]===PREC[tk.v] && !RIGHT[tk.v]))) out.push(st.pop());
          else break; }
        st.push(tk);
      } else if (tk.t === '(') st.push(tk);
      else if (tk.t === ')'){
        while (st.length && st[st.length-1].t !== '(') out.push(st.pop());
        if (!st.length) throw new Error('unbalanced parenthesis');
        st.pop();
        if (st.length && st[st.length-1].t==='fn') out.push(st.pop());
      }
    }
    while (st.length){ const o = st.pop(); if (o.t==='(') throw new Error('unbalanced parenthesis'); out.push(o); }
    return out;
  }

  function applyFn(name, x0){
    const x = toA(x0);                       // funções de um ângulo π usam o valor numérico (e recognize pega π/4 etc.)
    const c = A.toComplex(x);
    switch (name){
      case 'sqrt': return A.POW(x, 0.5);
      case 'exp': { const m = Math.exp(c.re); return A.recognize(m*Math.cos(c.im), m*Math.sin(c.im)); }
      case 'ln': { const mag = Math.hypot(c.re, c.im); if (mag < 1e-30) throw new Error('ln(0)'); return A.recognize(Math.log(mag), Math.atan2(c.im, c.re)); }
      case 'log': { const mag = Math.hypot(c.re, c.im); if (mag < 1e-30) throw new Error('log(0)'); return A.recognize(Math.log10(mag), Math.atan2(c.im, c.re)/Math.LN10); }
      case 'sin': return A.recognize(Math.sin(c.re), 0);
      case 'cos': return A.recognize(Math.cos(c.re), 0);
      case 'tan': return A.recognize(Math.tan(c.re), 0);
      case 'conj': return A.CONJ(x);
      case 'abs': return A.recognize(Math.hypot(c.re, c.im), 0);
      case 're': return A.recognize(c.re, 0);
      case 'im': return A.recognize(c.im, 0);
      default: throw new Error('unknown function: '+name);
    }
  }

  function evalRpn(rpn){
    const st = [];
    for (const tk of rpn){
      if (tk.t === 'val') st.push(tk.v);
      else if (tk.t === 'fn'){ if (!st.length) throw new Error('argumento ausente'); st.push(applyFn(tk.v, st.pop())); }
      else if (tk.t === 'op'){
        if (tk.v === 'u-'){ if (!st.length) throw new Error('invalid expression'); const x = st.pop(); st.push(isPA(x) ? pa(-x.n, x.d) : A.NEG(x)); continue; }
        if (tk.v === 'u√'){ if (!st.length) throw new Error('invalid expression'); st.push(applyFn('sqrt', st.pop())); continue; }
        if (st.length < 2) throw new Error('invalid expression');
        const b = st.pop(), a = st.pop();
        st.push(binop(tk.v, a, b));
      }
    }
    if (st.length !== 1) throw new Error('invalid expression');
    return st[0];
  }

  // ctx: { n, amp(bits), prob(bits)->{p,q,k}, ev(O,q)->Amp, norm()->Amp }
  function evaluate(expr, ctx){
    try {
      if (!expr || !expr.trim()) return { error: 'empty expression' };
      const ops = [];
      let s = expr;
      s = s.replace(/amp\[([01]+)\]/g, (m,b)=>{ if (!ctx) throw new Error('no state'); return ph(ops, ctx.amp(b)); });
      s = s.replace(/P\(([01]+)\)/g,    (m,b)=>{ if (!ctx) throw new Error('no state'); const n2 = ctx.prob(b); return ph(ops, n2.deg4 ? A.numeric(n2.value, 0) : surdToAmp(n2.p, n2.q, n2.k)); });
      s = s.replace(/EV\(\s*([XYZxyz])\s*,\s*(\d+)\s*\)/g, (m,o,q)=>{ if (!ctx) throw new Error('no state'); return ph(ops, ctx.ev(o.toUpperCase(), +q)); });
      s = s.replace(/\bnorm\b/g, ()=>{ if (!ctx) throw new Error('no state'); return ph(ops, ctx.norm()); });
      const val = evalRpn(shunt(tokenize(s, ops)));
      if (isPA(val)) return { value: toA(val), approx:false, isPi:true, piStr: paStr(val), piNum: paNum(val) };
      return { value: val, approx: !val.ex };
    } catch (e){ return { error: e.message }; }
  }

  return { evaluate, surdToAmp };
})();

/* =====================================================================
   M13 — bloch : render Canvas 2D do vetor de Bloch do qubit selecionado.
   Projeção pseudo-3D (azimute/elevação fixos). Usa coords de Ops.blochVector.
   ===================================================================== */
const Bloch = (() => {
  const AZ_DEF = 0.6 + Math.PI + 20*Math.PI/180, EL_DEF = 0.42;   // v16: vista padrão — azimute +180° (convenção dos livros) +20° anti-horário. v27: agora é só o DEFAULT (a vista é rotacionável por drag; opts.az/opts.el sobrescrevem).
  function proj(x, y, z, cx, cy, R, az, el){
    az = (az == null ? AZ_DEF : az); el = (el == null ? EL_DEF : el);
    y = -y;                                                // v16: rebate o eixo y (eixo e vetor seguem juntos) → convenção dos livros didáticos
    const X = cx + R * (x*Math.cos(az) + y*Math.sin(az));
    const Y = cy - R * (z*Math.cos(el) - (-x*Math.sin(az) + y*Math.cos(az))*Math.sin(el));
    return [X, Y];
  }
  // C = paleta (segue o tema): { sphere, axis, label, vec, vecMixed, text }. Default = verde do LCD escuro.
  function render(canvas, v, C, opts){
    C = C || { sphere:'#2c6e57', axis:'#1f4a3a', label:'#6f9c87', vec:'#74dd97', vecMixed:'#3f8f6a', text:'#bfe9cf' };
    opts = opts || {};
    const az = (opts.az != null ? opts.az : AZ_DEF), el = (opts.el != null ? opts.el : EL_DEF);   // v27: vista rotacionável (drag → câmera)
    const g = canvas.getContext('2d');
    const dpr = opts.dpr || 1, W = opts.size || canvas.width, H = opts.size || canvas.height;   // v12: W/H LÓGICOS; bitmap = W×dpr (nítido em high-DPI). Desktop dpr=1 → idêntico.
    if (g.setTransform) g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 22;
    const mixed = v.r < 0.999;   // v26: qubit reduzido/misto = EMARANHADO (num estado global puro). Aciona o "modo emaranhado" visual.
    g.clearRect(0,0,W,H);
    // monocromático (segue o LCD): esfera/equador. v26: no modo emaranhado a esfera EXTERNA fica a 50% de
    // transparência (recua — ela não é o estado do qubit; o estado é a esfera interna de raio |r|).
    g.lineWidth = 1.2; g.strokeStyle = C.sphere; g.globalAlpha = mixed ? .5 : .7;
    g.beginPath(); g.arc(cx, cy, R, 0, 2*Math.PI); g.stroke();                  // esfera
    g.beginPath(); g.ellipse(cx, cy, R, R*Math.abs(Math.sin(el)), 0, 0, 2*Math.PI); g.stroke(); // equador (foreshortening = |sin(el)|)
    g.globalAlpha = 1;
    // eixos + rótulos
    // v12: no mobile/PWA, |0⟩/|1⟩ saem da esfera p/ os extremos do eixo Z. v19-L29 (operadora): gap proporcional ao tamanho da esfera (~5%) — funciona em qualquer plataforma, sem hack iOS.
    const zext = opts.zOutside ? Math.max(4, Math.round((opts.size || 232) * 0.05)) : 0;
    const axis = (x,y,z,lab,ext,labDy) => {   // labDy = nudge vertical do rótulo x/y (px)
      const [ax,ay] = proj(x,y,z,cx,cy,R,az,el);
      g.strokeStyle = C.axis; g.beginPath(); g.moveTo(cx,cy); g.lineTo(ax,ay); g.stroke();   // linha do eixo até a borda
      g.fillStyle = C.label;
      if (ext){                                            // rótulo FORA da esfera, centrado no extremo do eixo, um pouco menor
        g.font = '10px monospace';
        const [lx,ly] = proj(x,y,z,cx,cy,R+ext,az,el);
        g.textAlign = 'center'; g.textBaseline = (z > 0 ? 'bottom' : 'top');
        g.fillText(lab, lx, ly); g.textAlign = 'start'; g.textBaseline = 'alphabetic';
      } else {                                            // v16: rótulo x/y no lado EXTERNO da ponta (ponta à esquerda → label à esquerda; simétrico)
        g.font = '11px monospace';
        const onLeft = ax < cx - 1;
        g.textAlign = onLeft ? 'right' : 'left';
        g.fillText(lab, ax + (onLeft ? -3 : 3), ay+3 + (labDy||0));   // v16: nudge vertical por eixo (x ~50% da altura, y ~20%)
        g.textAlign = 'start';
      }
    };
    axis(1,0,0,'x',0,5.5); axis(0,1,0,'y',0,2.2); axis(0,0,1,'|0⟩',zext); axis(0,0,-1,'|1⟩',zext);   // v16: x ↓50% da altura (~5.5px), y ↓20% (~2.2px)
    // v20 (M3): fita translúcida de PROBABILIDADE no eixo Z — comprimento R no espaço-mundo,
    // desliza por P(|0⟩) = (1+v.z)/2. Topo = P0 (slide 0→1); Base = P0-1 (slide -1→0). Comprimento = R sempre.
    // |0⟩ puro (P=1) → fita z=[0,1] totalmente acima; |1⟩ puro (P=0) → fita z=[-1,0] totalmente abaixo;
    // |+⟩ (P=0.5) → fita z=[-0.5,0.5] centrada no equador. SEMPRE dentro da esfera. Ref: N&C §2.2.5.
    if (opts.probBar !== false){
      const P0 = (1 + v.z) / 2;
      const zTop = P0, zBot = P0 - 1;
      const [tx, ty] = proj(0, 0, zTop, cx, cy, R, az, el);
      const [bx, by] = proj(0, 0, zBot, cx, cy, R, az, el);
      const probBarColor = v.r < 0.999 ? C.vecMixed : C.vec;
      const probBarWidth = Math.max(6, Math.round(R * 0.08));                    // proporcional ao raio — v20 P6 operadora: 2× a largura original (R*0.04 → R*0.08, piso 3 → 6) (lição P2 Mechanical)
      const prevAlpha = g.globalAlpha, prevCap = g.lineCap;
      g.globalAlpha = (opts.probBarAlpha != null ? opts.probBarAlpha : 0.18);   // v20-4 (operadora P6): mais transparente (0.28→0.18)
      g.lineCap = 'butt';                                                         // extremos retos (não arredonda como o vetor)
      g.strokeStyle = probBarColor; g.lineWidth = probBarWidth;
      g.beginPath(); g.moveTo(bx, by); g.lineTo(tx, ty); g.stroke();
      g.globalAlpha = prevAlpha; g.lineCap = prevCap;
    }
    // vetor de estado: tom forte (puro) / médio (reduzido/misto) — sem mudar de matiz
    // v26: ESFERA DE PUREZA ("shade") — bolha translúcida de raio |r|, SEMPRE desenhada (puro inclusive).
    // Puro (|r|=1) → preenche a esfera toda (mesmo shade volumétrico; a casca externa já serve de contorno,
    // então não redesenha contorno/equador, que coincidiriam). Misto/emaranhado (|r|<1) → bolha INTERNA
    // concêntrica + contorno/equador inclinado (a esfera de pureza onde a ponta pousa, |r|→0 = centro).
    // Cor forte (puro) / média (misto). Desenhada ANTES do vetor (que pousa na superfície dela).
    if (v.r > 0.001){
      const rin = R * v.r, prevA = g.globalAlpha, shadeC = mixed ? C.vecMixed : C.vec;
      g.fillStyle = shadeC; g.strokeStyle = shadeC; g.lineWidth = 1.3;
      g.globalAlpha = 0.08; g.beginPath(); g.arc(cx, cy, rin, 0, 2*Math.PI); g.fill();                                  // volume (shade) — claro (v26-32)
      if (mixed){                                                                                                       // casco interno só no misto (no puro coincidiria com a esfera externa)
        g.globalAlpha = 0.55; g.beginPath(); g.arc(cx, cy, rin, 0, 2*Math.PI); g.stroke();                             // contorno (= |r|)
        g.globalAlpha = 0.32; g.beginPath(); g.ellipse(cx, cy, rin, rin*Math.abs(Math.sin(el)), 0, 0, 2*Math.PI); g.stroke();   // equador → leitura de esfera
      }
      g.globalAlpha = prevA;
    }
    // vetor de estado: tom forte (puro) / médio (reduzido/misto) — sem mudar de matiz
    const [vx,vy] = proj(v.x, v.y, v.z, cx, cy, R, az, el);
    g.strokeStyle = mixed ? C.vecMixed : C.vec; g.lineWidth = 2.5;
