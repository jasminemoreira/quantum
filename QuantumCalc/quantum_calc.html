    g.beginPath(); g.moveTo(cx,cy); g.lineTo(vx,vy); g.stroke();
    g.fillStyle = mixed ? C.vecMixed : C.vec; g.beginPath(); g.arc(vx, vy, 4, 0, 2*Math.PI); g.fill();
    // (o readout |r|/estado migrou p/ abaixo da esfera — Render.blochReadout)
  }
  return { render, AZ_DEF, EL_DEF };
})();

/* =====================================================================
   M14 — keymap : layout declarativo do teclado único (modo × camada).
   Substitui o menu de abas do v1. layout(mode, page) → linhas de teclas (v14: page substitui shifted).
   Cada tecla: { k(ação/data-key), label, cls, span }.
   ===================================================================== */
const Keymap = (() => {
  const MODES = ['quantum', 'calc'];
  // ações: 'key:<K>' (FSM), 'gate:<G>', 'op:<O>',
  //        'chbase', 'fmtcycle', 'cmd:<C>', 'calc:<tok>' (entrada de ângulo/λ), 'ev:<O>' (picker), 'eval'
  // Disposição estilo CALCULADORA sobre GRADE DE 10 COLUNAS. A 1ª linha agrupa TODOS os
  // controles (marrons fn) como teclas estreitas de 1 col → 10/linha; as demais
  // linhas usam teclas largas de 2 cols → 5/linha (numpad/portas/ops). cls = cor do grupo.
  // cls: fn(entrada/cmd) · ''(dígitos/const) · gate(1q) · g2(2q/operadores) · op(operações/funções) · vw(vista/refs) · eq(=/modo)
  // 4º elemento opcional = span de coluna (default 2; controles da 1ª linha = 1).
  const SP = ['','',''];   // espaçador invisível

/* =====================================================================
   v22 (M-input) — Prep : preparação de estados de 1 qubit (teclas de input
   |T⟩ / rand / amp da pág.2). Núcleo PURO (sem DOM). |T⟩ é EXATO (macro H·T,
   reaproveita o motor ℤ[ζ₁₆]); rand/amp são NUMÉRICOS (≈) — alimentam o mesmo
   caminho aproximado + badge ≈ já existente. Os três SUBSTITUEM por um estado
   FRESCO de 1 qubit (decisão P1/P3 — como SET), não atuam dentro de registro.
   ===================================================================== */
const Prep = (() => {
  // |T⟩ EXATO = T·H|0⟩ = (|0⟩ + e^{iπ/4}|1⟩)/√2 ∈ ℤ[ζ₁₆]. Macro atômico: |0⟩ → H → T.
  // (P2/P3 achado B: reseta p/ |0⟩ 1 qubit; nunca aplica sobre estado pré-existente → sempre exato.)
  function tState(){
    let s = State.computational(1);
    s = Engine.apply(s, 'H', { targets:[0] });
    s = Engine.apply(s, 'T', { targets:[0] });
    return s;
  }
  // rand: ponto Haar-uniforme na esfera de Bloch (P2/P3 achado D — NÃO θ uniforme).
  // θ = acos(1−2u), φ = 2πv  (u,v ∈ [0,1)) → |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩. Numérico (≈).
  function randAmps(u, v){
    const theta = Math.acos(1 - 2*u), phi = 2*Math.PI*v;
    const c = Math.cos(theta/2), s = Math.sin(theta/2);
    return [[0, c, 0], [1, s*Math.cos(phi), s*Math.sin(phi)]];
  }
  // amp: amplitudes diretas α|0⟩+β|1⟩, normalizadas (‖ψ‖=1). Numérico (≈).
  // α=β=0 (vetor nulo) → null (estado inválido; a UI rejeita com erro).
  function normAmps(aRe, aIm, bRe, bIm){
    const n = Math.hypot(aRe, aIm, bRe, bIm);
    if (n < 1e-12) return null;
    return [[0, aRe/n, aIm/n], [1, bRe/n, bIm/n]];
  }
  // v22-14: polarToRect REMOVIDO (morto) — a entrada polar/exp do amp passou a ser via exp(i·θ) no pad
  // científico (Calc.evaluate complexo), então o helper r∠θ→a+bi não é mais usado pelo app.
  return { tState, randAmps, normAmps };
})();

  }
  function hasDetail(){ const a = $('auxOutput'); return !!a && a.textContent.trim() !== ''; }   // v16: detalhe = só readouts de texto (#auxOutput); a esfera de Bloch é inline no painel principal

        const zonesTrans = [];
        zones.forEach((z, i) => { zonesTrans[i] = z.style.transition; z.style.transition = 'none'; });
        if (disp) disp.style.transition = 'none';
        const oldKpH = kp.offsetHeight;
        const naturalHeights = Array.from(zones).map(z => z.offsetHeight);
        document.body.classList.add('display-expanded');
        void kp.offsetHeight;
        const newKpH = kp.offsetHeight;
        const freed = oldKpH - newKpH;
        document.body.classList.remove('display-expanded');
        void kp.offsetHeight;
        zones.forEach((z, i) => { z.style.height = naturalHeights[i] + 'px'; });
        zones.forEach((z, i) => { z.style.transition = zonesTrans[i] || ''; });
        if (disp) disp.style.transition = dispTrans;
        void kp.offsetHeight;
        document.body.classList.add('display-expanded');
        if (disp && freed > 0){
          const dispCS = getComputedStyle(disp);
          const padBorder = (parseFloat(dispCS.paddingTop)||0) + (parseFloat(dispCS.paddingBottom)||0)
                          + (parseFloat(dispCS.borderTopWidth)||0) + (parseFloat(dispCS.borderBottomWidth)||0);
          const curContent = parseFloat(dispCS.height) || (disp.getBoundingClientRect().height - padBorder);
          _preExpandDispH = disp.style.height;
          disp.style.height = (curContent + freed) + 'px';
        }
      }
      playBlochSlide(blochFirst, 'x');         // v21-5: expand = só horizontal direita→centro (vertical já fica bom; expand "perfeito")
      applyExpand();
      setTimeout(() => renderBloch(), 300);   // v21-1: esfera cresce DEPOIS do display assentar
      // v22-20/21: ao ASSENTAR a animação de colapso (.25s), tira as zonas do fluxo (display:none via classe settled)
      // → some o row-gap vazio; o resíduo liberado é doado ao display. v22-21: o display:none é INSTANTÂNEO (blocos
      // sobem o resíduo), então o crescimento compensatório do display TAMBÉM tem de ser instantâneo (transition:none,
      // mesmo frame) — senão o display anima .25s e os blocos "dão um pulinho" (sobem e voltam). Guard: colapso antes => no-op.
      setTimeout(() => {
        if (!_expanded || !kp || !disp) return;
        const before = kp.offsetHeight;
        document.body.classList.add('display-expanded-settled');
        void kp.offsetHeight;
        const extra = before - kp.offsetHeight;          // resíduo (linha vazia + row-gap) removido pelo display:none
        if (extra > 0){
          const cur = parseFloat(getComputedStyle(disp).height) || disp.getBoundingClientRect().height;
          const t = disp.style.transition;
          disp.style.transition = 'none';                // INSTANTÂNEO: casa com o display:none (zero movimento líquido → sem pulinho)
          disp.style.height = (cur + extra) + 'px';
          void disp.offsetHeight;                         // commit no mesmo frame
          disp.style.transition = t;
        }
      }, 280);
    } else {
      // COLLAPSE — v21-3: INVERTE a ordem (pedido operadora) → a esfera encolhe PRIMEIRO, depois o display.
      const collapseDisplay = () => {
        const blochFirst = blochRect();           // v21-5: posição ANTES (coluna, centro-topo)
        lockApp();
        // v22-20: tira o display:none (settled) ANTES — as zonas voltam ao fluxo ainda em height:0 (classe
        // display-expanded), um reflow fixa esse estado; só então removemos display-expanded p/ animar height 0→natural.
        document.body.classList.remove('display-expanded-settled');
        if (kp) void kp.offsetHeight;
        document.body.classList.remove('display-expanded');
        if (disp) disp.style.height = _preExpandDispH;
        _preExpandDispH = '';
        playBlochSlide(blochFirst, 'xy');         // v21-6: collapse = diagonal (centro-topo→direita-centro) — elimina o "pulo para baixo"
        // Limpa inline heights após a animação para o layout retomar naturalmente
        const zones = document.querySelectorAll('.zone-kets-prepare-factor, .zone-gates');
        setTimeout(() => { zones.forEach(z => { z.style.height = ''; }); }, 270);
        applyExpand();
        setTimeout(() => renderBloch(), 300);   // finaliza o tamanho exato após o display assentar
      };
      if (blochOn && cv && _preExpandBlochCss){
        cv.style.width = _preExpandBlochCss; cv.style.height = _preExpandBlochCss;   // esfera encolhe AGORA (transição CSS .28s)
        _preExpandBlochCss = '';
        setTimeout(collapseDisplay, 300);          // o display só colapsa DEPOIS da esfera
      } else {
        _preExpandBlochCss = '';
        collapseDisplay();                          // sem esfera ativa → colapsa direto
      }
    }
  }
  // v19 (F3b): ResizeObserver IDEMPOTENTE — observa o #stateDisplay (cresce com o conteúdo) E a
  // .disp-scroll (container de altura fixa flex-sized). Overflow checa o CONTAINER (cuja scroll{H,W}
  // > client{H,W} indica que o conteúdo extrapolou) — vertical OU horizontal. Loop morto via guard.
  // v19-L2 (operadora): o #stateDisplay tem altura livre (scrollHeight≡clientHeight), o overflow real
  // mora na .disp-scroll (overflow:auto); observador antigo nunca disparava.
  function initDisplayOverflowObserver(){
    const sd = $('stateDisplay'); if (!sd || typeof ResizeObserver !== 'function') return;
    const sc = sd.parentElement;                                       // .disp-scroll (overflow:auto)
    const check = () => {
      const tgt = sc || sd;
      const newOv = (tgt.scrollHeight > tgt.clientHeight + 2) || (tgt.scrollWidth > tgt.clientWidth + 2);
      if (newOv === _overflowing) return;                              // idempotente: sem oscilação
      _overflowing = newOv;
      applyExpand();
    };
    const obs = new ResizeObserver(check);
    obs.observe(sd);                                                   // muda quando o conteúdo cresce/encolhe
    if (sc) obs.observe(sc);                                           // muda quando a janela redimensiona
  }
  function switchDisplayPane(p){
    if (p === 1 && !hasDetail()) return;                              // não há detalhe p/ mostrar
    displayPane = Math.max(0, Math.min(1, p));
    applyDisplayPane();
  }

  // --- rótulo legível de comando p/ histórico ---
  function labelOf(cmd){
    if (cmd.kind === 'set') return cmd.spec.bits ? `SET |${cmd.spec.bits}⟩`
      : cmd.spec.kets ? `SET ${cmd.spec.kets.map(k => '|' + k.replace('-','−') + '⟩').join('')}`
      : `SET ${cmd.spec.count} qubit(s)`;
    if (cmd.kind === 'prepare') return cmd.label || 'prepare';
    const pw = cmd.power != null ? '^' + (1 << cmd.power) : '';                     // v24: sufixo de potência 2ʲ
    if (cmd.kind === 'applyAll') return `ALL ${cmd.gate}${pw}`;
    const ps = cmd.paramLabels || (cmd.params || []).map(x => (+x).toFixed(3));   // ângulo simbólico (π/4) quando disponível
    const p = ps.length ? `(${ps.join(',')})` : '';
    const c = cmd.controls.length ? cmd.controls.map(q => '•Q'+q).join('') + ' ' : '';
    return `${cmd.gate}${p}${pw} ${c}${cmd.targets.map(q => 'Q'+q).join(',')}`.trim();
  }

  // --- executa um Command declarativo ---
  function execute(cmd){
    if (cmd.kind === 'set'){
      const hasAbs = cmd.spec.kets && cmd.spec.kets.some(SymState.isAbstract);   // v4: ket abstrato → estado SIMBÓLICO
      const ns = hasAbs ? SymState.fromKets(cmd.spec.kets)
        : cmd.spec.bits ? State.fromBits(cmd.spec.bits)
        : cmd.spec.kets ? State.fromKets(cmd.spec.kets)
        : State.computational(cmd.spec.count);
      History.init(ns, labelOf(cmd), cmd);
      qbasis = (cmd.spec.kets && !hasAbs) ? cmd.spec.kets.map(ketBasis) : Array(ns.n).fill('comp');   // v3: preparação fixa a base por qubit (concreto)
    } else if (cmd.kind === 'prepare'){
      // v22: cmd.state = estado EXATO pré-computado (|T⟩ via macro H·T); senão amplitudes numéricas (rand/amp, ≈)
      const st = cmd.state || (() => { const m = new Map(); for (const [i, re, im] of cmd.amps) m.set(i, Algebra.numeric(re, im)); return new State(cmd.n, m); })();
      History.init(st, labelOf(cmd), cmd);
    } else if (cmd.kind === 'apply'){
      const cur = History.current();
      const reps = cmd.power == null ? 1 : (1 << cmd.power);   // v24: aplica 2ʲ vezes (1 entrada atômica)
      let ns = cur;
      // v24: caminho concreto via applyN (valida só range+duplicatas) p/ aceitar controles EXTRAS (CTRL generalizado);
      // a aridade de alvos já foi validada no Parser. Sem power, reps=1 → comportamento idêntico ao anterior.
      for (let r = 0; r < reps; r++) ns = ns.sym
        ? SymEngine.apply(ns, { gate:cmd.gate, targets:cmd.targets, controls:cmd.controls, params:cmd.params, paramLabels:cmd.paramLabels }, SymRules)
        : Engine.applyN(ns, cmd.gate, { targets:cmd.targets, controls:cmd.controls, params:cmd.params });
      History.push(ns, labelOf(cmd), cmd);
    } else if (cmd.kind === 'applyAll'){
      const cur = History.current();
      const reps = cmd.power == null ? 1 : (1 << cmd.power);   // v24
      let ns = cur;
      for (let r = 0; r < reps; r++) ns = ns.sym
        ? SymEngine.apply(ns, { kind:'applyAll', gate:cmd.gate, params:cmd.params, paramLabels:cmd.paramLabels }, SymRules)
        : Engine.applyAll(ns, cmd.gate, cmd.params);
      History.push(ns, labelOf(cmd), cmd);
    } else if (cmd.kind === 'preset'){                                   // v9: macro/preset (bloco atômico)
      const cur = History.current();
      const n = cur.n;
      let qubits;
      if (cmd.all) qubits = Array.from({ length:n }, (_, i) => i);        // ALL → registro inteiro
      else { const lo = Math.min(...cmd.qsel), hi = Math.max(...cmd.qsel); qubits = []; for (let q = lo; q <= hi; q++) qubits.push(q); }   // dois Q → range contíguo [min..max]
      for (const q of qubits) if (q < 0 || q >= n) throw new Error(`qubit Q${q} out of range (n=${n})`);
      // v22-15: preset roda sobre os qubits CONCRETOS de um estado simbólico (ex.: |ψ⟩⊗|0⟩|0⟩ → Bell em Q1,Q2);
      // recusa só se algum alvo for o slot abstrato |ψ⟩ (o preset age na parte concreta — as portas H/CNOT/… já
      // funcionam sobre qubits concretos de um SymState; antes do v22-15 todo preset era concrete-only, v9).
      if (cur.sym){
        const abs = qubits.find(q => cur.layout[q] === 'a');
        if (abs !== undefined) throw new Error(`preset target Q${abs} is the abstract |ψ⟩ — presets act on concrete qubits only`);
      }
      const need = Presets.MIN_QUBITS[cmd.name];
      if (cmd.name === 'Bell' && qubits.length !== 2) throw new Error('Bell requires exactly 2 qubits (e.g. 0 Q 1 Q Bell)');
      if (qubits.length < need) throw new Error(`${cmd.name} requires ≥${need} qubit(s)`);
      // v24: preset CONTROLADO — injeta os controles pendentes em CADA op primitiva. Válido pois
      // controlled(∏Gᵢ)=∏controlled(Gᵢ) quando o controle ∉ alvos do preset (mesmo controle, fora do range).
      const ctrls = cmd.controls || [];
      for (const c of ctrls){
        if (c < 0 || c >= n) throw new Error(`control Q${c} out of range (n=${n})`);
        if (qubits.includes(c)) throw new Error(`control Q${c} overlaps the preset target range`);   // M3 guard
        if (cur.sym && cur.layout[c] === 'a') throw new Error(`control Q${c} is the abstract |ψ⟩ — controls act on concrete qubits only`);
      }
      const { ops } = Presets.expand(cmd.name, qubits);
      const reps = cmd.power == null ? 1 : (1 << cmd.power);              // v24: preset aplicado 2ʲ vezes (1 passo atômico)
      let ns = cur;
      for (let r = 0; r < reps; r++) for (const o of ops){               // dobra as primitivas (incl. MCZ no caminho concreto)
        const inj = { gate:o.gate, targets:o.targets || [], controls:[...(o.controls || []), ...ctrls], params:o.params || [] };   // v24: controles injetados
        ns = cur.sym ? SymEngine.apply(ns, inj, SymRules) : Engine.applyN(ns, o.gate, inj);
      }
      const tag = qubits.length > 1 ? `q${qubits[0]}..q${qubits[qubits.length-1]}` : `q${qubits[0]}`;
      const cpfx = ctrls.length ? 'c-' : '', psfx = cmd.power != null ? '^' + reps : '';   // v24: c-Grover^8 …
      History.push(ns, `${cpfx}${cmd.name === 'QFTinv' ? 'QFT†' : cmd.name}${psfx} ${tag}`, cmd);
    }
    clearError();
    $('auxOutput').textContent = '';   // resultado de operação anterior fica obsoleto ao mudar o estado
    displayPane = 0;                    // v16: ao mudar o estado, o visor volta ao painel principal (o estado novo)
    // v21-36: o teclado PERMANECE na página corrente após aplicar porta/preset da pág.2 — sem auto-retorno à
    // pág.1 (escolha da operadora). Permite ENCADEAR portas da cauda-longa (SWAP→CCX→S†…) sem re-swipar; a
    // volta à pág.1 é só por swipe/seta/dot. (v14 voltava sozinho assumindo uso único — atrito ao encadear.)
  }

  // v22-14: collectParams REMOVIDO (código morto) — coletava o 2º/3º parâmetro de U/CU via window.prompt
  // nativo, mas NUNCA era chamado: a entrada inline de ângulo (startAngleEntry/doEval, idx 0..n-1) já coleta
  // TODOS os parâmetros pelo pad do app. Era o último window.prompt do projeto.

  function onGate(name){
    const meta = Gate.meta(name);
    const cur = History.current();
    if (cur && cur.sym){                                  // v4: modo simbólico — alvo abstrato dispara entrada de λ
      const pk = Parser.peekOperands();
      let tgs = pk.targets.slice();
      if (!tgs.length && !pk.controls.length && meta.targets === 1 && meta.controls === 0 && Number.isInteger(pk.selection)) tgs = [pk.selection];
      const tgtAbs = tgs.some(q => q >= 0 && q < cur.n && cur.layout[q] === 'a');
      if (tgtAbs){ startLambdaEntry(name, cur); return; }   // autovalor inline (params da porta ignorados p/ abstrato)
      // alvo concreto: aplica direto (param → coleta o ângulo via entrada inline padrão)
      if (meta.params.length){ startAngleEntry(name, meta, Parser.getExprRaw()); return; }
      const rc = Parser.applyGate(name);
      if (rc.error){ showError(rc.error); return; }
      try { execute(rc.command); } catch (e){ showError(e.message); }
      refresh(); return;
    }
    if (meta.params.length){ startAngleEntry(name, meta, Parser.getExprRaw()); return; }  // inline, sem prompt
    const r = Parser.applyGate(name);
    if (r.error){ showError(r.error); return; }
    try { execute(r.command); } catch (e){ showError(e.message); }
    refresh();
  }
  // v9: dispara um preset/macro (QFT/QFT†/Bell/GHZ/Grover/W). Concrete-only; bloco atômico no histórico.
  function onPreset(name){
    const r = Parser.preset(name);
    if (r.error){ showError(r.error); refresh(); return; }
    try { execute(r.command); } catch (e){ showError(e.message); }
    refresh();
  }
  // v22: teclas de INPUT (pág.2) — substituem por estado FRESCO de 1 qubit (como SET; History.init).
  // |T⟩ = EXATO (macro H·T); rand = Haar-uniforme ≈; amp = abre a gaveta de amplitudes (α,β diretas) ≈.
  function onInput(which){
    if (which === 'T'){
      try { execute({ kind:'prepare', state:Prep.tState(), label:'|T⟩' }); }   // EXATO ℤ[ζ₁₆], 1 entrada de histórico (atômico)
      catch (e){ showError(e.message); }
      qbasis = ['comp']; Parser.clear(); refresh();
    } else if (which === 'rand'){
      const amps = Prep.randAmps(Math.random(), Math.random());                // numérico (≈); badge acende sozinho
      try { execute({ kind:'prepare', n:1, amps, label:'rand' }); }
      catch (e){ showError(e.message); }
      qbasis = ['comp']; Parser.clear(); refresh();
    } else if (which === 'amp'){
      startAmpEntry();   // entrada guiada pelo PAD do app (sem teclado nativo), no idioma da entrada de ângulo
    }
  }
  // v22-6: ENTRADA DE AMPLITUDE — pad CIENTÍFICO próprio (amplitude é número COMPLEXO, ≠ ângulo real).
  // Cada amplitude (α, β) é UMA EXPRESSÃO COMPLEXA avaliada por Calc.evaluate (que já suporta √ sin cos exp
  // e i π e aritmética complexa): retangular (a+b·i), polar/exp (r·exp(i·θ)), exato quando recai em ℤ[ζ₁₆]
  // (1/√2, exp(iπ/4)…), ≈ quando não (√3, ângulos fora de π/8). 2 passos: α |0⟩ → '='; β |1⟩ → '='; normaliza.
  // O FORMATO de saída (rect/polar/exp) é o toggle 'fmt' do visor — a entrada cobre os três pela expressão.
  const AMP_FIELDS = ['α |0⟩', 'β |1⟩'];
  function startAmpEntry(){
    ampEntry = { idx:0, vals:[] };
    Parser.clearExpr(); calcBuf = ''; calcResult = '';
    applySheet(true); refresh();   // abre a gaveta com o pad científico; o buffer aparece no #display
  }
  function cancelAmp(){ ampEntry = null; calcBuf = ''; calcResult = ''; clearError(); applySheet(false); renderKeypad(); refresh(); }
  function doAmpEval(){
    if (!calcBuf.trim()){ calcResult = '⚠ enter a complex expression (e.g. 1/√2, (√3+i)/2, exp(i·π/3))'; refresh(); return; }
    const r = Calc.evaluate(calcBuf.trim(), null);            // avaliador COMPLEXO completo (√ sin cos exp e i π …)
    if (r.error){ calcResult = '⚠ ' + r.error; refresh(); return; }
    const c = r.isPi ? { re: r.piNum, im: 0 } : Algebra.toComplex(r.value);   // π solto = real; senão complexo
    ampEntry.vals.push(c);
    calcBuf = ''; calcResult = '';
    if (ampEntry.idx + 1 < 2){ ampEntry.idx++; refresh(); return; }   // próxima amplitude (β)
    const [a, b] = ampEntry.vals;
    const amps = Prep.normAmps(a.re, a.im, b.re, b.im);
    if (!amps){ showError('α and β cannot both be zero (null vector) — re-enter'); ampEntry.idx = 0; ampEntry.vals = []; refresh(); return; }
    ampEntry = null;
    try { execute({ kind:'prepare', n:1, amps, label:'amp' }); } catch (e){ showError(e.message); }
    qbasis = ['comp']; Parser.clear();
    applySheet(false); renderKeypad(); refresh();   // gaveta desce + reconstrói o teclado (auto-return)
  }
  // v4: entrada inline do AUTOVALOR λ ao aplicar uma porta a um ket abstrato.
  // O teclado vira o da calc; '=' confirma λ (número/fase exata via Calc, ou símbolo livre se o
  // buffer for um único identificador); CLR/Esc = "deixar simbólico" (nó não-avaliado U|ψ⟩).
  function startLambdaEntry(name, cur){
    const r = Parser.applyGate(name);                     // monta o comando (alvos/controles); params ignorados p/ abstrato
    if (r.error){ showError(r.error); return; }
    const cmd = r.command;
    const q = (cmd.targets || []).find(t => cur.layout[t] === 'a');
    const label = cur.labelAt(q);
    // SEMPRE abre a entrada de λ — o usuário pode digitar um novo ângulo a cada aplicação (mesmo que já
    // exista regra). '=' aplica o padrão e^{iθ}; CLR deixa o nó. (Antes: regra existente reaplicava em
    // silêncio, impedindo digitar um novo ângulo na 2ª vez — pedido da usuária / consistência.)
    lambdaEntry = { cmd, label, gate:name };
    calcBuf = ''; calcResult = ''; clearError(); applySheet(true); refresh();   // v15: gaveta sobe
  }
  // v4: a entrada inline é o ÂNGULO DE FASE φ; o autovalor é λ = e^{iφ} (unitário, |λ|=1).
  // ÂNGULO SIMBÓLICO linear num símbolo livre: φ = [coef]·[π?]·sym (θ, 2πθ, πθ, 2θ…) → e^{iφ}
  function parsePhaseAngle(buf){
    const s = buf.trim().replace(/\s+/g,'').replace(/\*/g,'').replace(/pi/gi,'π');
    const m = s.match(/^(-|−)?(\d+)?(π)?([A-Za-zθφλμχ][0-9]*)$/);
    if (!m) return null;
    const sym = m[4];
    if (sym === 'e' || sym === 'i') return null;          // constantes, não símbolos livres
    if (!m[2] && !m[3] && sym.length === 0) return null;
    return { coefN: (m[1] ? -1 : 1) * (m[2] ? parseInt(m[2],10) : 1), coefD:1, hasPi: !!m[3], sym };
  }
  // forma literal e^{…}/exp(…) digitada diretamente (compat) → descritor de fase
  function parsePhaseLambda(buf){
    let s = buf.trim().replace(/\s+/g,'').replace(/\*/g,'').replace(/pi/gi,'π');
    const m = s.match(/^e\^\{(.+)\}$/) || s.match(/^exp\((.+)\)$/) || s.match(/^e\^(.+)$/);
    if (!m) return null;
    let e = m[1];
    if (e.indexOf('i') < 0) return null;
    let sign = 1;
    if (e[0] === '-' || e[0] === '−'){ sign = -1; e = e.slice(1); }
    const hasPi = e.indexOf('π') >= 0; e = e.replace(/π/g,'').replace('i','');
    const cm = e.match(/^(\d+)?([A-Za-zθφλμχ][0-9]*)$/);
    if (!cm || cm[2] === 'e') return null;
    return { coefN: sign * (cm[1] ? parseInt(cm[1],10) : 1), coefD:1, hasPi, sym: cm[2] };
  }
  function doLambda(asNode){
    const ent = lambdaEntry;
    if (!asNode){                                         // declara a regra U|ψ⟩=λ, com λ = e^{iφ}
      const buf = calcBuf.trim();
      let lam;
      if (!buf){ lam = SymExpr.phaseAtom({ coefN:1, coefD:1, hasPi:false, sym:'θ' }); }   // '=' vazio → λ = e^{iθ} (fase simbólica — padrão elegante; θ p/ não colidir com o ket |φ⟩)
      else {
        const symA = parsePhaseAngle(buf);
        if (symA){ lam = SymExpr.phaseAtom(symA); }          // φ simbólico (θ, 2πθ…) → e^{iφ}
        else {
          const litA = parsePhaseLambda(buf);
          if (litA){ lam = SymExpr.phaseAtom(litA); }        // literal e^{…} digitado direto
          else {
            const rr = Calc.evaluate(buf, null);             // φ concreto → λ = e^{iφ} (exato p/ múltiplo de π/4)
            if (rr.error){ calcResult = '⚠ ' + rr.error; refresh(); return; }
            let phi = rr.isPi ? rr.piNum : Algebra.toComplex(rr.value).re;
            if (angleMode === 'turns' && !rr.isPi) phi *= 2 * Math.PI;   // FIX (fora do delta v14): λ honra o modo turns (1/8 turn → π/4 exato), espelhando a entrada de ângulo de porta (~2999); π explícito fica como digitado
            lam = SymExpr.fromAmp(Algebra.recognize(Math.cos(phi), Math.sin(phi)));
          }
        }
      }
      SymRules.declare(ent.gate, '', ent.label, lam);
      ent.cmd.lambdaLabel = SymExpr.format(lam, 'rect').text;
    }
    lambdaEntry = null; calcBuf = ''; calcResult = '';
    try { execute(ent.cmd); } catch (e){ showError(e.message); }
    applySheet(false); renderKeypad(); refresh();   // v15: gaveta desce (animado) + reconstrói o teclado (auto-return)
  }
  // entrada inline de ângulo: o teclado da calc digita a expressão; '=' confirma cada parâmetro
  function startAngleEntry(name, meta, seed){
    angleEntry = { gate:name, meta, params:[], labels:[], idx:0 };
    Parser.clearExpr(); calcBuf = seed || ''; calcResult = '';
    applySheet(true); refresh();   // v15: gaveta sobe; o prompt do ângulo aparece no #display
  }
  function cancelAngle(){ angleEntry = null; calcBuf = ''; calcResult = ''; clearError(); applySheet(false); renderKeypad(); refresh(); }

  // --- operações (painel) ---
  function fmtMatrix(rho){
    const cells = rho.map(row => row.map(a => Algebra.format(a, 'rect').text));
    const w = Math.max(3, ...cells.flat().map(s => s.length));
    const n = cells.length;
    return cells.map((r, i) => {
      const body = r.map(s => s.padStart(w)).join('   ');
      const L = n === 1 ? '[' : i === 0 ? '⎡' : i === n - 1 ? '⎣' : '⎢';
      const R = n === 1 ? ']' : i === 0 ? '⎤' : i === n - 1 ? '⎦' : '⎥';
      return `${L} ${body} ${R}`;
    }).join('\n');
  }
  // v4: probabilidade dos QUBITS CONCRETOS num estado simbólico, quando os fatores abstratos são
  // COMUNS a todos os termos (|ψ⟩ unitário fatorável). P(bits) = |coef|² (fases têm módulo 1).
  // Exato quando o coef recai em ℤ[ω] (ex.: kickback (1±ω)/2 → (2±√2)/4); senão numérico/sinalizado.
  function symProb(sym){
    const aSlots = [], cSlots = [];
    for (let q = 0; q < sym.n; q++) (sym.layout[q] === 'a' ? aSlots : cSlots).push(q);
    const akey = (t) => aSlots.map(q => SymState.slotKey([t.slots[q]])).join('|');
    const k0 = sym.terms.length ? akey(sym.terms[0]) : '';
    if (!sym.terms.every(t => akey(t) === k0)){ showError('the abstract factors differ between terms — factor out the common ket (|ψ⟩) first, or the probability would depend on ⟨ψ|·⟩ (outside the symbolic scope)'); return; }
    if (!cSlots.length){ showError('purely abstract state — no concrete qubit to measure'); return; }
    const rows = [];
    for (const t of sym.terms){
      const mono = t.coef.mono;
      let bad = mono.length !== 1;                                   // soma → |Σ|² depende de fase relativa (simbólico)
      if (!bad) for (const [name] of mono[0].syms) if (!name.startsWith('ph:')) bad = true;   // só fases (|·|=1) são seguras
      if (bad){ showError('coefficient is a sum/free symbol → SYMBOLIC probability (depends on the parameter). Use a concrete value of φ, or factor.'); return; }
      const n2 = Algebra.norm2(mono[0].amp);
      const value = n2.value, str = Algebra.normStr(n2);
      rows.push({ bits: cSlots.map(q => t.slots[q]).join(''), value, str, approx: !n2.exact && !Algebra.matchSurd(value) });
    }
    rows.sort((a, b) => a.bits < b.bits ? -1 : 1);
    const total = rows.reduce((s, r) => s + r.value, 0);
    const aLbl = aSlots.map(q => '|' + sym.labelAt(q) + '⟩').join('⊗');
    const wSym = Math.max(1, ...rows.map(r => r.str.length));   // v21-28: pad dinâmico (sem vão fixo que empurra a barra e quebra a linha quando P=1)
    out(rows.map(r => `P(${r.bits}) = ${r.str.padEnd(wSym)}${r.approx ? ' (≈)' : ''} ${bar(r.value)}`).join('\n')
        + (Math.abs(total - 1) > 1e-6 ? `\n(Σ = ${(+total.toFixed(5))} — state not normalized)` : '')
        + `\n[probability of the concrete qubits; common abstract factor ${aLbl} treated as unit]`);
    clearError();
  }
  // v4: MEDIDA PARCIAL projetiva (amostragem) de UM qubit concreto num estado simbólico.
  // Amostra o resultado ∝ Σ|amp|² (amplitudes simbólicas ψ₀,ψ₁ tratadas como base unitária),
  // colapsa para o ramo e RENORMALIZA por 1/√P (exato p/ P diádico: √2, 2…). Habilita o
  // protocolo de teletransporte: medir q0,q1 → corrigir q2 com X/Z. (extensão P5)
  function symMeasure(sym, q){
    if (sym.layout[q] !== 'c'){ showError('Q' + q + ' is abstract — only concrete qubits can be measured (use |ψ⟩ as a control to expand it first)'); return; }
    const termW = (coef) => coef.mono.reduce((s, m) => { const c = Algebra.toComplex(m.amp); return s + c.re*c.re + c.im*c.im; }, 0);
    let w0 = 0, w1 = 0;
    for (const t of sym.terms){ const b = t.slots[q], w = termW(t.coef); if (b === '0') w0 += w; else if (b === '1') w1 += w; }
    const total = w0 + w1;
    if (total <= 1e-15){ showError('no amplitude on qubit Q' + q); return; }
    const b = (Math.random() * total < w0) ? '0' : '1';
    const P = (b === '0' ? w0 : w1) / total;
    const renorm = Algebra.recognize(1 / Math.sqrt(P), 0);                 // 1/√P exato p/ P=½→√2, ¼→2…
    const kept = sym.terms.filter(t => t.slots[q] === b)
      .map(t => ({ coef: SymExpr.scaleAmp(t.coef, renorm), slots: t.slots.slice() }));
    const ns = new SymState(sym.layout, SymState._combine(kept), sym.selection).fold();   // v17: re-dobra se o colapso deixar um qubit separável ψ₀|0⟩+ψ₁|1⟩
    History.push(ns, `measure Q${q} → |${b}⟩`, null);
    Parser.clear(); clearError(); refresh();
    out(`Measurement of Q${q} → outcome |${b}⟩   (P = ${(+P.toFixed(4))})\nstate collapsed and renormalized — apply the Pauli correction to the target according to the outcome.`);
  }
  function onOp(op){
    const s = History.current();
    // v13: M / ⟨φ|ψ⟩ / ⊗ são TYPE-AWARE (funcionam em concreto E simbólico) — tratados ANTES do short-circuit simbólico (C2).
    if (op === 'saveBra'){ savedState = s; out('State saved as φ (for ⟨φ|ψ⟩ and ⊗).'); return; }
    if (op === 'inner'){
      if (!savedState){ showError('save a state φ first (button "M")'); return; }
      if (savedState.sym || s.sym){ showError('⟨φ|ψ⟩ is unavailable for symbolic states |ψ⟩'); return; }   // concrete-only (v4 A2)
      if (savedState.n !== s.n){ showError('⟨φ|ψ⟩ requires the same number of qubits'); return; }
      const ip = Ops.inner(savedState, s); const f = Algebra.format(ip, phaseFmt);
      out(`⟨φ|ψ⟩ = ${f.text}${f.approx ? '  (≈)' : ''}`); return;
    }
    if (op === 'tensor'){
      if (!savedState){ showError('save a state φ first (button "M")'); return; }
      try {
        if (savedState.sym || s.sym){                       // v13: ⊗ simbólico/misto — promove o operando concreto → SymState
          const a = savedState.sym ? savedState : SymState.fromConcrete(savedState);
          const b = s.sym ? s : SymState.fromConcrete(s);
          const t = a.tensor(b);
          History.init(t, `φ ⊗ ψ (${t.n} qubits)`, { kind:'prepare', sym:true, label:'φ⊗ψ' });
          Parser.clear(); refresh(); out('Result φ⊗ψ became the current state.'); return;
        }
        const t = Ops.tensor(savedState, s);
        History.init(t, `φ ⊗ ψ (${t.n} qubits)`, { kind:'prepare', n:t.n, amps:[...t.amps].map(([i,a])=>{const c=Algebra.toComplex(a);return [i,c.re,c.im];}), label:'φ⊗ψ' });
        Parser.clear(); refresh(); out('Result φ⊗ψ became the current state.');
      } catch (e){ showError(e.message); }
      return;
    }
    if (s.sym){                                            // v4/v13: modo simbólico — só prob (distribuição) e measure (colapso); demais ops erram (concrete-only)
      if (op === 'prob'){ showProb = !showProb; if (!showProb) out(''); refresh(); }   // v21-24: prob é TOGGLE também no simbólico/misto (o render despacha symProb); antes era one-shot e não desligava
      else if (op === 'measure'){ const sel = Parser.getSelection(); if (sel === 'ALL'){ showError('select a qubit (n Q) and click "measure" to collapse'); return; } symMeasure(s, sel); }
      else showError('unavailable in symbolic mode (concrete-state operation)');
      return;
    }
    try {
      if (op === 'norm'){ const n = Ops.norm(s); out(`⟨ψ|ψ⟩ = ${Ops.n2Str(n)}  (‖ψ‖ = ${(+Math.sqrt(Ops.n2Value(n)).toFixed(6))})`); }
      else if (op === 'corr'){
        // v21-32: correlação ⟨⊗Z⟩ por PARIDADE. Qubits = alvos selecionados (n Q / i Q j Q); nenhum ⇒ TODOS (ALL).
        const pk = Parser.peekOperands();
        let qs = pk.targets.slice();
        if (qs.some(q => q < 0 || q >= s.n)){ showError('selected qubit is out of the state'); return; }
        const r = Ops.corr(s, qs);                       // qs vazio ⇒ todos
        const sub = (n) => String(n).split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[+d]).join('');
        const lbl = '⟨' + r.qubits.map(q => 'Z' + sub(q)).join('') + '⟩';
        const f = Algebra.format(r.value, 'rect');
        out(`${lbl} = ${f.text}${f.approx ? ' (≈)' : ''}   (≈ ${(+Algebra.toComplex(r.value).re.toFixed(6))})`);
        Parser.clear();
      }
      else if (op === 'prob'){
        // v21-20: prob é toggle on/off SIMPLES; o readout segue a SELEÇÃO corrente ao vivo (dinâmico) —
        // ALL → distribuição plena / n Q → marginal P(Qn=0)/P(Qn=1). Trocar a seleção (n Q / ALL) atualiza
        // sozinho (onKey sempre chama refresh); não precisa re-apertar prob.
        showProb = !showProb;
        if (!showProb) out('');
        refresh();
      }
      else if (op === 'globalPhase'){
        const r = Ops.factorGlobalPhase(s); const f = Algebra.format(r.global, phaseFmt);
        History.push(r.state, `factor global phase ${f.text}`, null);
        refresh(); out(`Global phase factored: ${f.text}${r.approx ? ' (≈)' : ''}\n(1st amplitude → positive real)`);
      }
      else if (op === 'bloch'){
        const q = (Parser.getSelection() === 'ALL') ? 0 : Parser.getSelection();
        const b = Ops.blochVector(s, q);
        const fr = (a) => Algebra.format(a, 'rect').text;
        out(`Bloch vector (Q${q}):\n  ⟨σx⟩ = ${fr(b.x)}\n  ⟨σy⟩ = ${fr(b.y)}\n  ⟨σz⟩ = ${fr(b.z)}\n  |r| = ${(+b.r.toFixed(6))}${b.r < 0.999999 ? '  (reduced state — entangled/mixed)' : '  (pure)'}`);
      }
      else if (op === 'density'){
        const d = Ops.densityMatrix(s);
        const grid = Array.from({length:d.dim}, () => Array.from({length:d.dim}, () => Algebra.ZERO));
        for (const e of d.entries) grid[e.i][e.j] = e.amp;
        out(`ρ = |ψ⟩⟨ψ|  (Tr ρ = ${Ops.n2Str(d.trace)}, purity Tr ρ² = ${Ops.n2Str(d.purity)}):\n${fmtMatrix(grid)}`);
      }
      else if (op === 'measure'){
        const measBasis = qbasis.every(b => b === qbasis[0]) ? qbasis[0] : 'comp';   // base de medição: uniforme se todos iguais, senão computacional
        const br = Ops.measure(s, { basis: measBasis });
        const sym = measBasis === 'comp' ? '' : ` [base ${Render.BASIS_LABEL[measBasis]}]`;
        const branchesTxt = `Measurement${sym} — branches (exact prob):\n` +
            br.map(b => `  |${b.outcome}⟩ : P = ${b.str}${b.approx ? ' (≈)' : ''}`).join('\n');
        // v12: clicar em "measure" JÁ mede — colapsa direto a um ramo amostrado (∝ prob), sem confirmação
        // (a distribuição sem colapso continua disponível no toggle "prob")
        let r = Math.random(), acc = 0, pick = br[0];
        for (const b of br){ acc += b.value; if (r <= acc){ pick = b; break; } }
        History.push(pick.postState.withBasis('comp'), `measurement → |${pick.outcome}⟩`, null);
        refresh();
        out(`${branchesTxt}\n\nCollapsed to |${pick.outcome}⟩ (P = ${pick.str}).`);
      }
      else if (op === 'partial'){
        const keep = Parser.peekOperands().targets.slice();   // v22-8: qubits a MANTER via gramática de operandos (0 Q 1 Q ρ_A), igual ao ⟨ZZ⟩ — sem prompt nativo
        if (!keep.length){ showError('select the qubit(s) to KEEP first, e.g. 0 Q ρ_A  (or 0 Q 1 Q ρ_A)'); return; }
        if (keep.some(q => q < 0 || q >= s.n)){ showError('selected qubit is out of the state'); return; }
        const d = Ops.reducedDM(s, keep);
        const grid = d.rho;
        out(`ρ_A (keeping Q${d.keep.join(',Q')}), dim ${d.dim}×${d.dim}:\n${fmtMatrix(grid)}`);
        Parser.clear();
      }
      else if (op === 'concurrence'){
        const c = Ops.concurrencePure(s);
        out(`Concurrence (2q pure): C = 2|αδ−βγ| = ${(+c.value.toFixed(6))}${c.exactN2 ? `  (|det|² = ${c.detN2Str} exact)` : '  (≈)'}\n  C=0 separable · C=1 max entangled`);
      }
      else if (op === 'schmidt'){
        const sc = Ops.schmidt2(s);
        const lamD = sc.lambdaStr ? sc.lambdaStr.join(', ') : sc.lambdas.map(x=>+x.toFixed(6)).join(', ');
        const coefD = (sc.coeffStr && sc.coeffStr.every(Boolean)) ? sc.coeffStr.join(', ') : sc.coeffs.map(x=>+x.toFixed(6)).join(', ');
        out(`Schmidt decomposition (Q0 | Q1):\n  λ = [${lamD}]\n  coef = [${coefD}]\n  Schmidt rank = ${sc.rank}  → ${sc.entangled ? 'ENTANGLED' : 'separable'}`);
      }
      else if (op === 'vonneumann'){
        const keep = Parser.peekOperands().targets.slice();   // v22-8: subsistema A via operandos (0 Q S(ρ)), sem prompt nativo
        if (!keep.length){ showError('select the qubit(s) of subsystem A first, e.g. 0 Q S(ρ)'); return; }
        if (keep.some(q => q < 0 || q >= s.n)){ showError('selected qubit is out of the state'); return; }
        const v = Ops.vonNeumann(s, keep);
        const lamD = v.valsStr ? v.valsStr.join(', ') : v.vals.map(x=>+x.toFixed(6)).join(', ');
        out(`von Neumann entropy S(ρ_A), A = Q${v.keep.join(',Q')}:\n  S = ${(+v.S.toFixed(6))} bits${v.exactEig ? '  (exact eigenvalues)' : '  (numeric eigenvalues)'}\n  eigenvalues λ = [${lamD}]`);
        Parser.clear();
      }
      clearError();
    } catch (e){ showError(e.message); }
  }
  function bar(value){ return value > 0 ? `▏${'█'.repeat(Math.max(1, Math.round(value*14)))}` : ''; }   // v21-28: escala 20→14 (P=1 não estoura a largura no mobile) + pad dinâmico do valor (sem vão fixo)

  // desenha a expressão no elemento: KaTeX (online) ou texto Unicode com ⊗ em span menor (fallback offline)
  function renderMath(el, dirac){
    if (window.katex){
      try { window.katex.render(Render.toKatex(dirac), el, { throwOnError:false, displayMode:false }); return; }   // KaTeX inline (bonito); estados longos rolam na horizontal (troca de painel é TAP, não swipe → sem disputa)
      catch (e){ /* cai no texto */ }
    }
    dirac.split('⊗').forEach((p, i) => {
      if (i){ const t = document.createElement('span'); t.className = 'tensor'; t.textContent = '⊗'; el.appendChild(t); }
      el.appendChild(document.createTextNode(p));
    });
  }

  // v11: renderiza LaTeX JÁ PRONTO (scaffold da matriz) — NÃO passa por toKatex (estragaria \begin{pmatrix}).
  // Offline (sem KaTeX): cai no texto multilinha 'plain'.
  function renderMathTex(el, tex, plain){
    if (window.katex){
      try { window.katex.render(tex, el, { throwOnError:false, displayMode:false }); return; }
      catch (e){ /* cai no texto */ }
    }
    plain.split('\n').forEach((line, i) => {
      if (i) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(line));
    });
  }

  // --- render principal (MESMA área de display para os dois modos — sem layout saltitante) ---
  function refresh(){
    renderKeypad();   // v4: o teclado depende do estado (modo simbólico desabilita "medir") → re-renderiza a cada mudança
    renderBloch();    // v4-ui: esfera embutida evolui com o estado e o qubit selecionado (mostra/atualiza/esconde)
    applyDisplayPane();   // v16: reconcilia o painel do visor (transform + affordance + inert) em TODOS os caminhos do refresh
    const disp = $('stateDisplay'), sel = $('selection'), status = $('statusLine'), badge = $('approxBadge');
    disp.textContent = ''; sel.textContent = '';
    if (ampEntry){                                       // v22-6: entrada de amplitude COMPLEXA (α, β como expressão) — buffer no visor + prompt do passo
      disp.dataset.plain = calcBuf || '⌶';
      disp.appendChild(document.createTextNode(calcBuf || '⌶'));
      sel.appendChild(document.createTextNode('∿ amp · ' + AMP_FIELDS[ampEntry.idx]));
      if (badge) badge.classList.remove('show');         // durante a digitação não há estado novo p/ sinalizar
      if (!status.classList.contains('err')){
        const cfmt = (c) => Algebra.format(Algebra.numeric(c.re, c.im), 'rect').text;                  // amplitude já confirmada (compacta)
        const done = ampEntry.vals.map((c, i) => `${AMP_FIELDS[i].split(' ')[0]}=${cfmt(c)}`).join(' · ');
        status.textContent = `amp · ${AMP_FIELDS[ampEntry.idx]} = ?  [${ampEntry.idx + 1}/2]` + (done ? `  ·  ${done}` : '') + `  ·  swipe ↓ to cancel`;
      }
      $('historyOut').textContent = History.labels().join('\n') || '(empty)';
      return;
    }
    if (angleEntry || lambdaEntry){
      // entrada inline de ângulo/λ: expressão na linha principal, prompt na linha de status (v13: calc-mode livre removido)
      disp.dataset.plain = calcBuf || '⌶';
      disp.appendChild(document.createTextNode(calcBuf || '⌶'));
      sel.appendChild(document.createTextNode(lambdaEntry ? '∠ λ ' + lambdaEntry.gate + ' · ' : '∠ ' + angleEntry.gate + ' · '));
      { const am = document.createElement('span'); am.className = 'base'; am.dataset.action = 'angcycle';   // v16: chip do modo de ângulo — mostra rad/turns E alterna ao tocar (durante a entrada)
        am.style.cursor = 'pointer'; am.style.textDecoration = 'underline dotted'; am.textContent = angleMode; sel.appendChild(am); }
      if (badge) badge.classList.toggle('show', /≈/.test(calcResult));
      if (!status.classList.contains('err')){
        status.textContent = lambdaEntry
          ? `${lambdaEntry.gate}|${lambdaEntry.label}⟩ = λ|${lambdaEntry.label}⟩   ·   type the angle, = → e^{iθ}, ESC → cancel`
          : angleEntry
          ? `${angleEntry.gate} · ${angleEntry.meta.params[angleEntry.idx]} = ?`
          : calcResult;
      }
      $('historyOut').textContent = History.labels().join('\n') || '(empty)';
      return;
    }
    // v4: estado SIMBÓLICO (SymState) — Dirac simbólico (sem qbasis/bars/evidência concretos)
    {
      const cs = History.current();
      if (cs && cs.sym){
        const rd = Render.renderSym(cs, { phaseFmt, viewForm });
        disp.dataset.plain = rd.dirac;
        renderMath(disp, rd.dirac);                         // KaTeX (online) ou texto (offline) — agora também p/ ⊗/símbolos
        sel.appendChild(document.createTextNode((Parser.getSelection() === 'ALL' ? 'ALL' : 'Q' + Parser.getSelection()) + ' · '));
        const bs = document.createElement('span'); bs.className = 'base'; bs.textContent = rd.basisLabel; sel.appendChild(bs);
        { sel.appendChild(document.createTextNode(' · ')); const aspan = document.createElement('span'); aspan.className = 'base'; aspan.textContent = angleMode; sel.appendChild(aspan); }   // v14: mostra rad E turns (antes só turns) — convenção de ângulo sempre visível, ANTES do form
        sel.appendChild(document.createTextNode(' · ')); const vsp = document.createElement('span'); vsp.className = 'base'; vsp.textContent = rd.form; sel.appendChild(vsp);   // v12: rótulo de forma (factored/expanded) separado do basisLabel
        if (badge) badge.classList.toggle('show', !!rd.approx);
        if (!status.classList.contains('err'))
          status.textContent = 'buffer: ' + Parser.bufferText() + (SymRules.entries().length ? '    rules: ' + SymRules.entries().length : '');   // v22-9: "[numeric coefficient ≈]" removido — redundante com o badge ≈
        $('historyOut').textContent = History.labels().join('\n') || '(empty)';
        if (showProb) symProb(cs);                          // v21-24: distribuição simbólica/mista no MESMO toggle showProb (symProb trata os casos inválidos com erro próprio); permite LIGAR e DESLIGAR
        return;
      }
    }
    // quântico: vetor de estado simbólico na base POR QUBIT (+ barras opcionais)
    syncQBasis();
    const s = History.current();
    if (evidenceQ !== null && evidenceQ >= s.n){ evidenceQ = null; evidenceBit = null; }   // clamp após mudança de N
    const rd = Render.renderState(s, { phaseFmt, showBars: showProb, qbasis });   // v7: rd.bars = distribuição na base de exibição (reusada como toggle 'prob')
    const matrixView = (viewForm === 'matrix');          // v11: forma matricial tem prioridade e ignora evidência (mostra o vetor completo)
    let approxFlag = rd.approx;
    const math = document.createElement('span');
    if (matrixView){
      const m = Render.matrixTex(s, phaseFmt, qbasis);   // v11: vetor-coluna denso 2^N (cap MAX_TERMS + ⋮)
      disp.dataset.plain = m.plain;
      disp.classList.add('matrix-view');                 // line-height apertado (CSS); .disp-scroll já rola se passar da altura do LCD
      renderMathTex(math, m.tex, m.plain);               // LaTeX pronto (sem re-toKatex)
      approxFlag = m.approx;
    } else {
      disp.classList.remove('matrix-view');
      const exprStr = (evidenceQ !== null && evidenceBit !== null) ? Render.evidenceKet(s, evidenceQ, evidenceBit, phaseFmt, qbasis)   // v3: um ket específico
                    : (evidenceQ !== null) ? Render.evidence(s, evidenceQ, phaseFmt, qbasis)                                           // o qubit todo (ambos os kets)
                    : (viewForm === 'factor') ? Render.factored(s, phaseFmt, qbasis)                                                   // fatorado (não distribui)
                    : rd.dirac;                                                                                                        // expandido
      disp.dataset.plain = exprStr;                      // texto puro (testes + fallback offline)
      renderMath(math, exprStr);                         // KaTeX p/ TODAS as formas (expandido, fatorado/⊗, evidência)
    }
    disp.appendChild(math);
    if (showProb){                                                                // só estado CONCRETO chega aqui (o simbólico renderiza e dá return acima, onde symProb é chamado)
      const pq = (Parser.getSelection() === 'ALL') ? null : Parser.getSelection();   // v21-20: seleção AO VIVO (dinâmico), não snapshot
      if (pq !== null && pq < s.n){                                               // v20 (M2): marginal de 1 qubit — Ops.probQ exato ℤ[ζ₁₆]
        try {
          const r = Ops.probQ(s, pq);
          const fr = (x) => Algebra.format(x, 'rect').text;                       // marginal é real → rect dá fração limpa (lição v18-L1)
          const num = (x) => Algebra.toComplex(x).re;                              // valor numérico p/ a barra ASCII
          const s0 = fr(r.P0), s1 = fr(r.P1), w = Math.max(s0.length, s1.length);   // v21-28: pad dinâmico (sem vão fixo que quebra a linha quando P=1)
          out(`P(Q${r.q}=0) = ${s0.padEnd(w)} ${bar(num(r.P0))}\nP(Q${r.q}=1) = ${s1.padEnd(w)} ${bar(num(r.P1))}`);
        } catch (e){ out('(prob: ' + e.message + ')'); }

  // v13: toggleMode REMOVIDO (calc científica aposentada — sem modo livre; o avaliador sobrevive só na entrada de ângulo/λ)

  // --- esfera de Bloch (visual) ---
  // v17 symBloch (PURO, sem DOM): se o qubit q for CONCRETO e SEPARÁVEL num SymState — fator abstrato
  // |ψ⟩ COMUM a todos os termos (como symProb) e coeficientes NUMÉRICOS puros (sem ψ₀/ψ₁/θ/λ) — extrai
  // o sub-estado concreto como State e devolve {state,q'}; senão null (amplitude simbólica/emaranhado
  // com o fator abstrato → sem Bloch). A pureza/mistura DENTRO do bloco concreto fica a cargo de
  // blochVector (ρ reduzida), idêntico ao caminho concreto. Espelha symProb + reusa blochVector.
  function reducedOneQubit(sym, q){
    if (sym.layout[q] !== 'c') return null;                          // qubit abstrato → sem Bloch
    const cSlots = [], aSlots = [];
    for (let i = 0; i < sym.n; i++) (sym.layout[i] === 'a' ? aSlots : cSlots).push(i);
    const akey = (t) => aSlots.map(i => SymState.slotKey([t.slots[i]])).join('|');
    const k0 = sym.terms.length ? akey(sym.terms[0]) : '';
    if (!sym.terms.every(t => akey(t) === k0)) return null;          // fator abstrato difere ⇒ q emaranhado c/ |ψ⟩
    const amps = new Map();
    for (const t of sym.terms){
      if (t.coef.mono.length !== 1) return null;                     // soma de monômios ⇒ amplitude simbólica
      const m = t.coef.mono[0];
      if (m.syms.length) return null;                                // qualquer símbolo livre (ψ₀,ψ₁,θ,λ) ⇒ não-numérico
      let idx = 0; for (const i of cSlots) idx = (idx << 1) | (+t.slots[i]);

    }

  }
  function showBloch(){          // botão "Bloch": liga/desliga a esfera embutida no LCD
    if (!blochOn){
      const s = History.current();
      if (!s){ showError('the Bloch sphere requires a concrete state'); return; }
      const q = (Parser.getSelection() === 'ALL') ? 0 : Parser.getSelection();
      if (q >= s.n){ showError('selected qubit is out of the state'); return; }
      if (s.sym && !reducedOneQubit(s, q)){ showError('the Bloch sphere needs a concrete, separable qubit (Q' + q + ' has symbolic amplitudes or is entangled with |ψ⟩)'); return; }
      Parser.setSelection(q);                                     // v21-22: abrir Bloch fixa a seleção no qubit mostrado (Bloch+prob+indicador alinhados)
    }

    refresh();                                                    // v21-22: atualiza esfera + prob + indicador de seleção juntos (refresh chama renderBloch)
  }
  // desenha (ou esconde) a esfera do qubit selecionado — chamado a CADA refresh → evolui com o estado e a seleção
  // v20 (M4) — lista qubits "cicláveis" (concreto: todos; SymState: só os separáveis via reducedOneQubit).
  function _blochSeparableQubits(s){

  function renderBloch(){
    const inl = $('blochInline'); if (!inl) return;

                      : { sphere:'#a3d9bd', axis:'#6fae8e', label:'#a3d9bd', vec:'#74dd97', vecMixed:'#4f9f78', text:'#cfeedd' };

    _lastBloch = { v, pal, css, dpr };   // v27: cacheia p/ o drag re-desenhar (redrawBloch) sem re-medir o DOM

  // v27: re-desenha SÓ a esfera (sem re-medir o DOM) com os ângulos de câmera atuais — usado pelo drag de rotação.
  function redrawBloch(){

  // v20 (M4) + v27 — listener ÚNICO do canvas da Bloch:
  //   • DRAG (arrasto além de 8px): rotaciona a CÂMERA — horizontal→azimute, vertical→elevação (clamp p/ não virar).

  (function installBlochTapCycle(){
    const cv = $('blochCanvas'); if (!cv) return;
    const DRAG_THRESH = 8, AZ_PER_PX = 0.011, EL_PER_PX = 0.011, EL_MIN = -1.45, EL_MAX = 1.45, DOUBLE_MS = 280;   // v27: range ~simétrico ±83° (evita degeneração no polo ±90°). EL_MIN negativo libera o swipe-pra-cima (edge-on → ver por baixo); antes 0.05 travava perto do default 0.42 (~10° só pra cima).
    let downX=0, downY=0, downT=0, lastX=0, lastY=0, dragging=false, rafPending=false, lastTapT=0, lastTapCycled=false;
    const sepCycle = (dir) => {   // move a seleção entre qubits separáveis (dir=+1 avança, −1 desfaz); refresh re-renderiza
      const s = History.current(); if (!s) return false;
      const sep = _blochSeparableQubits(s); if (sep.length < 2) return false;
      const curr = (Parser.getSelection() === 'ALL') ? sep[0] : Parser.getSelection();
      const i = sep.indexOf(curr);
      Parser.setSelection(sep[(i + dir + sep.length) % sep.length]);
      refresh();
      return true;
    };

    cv.addEventListener('pointerdown', (e) => {
      downX=lastX=e.clientX; downY=lastY=e.clientY; downT=performance.now(); dragging=false;
    });
    cv.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse' && e.buttons === 0) return;        // mouse em hover (sem botão) não arrasta
      if (!dragging){
        if (Math.abs(e.clientX-downX) + Math.abs(e.clientY-downY) < DRAG_THRESH) return;
        dragging = true; cv.classList.add('grabbing');

      }

      _blochEL = Math.max(EL_MIN, Math.min(EL_MAX, _blochEL + dy * EL_PER_PX));   // vertical → elevação (clamp: não vira a esfera)

    };

      if (dragging){ endDrag(e); return; }                            // foi rotação → não conta como tap
      const dx = Math.abs(e.clientX - downX), dy = Math.abs(e.clientY - downY);
      if (dx + dy >= 10) return;                                       // micro-swipe → ignora

        // se o 1º tap não ciclou, só re-desenha a esfera com os ângulos resetados.
        if (lastTapCycled && sepCycle(-1)){ /* refresh feito dentro de sepCycle */ } else { redrawBloch(); }
        lastTapCycled = false;
        return;
      }

      const r = cv.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;

      if (Math.hypot(e.clientX - cx, e.clientY - cy) > tapRadius){ lastTapCycled = false; return; }
      if (sepCycle(+1)){                                               // v21-22: tap MOVE a seleção (acoplado) → Bloch+prob+indicador seguem; wrap
        lastTapCycled = true;
        if (navigator.vibrate) navigator.vibrate(70);                  // v21-17: tick háptico no tap-cycle (só quando clicável)
      } else lastTapCycled = false;
    });

  // v21-19: SINGLE TAP no estado alterna a fonte para 50% (toggle .state-half) — cabe estados longos sem rolar.
  // Era double-tap (v21-18) mas o double-tap selecionava texto e abria o menu do sistema (discar/traduzir).
  // Tap = pointerup SEM movimento (>10px = swipe/scroll → ignora) e curto (<500ms = não é long-press de seleção).
  // user-select/touch-callout:none no CSS já impedem a seleção/menu.
  (function installStateFontToggle(){
    const sd = $('stateDisplay'); if (!sd) return;

    sd.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = false; });
