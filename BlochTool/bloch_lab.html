const PhaseSinePanel = (() => {
  const TWO_PI     = 2 * Math.PI;
  const OMEGA      = TWO_PI * 0.5;   // 0.5 Hz artificial carrier
  const SLIP_MS    = 600;            // phase-slip duration; matches BlochRenderer animation
  const SHOT_RATE  = 24;             // average shots per second
  const WINDOW_SEC = 2.5;            // seconds of shot history visible
  const DOT_RADIUS = 2.0;

  let _canvas, _ctx, _badgeEl, _angleDeg = false;
  let _rafId = null, _t0 = 0, _lastFrameSec = 0;
  let _thetaFrom = 0, _thetaTo = 0;
  let _phiFrom   = 0, _phiTo   = 0;
  let _slipStart = -Infinity;
  let _shots     = [];
  let _shotAccum = 0;

  function init(container) {
    container.innerHTML = `
      <div class="card">
        <h3>Phase · State and Measurement</h3>
        <div class="phase-sine-wrap">
          <canvas id="phase-sine-canvas"
            title="Left — phasor of the coherence ρ₀₁ in the rotating frame (length = sin θ / 2, angle = ωt − φ). Right — Ramsey σₓ readout: smooth curves are the expectations, dots are individual Bernoulli-sampled binary measurements."></canvas>
          <div class="phase-sine-legend">
            <span class="legend-ref"
              title="Classical LO reference: unit amplitude, zero phase. Drawn smooth because classical oscillators have no shot noise.">— reference</span>
            <span class="legend-tx"
              title="Quantum expectation ⟨σₓ⟩(t) = sin(θ) · cos(ωt − φ). Amplitude sin(θ) is twice the coherence magnitude |ρ₀₁| — maximum on the equator, zero at the poles. Dots are actual ±1 Ramsey outcomes; the smooth curve is the theoretical fit.">— transmon</span>
            <span id="phase-sine-badge" class="phase-sine-badge"
              title="Relative phase between the |0⟩ and |1⟩ amplitudes. Equals the Bloch azimuth φ (mod 2π).">Δφ = 0.000</span>
          </div>
        </div>
      </div>`;

    _canvas  = document.getElementById('phase-sine-canvas');
    _ctx     = _canvas.getContext('2d');
    _badgeEl = document.getElementById('phase-sine-badge');

    _resize();
    window.addEventListener('resize', _resize);

    _t0 = performance.now();
    _rafId = requestAnimationFrame(_tick);
  }

  function update(state, opts) {
    const animate = opts && opts.animate === true;
    if (animate) {
      _thetaFrom = _currentTheta();
      _phiFrom   = _currentPhi();
      _thetaTo   = state.theta;
      let d = state.phi - _phiFrom;
      while (d >  Math.PI) d -= TWO_PI;
      while (d < -Math.PI) d += TWO_PI;
      _phiTo     = _phiFrom + d;
      _slipStart = performance.now();
    } else {
      _thetaFrom = _thetaTo = state.theta;
      _phiFrom   = _phiTo   = state.phi;
      _slipStart = -Infinity;
    }
    _updateBadge();
  }

  function setAngleUnit(deg) { _angleDeg = deg; _updateBadge(); }

  function _slipProgress() {
    const elapsed = performance.now() - _slipStart;
    return Math.max(0, Math.min(1, elapsed / SLIP_MS));
  }
  function _currentTheta() { return _thetaFrom + (_thetaTo - _thetaFrom) * _slipProgress(); }
  function _currentPhi()   { return _phiFrom   + (_phiTo   - _phiFrom)   * _slipProgress(); }

  function _resize() {
    if (!_canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const w   = _canvas.clientWidth;
    const h   = _canvas.clientHeight;
    _canvas.width  = Math.max(1, Math.floor(w * dpr));
    _canvas.height = Math.max(1, Math.floor(h * dpr));
    _ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function _tick(now) {
    _rafId = requestAnimationFrame(_tick);
    const nowSec = (now - _t0) / 1000;
    const dtSec  = _lastFrameSec === 0 ? 0 : nowSec - _lastFrameSec;
    _lastFrameSec = nowSec;
    _emitShots(nowSec, dtSec);
    _pruneShots(nowSec);
    _draw(nowSec);
  }

  function _emitShots(nowSec, dtSec) {
    if (dtSec <= 0) return;
    _shotAccum += SHOT_RATE * dtSec;
    const count = Math.floor(_shotAccum);
    if (count <= 0) return;
    _shotAccum -= count;
    // Each shot stores a fixed seed r ∈ [0,1]; y is resolved each frame against
    // the current P(t, θ, φ), so phase changes slide the whole cluster coherently.
    for (let i = 0; i < count; i++) {
      const tEmit = nowSec - (i / count) * dtSec;
      _shots.push({ t: tEmit, r: Math.random() });
    }
  }

  function _pruneShots(nowSec) {
    const cutoff = nowSec - WINDOW_SEC;
    while (_shots.length > 0 && _shots[0].t < cutoff) _shots.shift();
  }

  function _themeColors() {
    const css = getComputedStyle(document.body);
    const dim = (css.getPropertyValue('--label-dim') || '#6a90b0').trim();
    return {
      ref:  (css.getPropertyValue('--heading')        || '#00e5ff').trim(),
      tx:   (css.getPropertyValue('--btn-gate-color') || '#b57bee').trim(),
      axis: dim,
    };
  }

  function _draw(nowSec) {
    const W = _canvas.clientWidth;
    const H = _canvas.clientHeight;
    if (W === 0 || H === 0) return;

    const { ref, tx, axis } = _themeColors();
    _ctx.clearRect(0, 0, W, H);

    const padX    = 6, padY = 6;
    const plotH   = H - 2 * padY;
    const phasorW = Math.min(plotH, W * 0.4);
    const gap     = 10;
    const shotX0  = padX + phasorW + gap;
    const shotW   = W - shotX0 - padX;

    const theta  = _currentTheta();
    const phi    = _currentPhi();
    const sinTh  = Math.sin(theta);
    const phase0 = OMEGA * nowSec;

    _drawPhasor(padX, padY, phasorW, plotH, phase0, sinTh, phi, ref, tx, axis);
    _drawShotPlot(shotX0, padY, shotW, plotH, nowSec, sinTh, phi, ref, tx, axis);

    if (Math.abs(sinTh) < 0.02) {
      _ctx.fillStyle    = axis;
      _ctx.globalAlpha  = 0.55;
      _ctx.font         = "10px 'Special Elite', 'Courier Prime', monospace";
      _ctx.textAlign    = 'center';
      _ctx.textBaseline = 'middle';
      _ctx.fillText('no coherence · energy eigenstate', shotX0 + shotW / 2, padY + plotH / 2);
      _ctx.globalAlpha  = 1;
    }
  }

  function _drawPhasor(x0, y0, w, h, phase0, sinTh, phi, refC, txC, axisC) {
    const cx = x0 + w / 2;
    const cy = y0 + h / 2;
    const R  = Math.min(w, h) / 2 * 0.82;

    _ctx.strokeStyle = axisC;
    _ctx.globalAlpha = 0.3;
    _ctx.lineWidth   = 1;
    _ctx.beginPath();
    _ctx.arc(cx, cy, R, 0, TWO_PI);
    _ctx.stroke();
    _ctx.globalAlpha = 1;

    _drawArrow(cx, cy, cx + R * Math.cos(phase0), cy - R * Math.sin(phase0), refC);
    const txAng = phase0 - phi;
    _drawArrow(cx, cy, cx + R * sinTh * Math.cos(txAng), cy - R * sinTh * Math.sin(txAng), txC);
  }

  function _drawArrow(x1, y1, x2, y2, color) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 2) {
      _ctx.fillStyle = color;
      _ctx.beginPath();
      _ctx.arc(x1, y1, 2.8, 0, TWO_PI);
      _ctx.fill();
      return;
    }
    _ctx.strokeStyle = color;
    _ctx.fillStyle   = color;
    _ctx.lineWidth   = 1.6;
    _ctx.beginPath();
    _ctx.moveTo(x1, y1);
    _ctx.lineTo(x2, y2);
    _ctx.stroke();
    const head = 5.5;
    const ang  = Math.atan2(dy, dx);
    _ctx.beginPath();
    _ctx.moveTo(x2, y2);
    _ctx.lineTo(x2 - head * Math.cos(ang - Math.PI / 6), y2 - head * Math.sin(ang - Math.PI / 6));
    _ctx.lineTo(x2 - head * Math.cos(ang + Math.PI / 6), y2 - head * Math.sin(ang + Math.PI / 6));
    _ctx.closePath();
    _ctx.fill();
  }

  function _drawShotPlot(x0, y0, w, h, nowSec, sinTh, phi, refC, txC, axisC) {
    const midY = y0 + h / 2;
    const ampY = h / 2 * 0.85;

    _ctx.strokeStyle = axisC;
    _ctx.globalAlpha = 0.2;
    _ctx.lineWidth   = 1;
    _ctx.beginPath();
    _ctx.moveTo(x0, midY);
    _ctx.lineTo(x0 + w, midY);
    _ctx.stroke();
    _ctx.globalAlpha = 1;

    const steps = Math.max(40, Math.floor(w));

    _ctx.strokeStyle = refC;
    _ctx.globalAlpha = 0.55;
    _ctx.lineWidth   = 1.2;
    _ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u    = i / steps;
      const tAt  = nowSec - WINDOW_SEC * (1 - u);
      const yRef = Math.cos(OMEGA * tAt);
      const px   = x0 + u * w;
      const py   = midY - yRef * ampY;
      if (i === 0) _ctx.moveTo(px, py); else _ctx.lineTo(px, py);
    }
    _ctx.stroke();

    // Transmon expected value ⟨σ_x⟩(t) — theoretical fit, kept very faint so
    // the dots (actual measurements) are the visual anchor.
    _ctx.strokeStyle = txC;
    _ctx.globalAlpha = 0.15;
    _ctx.lineWidth   = 1.2;
    _ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u   = i / steps;
      const tAt = nowSec - WINDOW_SEC * (1 - u);
      const yTx = sinTh * Math.cos(OMEGA * tAt - phi);
      const px  = x0 + u * w;
      const py  = midY - yTx * ampY;
      if (i === 0) _ctx.moveTo(px, py); else _ctx.lineTo(px, py);
    }
    _ctx.stroke();
    _ctx.globalAlpha = 1;

    _ctx.fillStyle = txC;
    for (const shot of _shots) {
      const age = nowSec - shot.t;
      if (age < 0 || age > WINDOW_SEC) continue;
      const u     = 1 - age / WINDOW_SEC;
      const pPlus = 0.5 * (1 + sinTh * Math.cos(OMEGA * shot.t - phi));
      const yBit  = shot.r < pPlus ? +1 : -1;
      const px    = x0 + u * w;
      const py    = midY - yBit * ampY;
      const alpha = Math.min(1, 2.5 * u);
      _ctx.globalAlpha = alpha * 0.92;
      _ctx.beginPath();
      _ctx.arc(px, py, DOT_RADIUS, 0, TWO_PI);
      _ctx.fill();
    }
    _ctx.globalAlpha = 1;
  }

  function _updateBadge() {
    if (!_badgeEl) return;
    const phiTarget = ((_phiTo % TWO_PI) + TWO_PI) % TWO_PI;
    const val = _angleDeg
      ? `${(phiTarget * 180 / Math.PI).toFixed(1)}°`
      : phiTarget.toFixed(3);
    _badgeEl.textContent = `Δφ = ${val}`;
  }

  return { init, update, setAngleUnit };
})();

// ─────────────────────────────────────────────────────────────────────────────
// URLCodec.js
// ─────────────────────────────────────────────────────────────────────────────
const URLCodec = (() => {
  function decode() {
    const params = new URLSearchParams(location.search);
    if (!params.has('t') || !params.has('p')) return null;
    const theta = parseFloat(params.get('t'));
    const phi   = parseFloat(params.get('p'));
    if (isNaN(theta) || isNaN(phi)) return null;
    const gateSequence = [];
    const gStr = params.get('g') || '';
    if (gStr) {
      for (const token of gStr.split(',')) {
        if (!token.trim()) continue;
        const [name, thetaStr] = token.split(':');
        const gParams = thetaStr !== undefined ? { theta: parseFloat(thetaStr) } : {};
        if (!isNaN(gParams.theta ?? 0)) {
          gateSequence.push({ name: name.trim(), params: gParams });
        }
      }
    }
    return { initialState: { theta, phi }, gateSequence };
  }

  return { decode };
})();

// ─────────────────────────────────────────────────────────────────────────────
// App.js — Bootstrap
// ─────────────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const qubitState  = createQubitState();
  const gateHistory = createGateHistory();

  BlochRenderer.init(document.getElementById('bloch-canvas'));
  FormalisPanel.init(document.getElementById('formalis-panel-container'));

  StateInput.init(
    document.getElementById('state-input-container'),
    qubitState, gateHistory, BlochRenderer, FormalisPanel
  );

  GatePanel.init(
    document.getElementById('gate-panel-container'),
    qubitState, gateHistory, BlochRenderer, FormalisPanel
  );

  MeasurementController.init(
    document.getElementById('measurement-container'),
    qubitState, gateHistory, FormalisPanel, BlochRenderer
  );

  PhaseSinePanel.init(document.getElementById('phase-sine-container'));
  PhaseSinePanel.update(qubitState.getState());
  qubitState.subscribe((s, opts) => PhaseSinePanel.update(s, opts));

  // Gate history card
  const histCont = document.getElementById('gate-history-container');
  histCont.innerHTML = `
    <div class="card">
      <h3>Gate History</h3>
      <div class="row-gap" style="margin-bottom:8px">
        <button class="primary" id="undo-btn">↩ Undo</button>
        <button class="primary" id="clear-btn">Clear</button>
      </div>
      <div class="history-list" id="history-list">
        <span class="history-empty">No gates applied</span>
      </div>
    </div>`;

  gateHistory.subscribe(history => {
    const el = document.getElementById('history-list');
    if (!el) return;
    if (history.length === 0) {
      el.innerHTML = '<span class="history-empty">No gates applied</span>';
      return;
    }
    const MAX_VISIBLE = 5;
    const start   = Math.max(0, history.length - MAX_VISIBLE);
    const visible = history.slice(start);
    const chips   = visible.map((g, j) => {
      const i = start + j;
      const label = g.params?.theta !== undefined
        ? `${g.name}(${g.params.theta.toFixed(3)})`
        : g.name;
      return `<span class="history-chip">${i + 1}.${label}</span>`;
    });
    if (start > 0) {
      chips.unshift(`<span class="history-chip" title="${start} earlier gate(s) hidden">…</span>`);
    }
    el.innerHTML = chips.join('');
  });

  document.getElementById('undo-btn').addEventListener('click', () => {
    const oldState = qubitState.getState();
    const undoResult = gateHistory.undo();
    if (!undoResult) return;
    qubitState.setState(undoResult.theta, undoResult.phi, { animate: true });
    const newState = qubitState.getState();
    FormalisPanel.setLoading(true);
    BlochRenderer.animateTransition(oldState, newState, () => {
      FormalisPanel.setLoading(false);
      FormalisPanel.update(newState, null);
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    const init = gateHistory.getInitialState();
    gateHistory.clear();
    qubitState.setState(init.theta, init.phi);
    BlochRenderer.resetBasis();
    BlochRenderer.updateArrow(init.theta, init.phi);
    FormalisPanel.update(qubitState.getState(), null);
  });

  // URL state restore
  const urlData = URLCodec.decode();
  if (urlData) {
    const { initialState, gateSequence } = urlData;
    qubitState.setState(initialState.theta, initialState.phi);
    gateHistory.setInitialState(initialState.theta, initialState.phi);
    for (const gate of gateSequence) {
      try {
        const U = getMatrix(gate.name, gate.params?.theta);
        qubitState.applyGate(U);
        gateHistory.push({ name: gate.name, params: gate.params, matrix: U });
      } catch { /* skip unknown/invalid gates */ }
    }
  }

  // Initial render
  const initState = qubitState.getState();
  BlochRenderer.resetBasis();
  BlochRenderer.updateArrow(initState.theta, initState.phi);
  FormalisPanel.update(initState, null);

  // ── Theme toggle ──────────────────────────────────────────────────────────
  const toggleBtn = document.getElementById('theme-toggle');
  if (localStorage.getItem('blocktoy-theme') === 'light') {
    document.body.classList.add('light');
    BlochRenderer.setLightMode(true);
    toggleBtn.textContent = '☾ Dark';
  }
  toggleBtn.addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light');
    BlochRenderer.setLightMode(isLight);
    localStorage.setItem('blocktoy-theme', isLight ? 'light' : 'dark');
    toggleBtn.textContent = isLight ? '☾ Dark' : '☀ Light';
  });

  // ── Angle unit toggle ─────────────────────────────────────────────────────
  const angleBtn = document.getElementById('angle-unit-toggle');
  let _angleDeg  = localStorage.getItem('blocktoy-angle-unit') === 'deg';

  function _applyAngleUnit() {
    FormalisPanel.setAngleUnit(_angleDeg);
    StateInput.setAngleUnit(_angleDeg);
    GatePanel.setAngleUnit(_angleDeg);
    PhaseSinePanel.setAngleUnit(_angleDeg);
    angleBtn.textContent = _angleDeg ? 'rad' : '°';
  }

  if (_angleDeg) _applyAngleUnit();

  angleBtn.addEventListener('click', () => {
    _angleDeg = !_angleDeg;
    localStorage.setItem('blocktoy-angle-unit', _angleDeg ? 'deg' : 'rad');
    _applyAngleUnit();
  });

  // ── Global phase ring toggle ─────────────────────────────────────────────
  // The global phase γ = arg(α) is unobservable on an isolated qubit — it only
  // becomes relative (and measurable) in multi-qubit / interferometric settings.
  // Default off; user can opt in for pedagogy around T/S and phase-kickback.
  const phaseBtn = document.getElementById('global-phase-toggle');
  let _phaseOn   = localStorage.getItem('blocktoy-global-phase') === 'on';
  function _applyPhaseVisible() {
    BlochRenderer.setGlobalPhaseVisible(_phaseOn);
    phaseBtn.textContent = _phaseOn ? 'γ on' : 'γ off';
  }
  _applyPhaseVisible();
  phaseBtn.addEventListener('click', () => {
    _phaseOn = !_phaseOn;
    localStorage.setItem('blocktoy-global-phase', _phaseOn ? 'on' : 'off');
    _applyPhaseVisible();
  });

  // ── Auto-rotate toggle ───────────────────────────────────────────────────
  const spinBtn = document.getElementById('autorotate-toggle');
  let _spinOn   = localStorage.getItem('blocktoy-autorotate') === 'on';
  function _applyAutoRotate() {
    BlochRenderer.setAutoRotate(_spinOn);
    spinBtn.textContent = _spinOn ? '↻ on' : '↻ off';
  }
  _applyAutoRotate();
  spinBtn.addEventListener('click', () => {
    _spinOn = !_spinOn;
    localStorage.setItem('blocktoy-autorotate', _spinOn ? 'on' : 'off');
    _applyAutoRotate();
  });
});
  </script>
</body>
</html>
